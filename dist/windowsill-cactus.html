    return S && S.v === SAVE_VERSION && S.plant ? S : null;
  },
  saveLocal(S) {
    if (!S) return;
    S.updatedAt = Date.now();
    local.set(this.KEY, S);
  },
  clearLocal() { local.remove(this.KEY); },

  /* Resolves the cloud copy (or null). Never throws. */
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return null;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return null;
      const id = await user.id();
      if (!id) return null;
      this.db = db;
      this.ref = db.doc(`data/users/${id}/save`);
      this.cloudOn = true;
      const snap = await this.ref.get();
      const data = snap.exists ? snap.data() : null;
      return data && data.v === SAVE_VERSION && data.plant ? JSON.parse(JSON.stringify(data)) : null;
    } catch (e) {
      this.cloudOn = false;
      return null;
    }
  },

  /* One write at a time; later calls coalesce into the next write. */
  saveCloud(S) {
    if (!this.cloudOn || !S) return;
    this.pending = S;
    if (this.writing) return;
    this.writing = true;
    this.chain = this.chain.then(async () => {
      while (this.pending) {
        const snap = JSON.parse(JSON.stringify(this.pending));
        this.pending = null;
        try {
          await this.ref.set(snap);
        } catch (e) {
          if (e?.code === 'invalid_argument' || e?.code === 'revoked' || e?.code === 'not_granted') this.cloudOn = false;
          if (e?.code === 'unavailable') { await sleep(1500 + Math.random() * 1500); try { await this.ref.set(snap); } catch { /* try next time */ } }
          break;
        }
      }
      this.writing = false;
    });
  },

  async clearCloud() {
    if (!this.cloudOn) return;
    try { await this.ref.delete(); } catch { /* ignore */ }
  },
};

// ---- room.js ----
/* The realistic room: wall, trim, jambs, wood sill, and the double-hung window.
   Static layers are painted to canvases on resize; lighting is applied with CSS. */

const Room = {
  L: null, // layout
  dpr: 1,
  wallBase: '#D3C3AE',
  woodTex: null,
  noise: makeNoise(7),
  noise2: makeNoise(19),

  layout(W, H) {
    const portrait = H > W * 1.05;
    let ow, oh, oy;
    if (portrait) {
      ow = W * 0.86;
      oy = Math.max(56, H * 0.1);
      oh = H * 0.5;
    } else {
      ow = Math.min(W * 0.64, H * 1.2);
      oy = H * 0.07;
      oh = H * 0.6;
    }
    const ox = (W - ow) / 2;
    const cw = clamp(ow * 0.058, 13, 44);
    const vp = { x: W / 2, y: oy + oh * 0.3 };
    const Yb = oy + oh;
    const stoolBand = clamp(H * 0.11, 58, 120);
    const fj = 1 - (stoolBand * 0.42) / (Yb - vp.y);
    const fn = 1 + (stoolBand * 0.58) / (Yb - vp.y);
    const P = (x, y, f) => ({ x: vp.x + (x - vp.x) * f, y: vp.y + (y - vp.y) * f });
    const i0 = P(ox, oy, fj), i1 = P(ox + ow, Yb, fj);
    const inner = { x: i0.x, y: i0.y, w: i1.x - i0.x, h: i1.y - i0.y };
    const horn = cw * 0.55;
    const outerL = ox - cw, outerR = ox + ow + cw;
    const fl = P(outerL - horn, Yb, fn), fr = P(outerR + horn, Yb, fn);
    const noseH = clamp(H * 0.02, 9, 20);
    const stool = {
      backY: inner.y + inner.h, frontY: fl.y, wallY: Yb,
      backL: inner.x, backR: inner.x + inner.w,
      wallL: outerL - horn, wallR: outerR + horn,
      frontL: fl.x, frontR: fr.x, noseH,
      fj, fn,
    };
    const apron = { x: outerL, y: stool.frontY + noseH, w: outerR - outerL, h: cw * 1.25 };
    const potY = lerp(stool.backY, stool.frontY, 0.56);
    const unit = clamp(ow / 780, 0.55, 1.3) * (portrait ? 1.15 : 1);
    return { W, H, portrait, ox, oy, ow, oh, cw, vp, Yb, inner, stool, apron, potX: W / 2, potY, unit, P, fj, fn };
  },

  woodTexture() {
    if (this.woodTex) return this.woodTex;
    const w = 2048, h = 220;
    const c = makeCanvas(w, h), g = c.getContext('2d');
    const img = g.createImageData(w, h);
    const n = this.noise, n2 = this.noise2;
    const dark = [112, 68, 34], light = [214, 162, 104];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const warp = fbm(n, x * 0.0016, y * 0.02, 4) * 70 + Math.sin(x * 0.0012 + y * 0.013) * 8;
        const ring = Math.pow(0.5 + 0.5 * Math.sin((y + warp) * 0.55), 4);
        const fiber = n2(x * 0.03, y * 2.2) * 0.5 + 0.5;
        const figure = fbm(n2, x * 0.0007, y * 0.006, 3) * 0.5 + 0.5;
        const t = clamp(0.22 + ring * 0.5 + (fiber - 0.5) * 0.34, 0, 1);
        let k = 0.9 + figure * 0.2;
        if (n(x * 0.8, y * 4.1) > 0.55) k *= 0.82; // open pores
        const i = (y * w + x) * 4;
        img.data[i] = lerp(light[0], dark[0], t) * k;
        img.data[i + 1] = lerp(light[1], dark[1], t) * k;
        img.data[i + 2] = lerp(light[2], dark[2], t) * k;
        img.data[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    this.woodTex = c;
    return c;
  },

  /* Paint colour for trim at profile position t (0 = wall side, 1 = opening side). */
  trimShade(t, bias = 0) {
    let v;
    if (t < 0.05) v = 0.7;
    else if (t < 0.3) { const u = (t - 0.05) / 0.25; v = 0.86 + Math.sin(u * Math.PI) * 0.12 - u * 0.03; }
    else if (t < 0.34) v = 0.8;
    else if (t < 0.9) v = 0.95 - (t - 0.34) * 0.05;
    else if (t < 0.94) v = 1.0;
    else v = 0.78;
    v = clamp(v + bias, 0, 1.05);
    const W = [246, 243, 236];
    return `rgb(${Math.round(W[0] * v)},${Math.round(W[1] * v)},${Math.round(W[2] * v)})`;
  },

  paint(canvas, L, wallColor) {
    const dpr = this.dpr;
    const g = canvas.getContext('2d');
    canvas.width = Math.round(L.W * dpr);
    canvas.height = Math.round(L.H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.paintWall(g, L, wallColor);
    this.paintCasing(g, L);
    this.paintJambs(g, L);
    this.paintStool(g, L);
    // The sash plane is drawn on the window canvas underneath.
    g.clearRect(L.inner.x, L.inner.y, L.inner.w, L.inner.h);
  },

  paintWall(g, L, base) {
    const { W, H } = L;
    g.fillStyle = base;
    g.fillRect(0, 0, W, H);
    // Plaster texture: soft blotches plus fine grain, baked at low resolution then scaled.
    const tw = Math.ceil(W / 3), th = Math.ceil(H / 3);
    const t = makeCanvas(tw, th), tg = t.getContext('2d');
    const img = tg.createImageData(tw, th);
    const n = this.noise, n2 = this.noise2;
    for (let y = 0; y < th; y++) {
      for (let x = 0; x < tw; x++) {
        const big = fbm(n, x * 0.012, y * 0.012, 3);
        const fine = n2(x * 0.9, y * 0.9);
        const v = big * 0.55 + fine * 0.35;
        const i = (y * tw + x) * 4;
        const c = v > 0 ? 255 : 0;
        img.data[i] = c; img.data[i + 1] = c; img.data[i + 2] = c;
        img.data[i + 3] = Math.min(255, Math.abs(v) * 70);
      }
    }
    tg.putImageData(img, 0, 0);
    g.save();
    g.globalAlpha = 0.5;
    g.imageSmoothingEnabled = true;
    g.drawImage(t, 0, 0, W, H);
    g.restore();
    // Light falloff away from the window, and a darker floor-ward gradient.
    const cx = L.W / 2, cy = L.oy + L.oh * 0.45;
    const rg = g.createRadialGradient(cx, cy, L.ow * 0.35, cx, cy, Math.max(W, H) * 0.85);
    rg.addColorStop(0, 'rgba(255,248,235,0.18)');
    rg.addColorStop(0.55, 'rgba(0,0,0,0)');
    rg.addColorStop(1, 'rgba(20,15,10,0.35)');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);
    const lg = g.createLinearGradient(0, L.stool.frontY, 0, H);
    lg.addColorStop(0, 'rgba(0,0,0,0)');
    lg.addColorStop(1, 'rgba(20,12,6,0.28)');
    g.fillStyle = lg;
    g.fillRect(0, L.stool.frontY, W, H - L.stool.frontY);
  },

  paintCasing(g, L) {
    const { ox, oy, ow, Yb, cw, dpr } = { ...L, dpr: this.dpr };
    const x0 = ox - cw, y0 = oy - cw, x1 = ox + ow + cw;
    // Soft shadow of the trim on the wall.
    g.save();
    g.shadowColor = 'rgba(40,28,15,0.32)';
    g.shadowBlur = cw * 0.55;
    g.shadowOffsetY = cw * 0.12;
    g.fillStyle = '#e9e4d9';
    g.beginPath();
    g.rect(x0, y0, x1 - x0, Yb - y0);
    g.rect(ox, oy, ow, Yb - oy);
    g.fill('evenodd');
    g.restore();
    // Nested strokes give the moulded profile with mitred corners for free.
    const steps = Math.max(8, Math.round(cw * this.dpr));
    const lw = cw / steps;
    for (let i = 0; i < steps; i++) {
      const t = (i + 0.5) / steps;
      const inset = lw * (i + 0.5);
      g.strokeStyle = this.trimShade(t);
      g.lineWidth = lw + 0.6 / this.dpr;
      g.beginPath();
      g.moveTo(x0 + inset, Yb);
      g.lineTo(x0 + inset, y0 + inset);
      g.lineTo(x1 - inset, y0 + inset);
      g.lineTo(x1 - inset, Yb);
      g.stroke();
    }
    // Mitre joints
    g.strokeStyle = 'rgba(120,110,95,0.28)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(x0, y0); g.lineTo(ox, oy);
    g.moveTo(x1, y0); g.lineTo(ox + ow, oy);
    g.stroke();
    // Faint top light on the head casing, darker legs lower down.
    const lg = g.createLinearGradient(0, y0, 0, Yb);
    lg.addColorStop(0, 'rgba(255,255,255,0.05)');
    lg.addColorStop(1, 'rgba(60,45,30,0.10)');
    g.fillStyle = lg;
    g.beginPath();
    g.rect(x0, y0, x1 - x0, Yb - y0);
    g.rect(ox, oy, ow, Yb - oy);
    g.fill('evenodd');
    void dpr;
  },

  paintJambs(g, L) {
    const { ox, oy, ow, Yb, inner } = L;
    const ix0 = inner.x, iy0 = inner.y, ix1 = inner.x + inner.w, iy1 = inner.y + inner.h;
    const quad = (pts, fill) => {
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
      g.closePath();
      g.fillStyle = fill;
      g.fill();
    };
    // Head jamb (underside, in shade)
    let gr = g.createLinearGradient(0, oy, 0, iy0);
    gr.addColorStop(0, '#c9c2b4'); gr.addColorStop(1, '#ded8cb');
    quad([[ox, oy], [ox + ow, oy], [ix1, iy0], [ix0, iy0]], gr);
    // Side jambs: lit by the window, brighter near the glass
    gr = g.createLinearGradient(ox, 0, ix0, 0);
    gr.addColorStop(0, '#e3ddd0'); gr.addColorStop(1, '#f7f4ec');
    quad([[ox, oy], [ix0, iy0], [ix0, iy1], [ox, Yb]], gr);
    gr = g.createLinearGradient(ox + ow, 0, ix1, 0);
    gr.addColorStop(0, '#ddd6c8'); gr.addColorStop(1, '#f2eee5');
    quad([[ox + ow, oy], [ix1, iy0], [ix1, iy1], [ox + ow, Yb]], gr);
    // Ambient occlusion in the jamb corners
    g.save();
    g.globalCompositeOperation = 'multiply';
    const ao = (x, y, r) => {
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(120,105,85,0.45)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    };
    ao(ix0, iy0, L.cw * 1.4); ao(ix1, iy0, L.cw * 1.4);
    g.restore();
    // Stop beads where the sashes run
    g.strokeStyle = 'rgba(255,255,255,0.8)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(ix0 - 1.5, iy0); g.lineTo(ix0 - 1.5, iy1);
    g.moveTo(ix1 + 1.5, iy0); g.lineTo(ix1 + 1.5, iy1);
    g.stroke();
    g.strokeStyle = 'rgba(90,80,65,0.35)';
    g.beginPath();
    g.moveTo(ix0 - 0.5, iy0); g.lineTo(ix0 - 0.5, iy1);
    g.moveTo(ix1 + 0.5, iy0); g.lineTo(ix1 + 0.5, iy1);
    g.moveTo(ix0, iy0 + 0.5); g.lineTo(ix1, iy0 + 0.5);
    g.stroke();
  },

  paintStool(g, L) {
    const S = L.stool, vp = L.vp;
    const tex = this.woodTexture();
    const Dy = L.Yb - vp.y;
    const rows = Math.ceil((S.frontY - S.backY) * this.dpr);
    const texScale = tex.width / (L.W * 1.25);
    // Outline of the stool top: jamb-width part behind the wall plane, full width in front.
    const leftAt = (y) => (y < S.wallY ? lerp(S.backL, L.ox, invLerp(S.backY, S.wallY, y)) : lerp(S.wallL, S.frontL, invLerp(S.wallY, S.frontY, y)));
    const rightAt = (y) => (y < S.wallY ? lerp(S.backR, L.ox + L.ow, invLerp(S.backY, S.wallY, y)) : lerp(S.wallR, S.frontR, invLerp(S.wallY, S.frontY, y)));
    g.save();
    g.imageSmoothingEnabled = true;
    for (let r = 0; r < rows; r++) {
      const y = S.backY + r / this.dpr;
      const f = (y - vp.y) / Dy; // perspective factor at this row
      const depth = (1 / f - 1) * 6; // world depth, arbitrary units
      const xl = leftAt(y), xr = rightAt(y);
      const wl = vp.x + (xl - vp.x) / f, wr = vp.x + (xr - vp.x) / f;
      const sx = clamp((wl - (L.W / 2 - L.W * 0.62)) * texScale, 0, tex.width - 2);
      const sw = clamp((wr - wl) * texScale, 1, tex.width - sx);
      const sy = clamp(110 + depth * 70, 0, tex.height - 1);
      g.drawImage(tex, sx, sy, sw, 1, xl, y, xr - xl, 1 / this.dpr + 0.35);
    }
    g.restore();
    // Glossy reflection of the bright window near the back, and shading towards the front.
    const clip = new Path2D();
    clip.moveTo(S.backL, S.backY); clip.lineTo(S.backR, S.backY); clip.lineTo(L.ox + L.ow, S.wallY);
    clip.lineTo(S.wallR, S.wallY); clip.lineTo(S.frontR, S.frontY); clip.lineTo(S.frontL, S.frontY);
    clip.lineTo(S.wallL, S.wallY); clip.lineTo(L.ox, S.wallY); clip.closePath();
    g.save();
    g.clip(clip);
    let gr = g.createLinearGradient(0, S.backY, 0, S.frontY);
    gr.addColorStop(0, 'rgba(255,250,240,0.42)');
    gr.addColorStop(0.35, 'rgba(255,248,235,0.12)');
    gr.addColorStop(1, 'rgba(30,15,5,0.18)');
    g.fillStyle = gr;
    g.fillRect(S.wallL - 10, S.backY, S.frontR - S.wallL + 20, S.frontY - S.backY);
    // Contact shadow along the back where the sash sits.
    gr = g.createLinearGradient(0, S.backY, 0, S.backY + 10);
    gr.addColorStop(0, 'rgba(40,25,10,0.45)');
    gr.addColorStop(1, 'rgba(40,25,10,0)');
    g.fillStyle = gr;
    g.fillRect(S.backL, S.backY, S.backR - S.backL, 10);
    // Casing legs cast a little shade on the horns.
    for (const x of [L.ox - L.cw, L.ox + L.ow]) {
      gr = g.createLinearGradient(0, S.wallY, 0, S.wallY + 8);
      gr.addColorStop(0, 'rgba(40,25,10,0.35)');
      gr.addColorStop(1, 'rgba(40,25,10,0)');
      g.fillStyle = gr;
      g.fillRect(x, S.wallY, L.cw, 8);
    }
    g.restore();
    // Front edge (bullnose) and front face
    const nose = S.noseH;
    gr = g.createLinearGradient(0, S.frontY, 0, S.frontY + nose);
    gr.addColorStop(0, 'rgb(214,170,120)');
    gr.addColorStop(0.18, 'rgb(170,112,62)');
    gr.addColorStop(0.7, 'rgb(128,80,40)');
    gr.addColorStop(1, 'rgb(96,58,28)');
    g.fillStyle = gr;
    g.beginPath();
    g.roundRect(S.frontL, S.frontY - 1, S.frontR - S.frontL, nose + 1, [0, 0, nose * 0.35, nose * 0.35]);
    g.fill();
    g.save();
    g.globalAlpha = 0.35;
    g.globalCompositeOperation = 'multiply';
    g.drawImage(tex, 0, 60, tex.width, 30, S.frontL, S.frontY, S.frontR - S.frontL, nose);
    g.restore();
    g.fillStyle = 'rgba(255,235,205,0.55)';
    g.fillRect(S.frontL + 2, S.frontY - 0.5, S.frontR - S.frontL - 4, 1.2);
    // Apron below, then the shadow the nosing throws onto it.
    const A = L.apron;
    const steps = Math.max(8, Math.round(A.h * this.dpr * 0.6));
    for (let i = 0; i < steps; i++) {
      const t = (i + 0.5) / steps;
      g.fillStyle = this.trimShade(1 - t, -0.04);
      g.fillRect(A.x, A.y + (A.h * i) / steps, A.w, A.h / steps + 0.7);
    }
    gr = g.createLinearGradient(0, A.y, 0, A.y + A.h * 1.6);
    gr.addColorStop(0, 'rgba(35,22,10,0.55)');
    gr.addColorStop(0.35, 'rgba(35,22,10,0.18)');
    gr.addColorStop(1, 'rgba(35,22,10,0)');
    g.fillStyle = gr;
    g.fillRect(S.frontL - 12, A.y, S.frontR - S.frontL + 24, A.h * 1.6);
  },

  /* The window itself: upper sash fixed, lower sash raised by `open` (0..1). */
  paintWindow(canvas, L, env) {
    const dpr = this.dpr;
    canvas.width = Math.round(L.W * dpr);
    canvas.height = Math.round(L.H * dpr);
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const I = L.inner;
    const stile = clamp(I.w * 0.055, 8, 34);
    const top = clamp(I.h * 0.05, 8, 30);
    const meet = clamp(I.h * 0.035, 6, 22);
    const bottom = clamp(I.h * 0.07, 10, 40);
    const half = I.h / 2;
    const lift = (env.windowOpen || 0) * (half - bottom * 0.6);
    const geo = { stile, top, meet, bottom, half, lift };
    this.geo = geo;
    // Upper (outer) sash: sits slightly further out, so a touch smaller and shadowed.
    const U = { x: I.x, y: I.y, w: I.w, h: half + meet * 0.5 };
    this.paintSash(g, U, { top, bottom: meet, stile, muntins: 2, outer: true, dirt: env.glassDirt });
    // Screen in the lower half, visible only when the lower sash is raised.
    if (lift > 1) {
      const sy = I.y + half + meet * 0.5 - 2, sh = I.y + I.h - sy;
      g.save();
      g.beginPath();
      g.rect(I.x + 2, I.y + I.h - lift, I.w - 4, lift);
      g.clip();
      g.fillStyle = 'rgba(60,64,66,0.18)';
      g.fillRect(I.x, sy, I.w, sh);
      g.strokeStyle = 'rgba(40,44,46,0.18)';
      g.lineWidth = 0.6;
      g.beginPath();
      for (let x = I.x; x < I.x + I.w; x += 2.2) { g.moveTo(x, sy); g.lineTo(x, sy + sh); }
      for (let y = sy; y < sy + sh; y += 2.2) { g.moveTo(I.x, y); g.lineTo(I.x + I.w, y); }
      g.stroke();
      g.fillStyle = '#8d918f';
      g.fillRect(I.x + 2, I.y + I.h - 5, I.w - 4, 4);
      g.restore();
    }
    // Lower (inner) sash
    const B = { x: I.x, y: I.y + half - meet * 0.5 - lift, w: I.w, h: half + meet * 0.5 };
    // Shadow the lower sash casts on the upper one when raised
    if (lift > 1) {
      g.save();
      g.shadowColor = 'rgba(0,0,0,0.25)';
      g.shadowBlur = 10;
      g.shadowOffsetY = -2;
      g.fillStyle = 'rgba(0,0,0,0.01)';
      g.fillRect(B.x, B.y, B.w, 6);
      g.restore();
    }
    this.paintSash(g, B, { top: meet, bottom, stile, muntins: 0, outer: false, dirt: env.glassDirt, lock: true, lifts: true });
    return geo;
  },

  paintSash(g, R, o) {
    const { x, y, w, h } = R;
    // Glass: faint tint, dirt, and a soft diagonal reflection
    const gx = x + o.stile, gy = y + o.top, gw = w - o.stile * 2, gh = h - o.top - o.bottom;
    g.save();
    g.beginPath();
    g.rect(gx, gy, gw, gh);
    g.clip();
    g.fillStyle = o.outer ? 'rgba(170,200,205,0.10)' : 'rgba(170,200,205,0.07)';
    g.fillRect(gx, gy, gw, gh);
    const refl = g.createLinearGradient(gx, gy, gx + gw, gy + gh);
    refl.addColorStop(0, 'rgba(255,255,255,0)');
    refl.addColorStop(0.38, 'rgba(255,255,255,0)');
    refl.addColorStop(0.45, 'rgba(255,255,255,0.10)');
    refl.addColorStop(0.5, 'rgba(255,255,255,0.03)');
    refl.addColorStop(0.58, 'rgba(255,255,255,0.08)');
    refl.addColorStop(0.64, 'rgba(255,255,255,0)');
    g.fillStyle = refl;
    g.fillRect(gx, gy, gw, gh);
    const dirt = clamp(o.dirt || 0, 0, 100) / 100;
    if (dirt > 0.02) {
      const r = mulberry32(o.outer ? 11 : 23);
      for (let i = 0; i < 70; i++) {
        const px = gx + r() * gw, py = gy + r() * gh, rad = 6 + r() * 40;
        const rg = g.createRadialGradient(px, py, 0, px, py, rad);
        rg.addColorStop(0, `rgba(235,230,215,${0.09 * dirt})`);
        rg.addColorStop(1, 'rgba(235,230,215,0)');
        g.fillStyle = rg;
        g.fillRect(px - rad, py - rad, rad * 2, rad * 2);
      }
      g.fillStyle = `rgba(200,195,180,${0.06 * dirt})`;
      for (let i = 0; i < 400; i++) g.fillRect(gx + r() * gw, gy + r() * gh, 1, 1);
    }
    g.restore();
    // Frame members
    const paint = (px, py, pw, ph, vertical) => {
      const gr = vertical ? g.createLinearGradient(px, 0, px + pw, 0) : g.createLinearGradient(0, py, 0, py + ph);
      gr.addColorStop(0, o.outer ? '#e4dfd4' : '#f3f0e8');
      gr.addColorStop(0.5, o.outer ? '#ece8de' : '#fbf9f4');
      gr.addColorStop(1, o.outer ? '#d8d2c5' : '#e7e2d7');
      g.fillStyle = gr;
      g.fillRect(px, py, pw, ph);
    };
    paint(x, y, o.stile, h, true);
    paint(x + w - o.stile, y, o.stile, h, true);
    paint(x, y, w, o.top, false);
    paint(x, y + h - o.bottom, w, o.bottom, false);
    // Sticking: highlight and shadow lines around the glass
    g.strokeStyle = 'rgba(255,255,255,0.9)';
    g.lineWidth = 1;
    g.strokeRect(gx - 1.5, gy - 1.5, gw + 3, gh + 3);
    g.strokeStyle = 'rgba(110,100,85,0.45)';
    g.strokeRect(gx - 0.5, gy - 0.5, gw + 1, gh + 1);
    g.strokeStyle = 'rgba(150,145,135,0.35)';
    g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    // Muntins (upper sash only)
    if (o.muntins) {
      const mw = clamp(w * 0.013, 3, 9);
      for (let k = 1; k <= o.muntins; k++) {
        const mx = gx + (gw * k) / (o.muntins + 1) - mw / 2;
        const gr = g.createLinearGradient(mx, 0, mx + mw, 0);
        gr.addColorStop(0, '#d9d3c6'); gr.addColorStop(0.45, '#f2eee6'); gr.addColorStop(1, '#cfc8ba');
        g.fillStyle = gr;
        g.fillRect(mx, gy, mw, gh);
      }
    }
    // Hardware
    if (o.lock) {
      const cx = x + w / 2, cy = y + o.top * 0.5;
      const bw = clamp(w * 0.07, 16, 44), bh = clamp(o.top * 0.62, 5, 14);
      const gr = g.createLinearGradient(0, cy - bh / 2, 0, cy + bh / 2);
      gr.addColorStop(0, '#f3d98f'); gr.addColorStop(0.5, '#c9a24a'); gr.addColorStop(1, '#8c6a24');
      g.fillStyle = gr;
      g.beginPath();
      g.roundRect(cx - bw / 2, cy - bh / 2, bw, bh, bh * 0.4);
      g.fill();
      g.fillStyle = 'rgba(255,245,210,0.8)';
      g.fillRect(cx - bw / 2 + 2, cy - bh / 2 + 1, bw - 4, 1);
    }
    if (o.lifts) {
      for (const fx of [0.22, 0.78]) {
        const cx = x + w * fx, cy = y + h - o.bottom * 0.45;
        const lw = clamp(w * 0.05, 10, 30), lh = clamp(o.bottom * 0.32, 4, 11);
        const gr = g.createLinearGradient(0, cy - lh, 0, cy + lh);
        gr.addColorStop(0, '#f6de9a'); gr.addColorStop(1, '#8a6624');
        g.fillStyle = gr;
        g.beginPath();
        g.roundRect(cx - lw / 2, cy - lh / 2, lw, lh, [1, 1, lh / 2, lh / 2]);
        g.fill();
        g.fillStyle = 'rgba(40,30,10,0.25)';
        g.fillRect(cx - lw / 2 + 1, cy + lh / 2, lw - 2, 2);
      }
    }
  },

  /* Glass pane rectangles (for droplets and wiping). */
  panes(L) {
    const I = L.inner, G = this.geo;
    if (!G) return [];
    const { stile, top, meet, bottom, half, lift } = G;
    const up = { x: I.x + stile, y: I.y + top, w: I.w - stile * 2, h: half + meet * 0.5 - top - meet };
    const lowY = I.y + half - meet * 0.5 - lift;
    const low = { x: I.x + stile, y: lowY + meet, w: I.w - stile * 2, h: half + meet * 0.5 - meet - bottom };
    return [up, low];
  },
};

// ---- fx.js ----
/* Scene composition (layers, sky photos, lighting) and animated effects. */

const Scene = {
  el: {},
  photoFront: 'a',
  photoName: null,
  grade: 'day',
  plantKey: '',
  box: { x: 0, y: 0, w: 1, h: 1 },
  sun: null,
  parallax: { x: 0, y: 0, tx: 0, ty: 0 },

  build() {
    const s = $('#scene');
    this.el = {
      scene: s,
      outside: $('#outside'),
      photoA: $('#photoA'),
      photoB: $('#photoB'),
      flash: $('#photoFlash'),
      grade: $('#skyGrade'),
      fxOut: $('#fxOut'),
      interior: $('#interior'),
      win: $('#win'),
      fxGlass: $('#fxGlass'),
      room: $('#room'),
      patch: $('#patch'),
      shadow: $('#plantShadow'),
      plant: $('#plant'),
      fxRoom: $('#fxRoom'),
      roomLight: $('#roomLight'),
      flashRoom: $('#flashRoom'),
      lamp: $('#growLamp'),
      curtain: $('#curtain'),
      sashHit: $('#sashHit'),
      reflect: $('#glassReflect'),
    };
    this.el.flash.src = photoSrc('lightning');
    s.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      this.parallax.tx = (e.clientX / innerWidth - 0.5) * -14;
      this.parallax.ty = (e.clientY / innerHeight - 0.5) * -8;
    });
    this.el.plant.addEventListener('pointerdown', (e) => {
      if (Tools.drag || Tools.busy) return;
      e.preventDefault();
      Game.poke();
    });
    this.el.plant.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); Game.poke(); }
    });
    this.initSash();
  },

  layout() {
    const W = innerWidth, H = innerHeight;
    Room.dpr = Math.min(2, window.devicePixelRatio || 1);
    const L = Room.layout(W, H);
    Room.L = L;
    const S = Game.S;
    const wall = WALL_COLORS[S?.env.wall || 'plaster'].base;
    Room.paint(this.el.room, L, wall);
    this.repaintWindow();
    const I = L.inner, m = 26;
    this.box = { x: I.x - m, y: I.y - m, w: I.w + m * 2, h: I.h + m * 2 };
    Object.assign(this.el.outside.style, { left: `${this.box.x}px`, top: `${this.box.y}px`, width: `${this.box.w}px`, height: `${this.box.h}px` });
    for (const c of [this.el.fxOut, this.el.fxGlass, this.el.fxRoom, this.el.patch]) {
      c.width = Math.round(W * Room.dpr);
      c.height = Math.round(H * Room.dpr);
    }
    Object.assign(this.el.curtain.style, { left: `${I.x}px`, top: `${I.y - 4}px`, width: `${I.w}px`, height: `${I.h + 4}px` });
    Object.assign(this.el.reflect.style, { left: `${I.x}px`, top: `${I.y}px`, width: `${I.w}px`, height: `${I.h}px` });
    const lampSize = clamp(L.ow * 0.16, 70, 150);
    Object.assign(this.el.lamp.style, { left: `${L.ox + L.ow + L.cw * 0.4 - lampSize * 0.55}px`, top: `${L.oy + L.oh * 0.18}px`, width: `${lampSize}px`, height: `${lampSize}px` });
    this.placePlant();
    this.placeSash();
    FX.resize(L);
    document.documentElement.style.setProperty('--sill-y', `${L.stool.frontY}px`);
    document.documentElement.style.setProperty('--win-top', `${L.oy - L.cw}px`);
    document.documentElement.style.setProperty('--win-left', `${L.ox - L.cw}px`);
    document.documentElement.style.setProperty('--win-right', `${W - (L.ox + L.ow + L.cw)}px`);
    this.plantKey = '';
    if (S) { this.renderPlant(S, Game.mood, true); this.updateLight(true); }
  },

  repaintWindow() {
    if (!Room.L || !Game.S) return;
    Room.paintWindow(this.el.win, Room.L, Game.S.env);
    this.placeSash();
  },

  placePlant() {
    const L = Room.L;
    const box = [-230, -580, 460, 660];
    const u = L.unit;
    const w = box[2] * u, h = box[3] * u;
    for (const n of [this.el.plant, this.el.shadow]) {
      Object.assign(n.style, { left: `${L.potX + box[0] * u}px`, top: `${L.potY + box[1] * u}px`, width: `${w}px`, height: `${h}px` });
    }
    this.el.shadow.style.transformOrigin = `${-box[0] * u}px ${-box[1] * u}px`;
  },

  /* Screen rect of the plant body (for aiming tools). */
  plantRect() {
    const g = this.el.plant.querySelector('.plant-g');
    if (g) {
      const r = g.getBoundingClientRect();
      if (r.width > 4) return { x: r.x, y: r.y, w: r.width, h: r.height };
    }
    const L = Room.L;
    return { x: L.potX - 50, y: L.potY - 200, w: 100, h: 160 };
  },
  potTop() {
    const L = Room.L, S = Game.S;
    const pw = POT_SIZES[S?.plant.pot.size || 0].w;
    return { x: L.potX, y: L.potY - pw * 0.82 * L.unit + 6 * L.unit };
  },

  highlight(target) {
    this.el.plant.classList.toggle('target', target === 'plant');
    this.el.scene.classList.toggle('target-glass', target === 'glass');
  },
  spin() {
    const p = this.el.plant;
    p.classList.remove('spin');
    void p.offsetWidth;
    p.classList.add('spin');
  },
  squish() {
    const p = this.el.plant;
    p.classList.remove('squish');
    void p.offsetWidth;
    p.classList.add('squish');
  },

  renderPlant(S, mood, force = false) {
    const v = Plant.visual(S, { mood });
    const key = JSON.stringify(v);
    if (!force && key === this.plantKey) return;
    this.plantKey = key;
    const svg = Plant.svg(v);
    this.el.plant.innerHTML = svg;
    this.el.shadow.innerHTML = svg;
  },

  /* ---------- sky photos ---------- */
  setSky(scene, instant = false) {
    const { photo, grade } = scene;
    const G = GRADES[grade] || GRADES.day;
    const front = this.photoFront === 'a' ? this.el.photoA : this.el.photoB;
    const back = this.photoFront === 'a' ? this.el.photoB : this.el.photoA;
    this.el.grade.style.background = G.overlay;
    this.el.grade.style.mixBlendMode = G.blend;
    if (photo === this.photoName) {
      front.style.filter = G.filter;
      this.grade = grade;
      return;
    }
    this.photoName = photo;
    this.grade = grade;
    const meta = PHOTOS[photo];
    back.style.objectPosition = meta.focus;
    back.style.filter = G.filter;
    const show = () => {
      back.classList.add('on');
      front.classList.remove('on');
      this.photoFront = this.photoFront === 'a' ? 'b' : 'a';
      FX.photo = back;
    };
    back.style.transition = instant ? 'none' : '';
    front.style.transition = instant ? 'none' : '';
    if (back.getAttribute('src') !== photoSrc(photo)) {
      back.onload = show;
      back.onerror = show;
      back.src = photoSrc(photo);
    } else show();
    UI.setCredit(photo);
  },

  /* Displayed rect of the current photo, for droplet refraction. */
  photoMap() {
    const img = FX.photo;
    if (!img || !img.naturalWidth) return null;
    const b = this.box;
    const s = Math.max(b.w / img.naturalWidth, b.h / img.naturalHeight);
    const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    const [fx, fy] = (img.style.objectPosition || '50% 50%').split(' ').map((p) => parseFloat(p) / 100);
    return { img, s, x: b.x + (b.w - dw) * (isNaN(fx) ? 0.5 : fx) + this.parallax.x, y: b.y + (b.h - dh) * (isNaN(fy) ? 0.5 : fy) + this.parallax.y };
  },

  /* ---------- lighting ---------- */
  updateLight(force = false) {
    const S = Game.S, L = Room.L;
    if (!S || !L) return;
    const now = Date.now();
    const sun = sunPosition(now, S.home.lat, S.home.lon);
    const w = Game.wx || { cond: 'partly', cloud: 45, precip: 0 };
    const lt = windowLight(sun, w, S.env);
    const day = daylightLevel(sun.el);
    const cloud = (w.cloud ?? 50) / 100;
    const night = 1 - day;
    // Interior exposure: daylight through the window, lamps at night.
    const bright = lerp(0.58, 1.02, day) * (1 - 0.1 * cloud * day) + lt.direct * 0.08;
    const warm = sun.el > -4 && sun.el < 10 ? (1 - Math.abs(sun.el - 3) / 7) * 0.22 * (1 - cloud) : 0;
    const f = `brightness(${bright.toFixed(3)}) saturate(${lerp(0.8, 1, day).toFixed(2)}) sepia(${(warm + night * 0.12).toFixed(3)})`;
    this.el.interior.style.filter = f;
    this.el.shadow.style.filter = '';
    // Warm lamp glow at night, cool daylight wash by day
    const rl = this.el.roomLight;
    rl.style.opacity = (0.25 + night * 0.75).toFixed(2);
    rl.style.background = night > 0.4
      ? `radial-gradient(120% 90% at 8% 0%, rgba(255,190,120,${(0.42 * night).toFixed(2)}), rgba(255,170,90,0) 60%), radial-gradient(60% 50% at 50% ${((L.stool.backY / L.H) * 100).toFixed(0)}%, rgba(255,210,150,${(0.12 * night).toFixed(2)}), rgba(0,0,0,0) 70%)`
      : `radial-gradient(70% 60% at 50% ${(((L.oy + L.oh * 0.5) / L.H) * 100).toFixed(0)}%, rgba(235,245,255,${(0.16 * day).toFixed(2)}), rgba(0,0,0,0) 70%)`;
    rl.style.mixBlendMode = night > 0.4 ? 'soft-light' : 'screen';
    this.sun = { ...sun, direct: lt.direct, rel: lt.rel, day };
    this.el.reflect.style.opacity = (clamp(night * 1.2, 0, 1) * 0.9).toFixed(2);
    this.el.lamp.classList.toggle('on', !!S.env.lamp);
    this.el.scene.classList.toggle('lamp-on', !!S.env.lamp);
    this.el.curtain.classList.toggle('drawn', !!S.env.curtain);
    this.paintPatch();
    void force;
  },

  /* Sun patch on the sill + the plant's cast shadow. */
  paintPatch() {
    const L = Room.L, st = L.stool, c = this.el.patch, g = c.getContext('2d');
    const dpr = Room.dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, L.W, L.H);
    const sun = this.sun || { direct: 0, rel: 0, el: 0 };
    const k = clamp(sun.direct * 2.6, 0, 1);
    const panes = Room.panes(L);
    const low = panes[1];
    // Contact shadow under the pot, always.
    const pw = POT_SIZES[Game.S.plant.pot.size].w * L.unit;
    let rg = g.createRadialGradient(L.potX, L.potY, 0, L.potX, L.potY, pw * 0.75);
    rg.addColorStop(0, 'rgba(30,18,8,0.55)');
    rg.addColorStop(1, 'rgba(30,18,8,0)');
    g.save();
    g.translate(L.potX, L.potY);
    g.scale(1, 0.22);
    g.translate(-L.potX, -L.potY);
    g.fillStyle = rg;
    g.fillRect(L.potX - pw, L.potY - pw, pw * 2, pw * 2);
    g.restore();
    const sh = this.el.shadow;
    if (Game.S.env.lamp) {
      const lr = pw * 1.3;
      const lg2 = g.createRadialGradient(L.potX, L.potY, 0, L.potX, L.potY, lr);
      lg2.addColorStop(0, 'rgba(255,170,235,0.34)');
      lg2.addColorStop(1, 'rgba(255,170,235,0)');
      g.save();
      g.translate(L.potX, L.potY); g.scale(1, 0.32); g.translate(-L.potX, -L.potY);
      g.globalCompositeOperation = 'screen';
      g.fillStyle = lg2;
      g.fillRect(L.potX - lr, L.potY - lr, lr * 2, lr * 2);
      g.restore();
    }
    if (k < 0.04 || !low) {
      sh.style.opacity = '0';
      FX.beam = null;
      return;
    }
    // Light through the lower pane lands on the sill, skewed by the sun's direction.
    const shift = Math.tan(clamp(sun.rel, -70, 70) * DEG) * (st.frontY - st.backY) * 1.6;
    const x0 = low.x, x1 = low.x + low.w;
    const yb = st.backY + (st.frontY - st.backY) * clamp(0.35 - sun.el / 120, 0.05, 0.4);
    const poly = [[x0 - shift * 0.25, yb], [x1 - shift * 0.25, yb], [x1 * 1 - shift + (x1 - L.vp.x) * 0.12, st.frontY], [x0 - shift + (x0 - L.vp.x) * 0.12, st.frontY]];
    g.save();
    g.filter = `blur(${(3 + (1 - k) * 4).toFixed(1)}px)`;
    g.globalCompositeOperation = 'screen';
    const lg = g.createLinearGradient(0, yb, 0, st.frontY);
    lg.addColorStop(0, `rgba(255,236,190,${(0.55 * k).toFixed(2)})`);
    lg.addColorStop(1, `rgba(255,226,170,${(0.32 * k).toFixed(2)})`);
    g.fillStyle = lg;
    g.beginPath();
    poly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.closePath();
    g.fill();
    g.restore();
    // Cast shadow: flattened, skewed copy of the plant falling towards the viewer.
    const skew = clamp(sun.rel * 0.9, -55, 55);
    // Shadow length from sun height, but never longer than the sill in front of the pot.
    const pr = this.plantRect();
    const tall = Math.max(40, L.potY - pr.y);
    const room = (st.frontY - L.potY) * 0.92;
    const want = tall * clamp(0.35 / Math.tan(Math.max(6, sun.el) * DEG), 0.12, 1.2);
    const len = Math.min(want, room) / tall;
    sh.style.opacity = (0.3 * k).toFixed(2);
    sh.style.transform = `scaleY(${(-len).toFixed(3)}) skewX(${skew.toFixed(1)}deg)`;
    FX.beam = { x0, x1, top: low.y + low.h * 0.15, bottom: low.y + low.h, yb, frontY: st.frontY, shift, k };
  },

  /* ---------- window sash dragging ---------- */
  initSash() {
    const hit = this.el.sashHit;
    let startY = 0, startOpen = 0, moved = false;
    const move = (e) => {
      const L = Room.L, G = Room.geo;
      const range = G.half - G.bottom * 0.6;
      const v = clamp(startOpen + (startY - e.clientY) / range, 0, 1);
      if (Math.abs(e.clientY - startY) > 4) moved = true;
      Game.S.env.windowOpen = v;
      this.repaintWindow();
      void L;
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      hit.classList.remove('grab');
      const S = Game.S;
      if (!moved) S.env.windowOpen = S.env.windowOpen > 0.1 ? 0 : 0.6;
      S.env.windowOpen = S.env.windowOpen < 0.08 ? 0 : S.env.windowOpen;
      this.repaintWindow();
      Game.windowChanged();
    };
    hit.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !Game.S) return;
      e.preventDefault();
      startY = e.clientY;
      startOpen = Game.S.env.windowOpen;
      moved = false;
      hit.classList.add('grab');
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  },
  placeSash() {
    const L = Room.L, G = Room.geo;
    if (!L || !G) return;
    const I = L.inner;
    const y = I.y + I.h - G.bottom - G.lift;
    Object.assign(this.el.sashHit.style, { left: `${I.x + I.w * 0.12}px`, top: `${y - 6}px`, width: `${I.w * 0.76}px`, height: `${G.bottom + 12}px` });
  },
};

/* ---------------- animated effects ---------------- */
const FX = {
  photo: null,
  rainI: 0, snowI: 0, fogI: 0, storm: false, wind: 0, frost: 0, fogGlass: 0,
  bright: 1,
  rain: [], snow: [], fogs: [], drops: [], motes: [], parts: [],
  snowDepth: 0,
  beam: null,
  nextFlash: 0, flashAt: -1e9,
  frostTex: null,
  t: 0,

  resize(L) {
    this.L = L;
    this.frostTex = null;
    this.drops = [];
    this.rain = [];
    this.snow = [];
    this.motes = [];
  },

  setWeather(w, grade, S) {
    const c = w?.cond || 'partly';
    const p = w?.precip ?? CONDITIONS[c]?.precip ?? 0;
    this.rainI = WET.has(c) || c === 'storm' ? clamp(p + 0.15, 0.25, 1) : 0;
    this.snowI = SNOWY.has(c) ? clamp(p + 0.2, 0.3, 1) : c === 'sleet' ? 0.35 : 0;
    this.fogI = c === 'fog' ? 1 : c === 'haze' ? 0.25 : 0;
    this.storm = c === 'storm';
    this.wind = clamp((w?.wind ?? (c === 'storm' ? 35 : 10)) / 60, 0, 1);
    const t = w?.tempC;
    this.frost = t != null && t < -2 ? clamp((-2 - t) / 8, 0.15, 0.85) : 0;
    this.fogGlass = t != null && t < 6 && (w?.humidity ?? 60) > 70 ? 0.35 : 0;
    this.bright = { night: 0.3, 'native-night': 0.55, twilight: 0.55, golden: 0.9 }[grade] ?? 1;
    if (!this.storm) this.nextFlash = 0;
    void S;
  },

  active() {
    return this.rainI > 0 || this.snowI > 0 || this.fogI > 0 || this.drops.length > 0 || this.parts.length > 0 || (this.beam && this.beam.k > 0.05) || this.storm || this.snowDepth > 0;
  },

  frame(now, dt) {
    this.t += dt;
    const L = this.L;
    if (!L) return;
    const dpr = Room.dpr;
    const reduce = reducedMotion();
    const go = Scene.el.fxOut.getContext('2d');
    go.setTransform(dpr, 0, 0, dpr, 0, 0);
    go.clearRect(0, 0, L.W, L.H);
    const I = L.inner;
    go.save();
    go.beginPath();
    go.rect(I.x, I.y, I.w, I.h);
    go.clip();
    this.drawFog(go, I, dt);
    this.drawRain(go, I, dt, reduce);
    this.drawSnow(go, I, dt, reduce);
    this.drawSnowBank(go, I, dt);
    go.restore();

    const gg = Scene.el.fxGlass.getContext('2d');
    gg.setTransform(dpr, 0, 0, dpr, 0, 0);
    gg.clearRect(0, 0, L.W, L.H);
    const panes = Room.panes(L);
    this.drawCold(gg, panes);
    this.drawDrops(gg, panes, dt, reduce);

    const gr = Scene.el.fxRoom.getContext('2d');
    gr.setTransform(dpr, 0, 0, dpr, 0, 0);
    gr.clearRect(0, 0, L.W, L.H);
    this.drawBeam(gr, dt, reduce);
    this.drawParts(gr, dt);
    this.lightning(now);
  },

  drawFog(g, I, dt) {
    if (this.fogI <= 0) return;
    if (this.fogs.length < 7) {
      for (let i = 0; i < 7; i++) this.fogs.push({ x: I.x + Math.random() * I.w, y: I.y + I.h * (0.25 + Math.random() * 0.6), rx: I.w * (0.3 + Math.random() * 0.4), ry: I.h * (0.08 + Math.random() * 0.1), v: 6 + Math.random() * 10, a: 0.12 + Math.random() * 0.12 });
    }
    g.fillStyle = `rgba(225,230,235,${(0.14 * this.fogI).toFixed(3)})`;
    g.fillRect(I.x, I.y, I.w, I.h);
    for (const f of this.fogs) {
      f.x += f.v * dt;
      if (f.x - f.rx > I.x + I.w) f.x = I.x - f.rx;
      const rg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.rx);
      rg.addColorStop(0, `rgba(236,240,243,${(f.a * this.fogI * this.bright).toFixed(3)})`);
      rg.addColorStop(1, 'rgba(236,240,243,0)');
      g.save();
      g.translate(f.x, f.y);
      g.scale(1, f.ry / f.rx);
      g.translate(-f.x, -f.y);
      g.fillStyle = rg;
      g.fillRect(f.x - f.rx, f.y - f.rx, f.rx * 2, f.rx * 2);
      g.restore();
    }
  },

  drawRain(g, I, dt, reduce) {
    const want = Math.round((reduce ? 60 : 260) * this.rainI * clamp(I.w * I.h / 400000, 0.4, 1.6));
    while (this.rain.length < want) this.rain.push(this.newStreak(I, true));
    if (this.rain.length > want) this.rain.length = want;
    if (!want) return;
    const slant = 0.12 + this.wind * 0.3;
    g.lineCap = 'round';
    for (const r of this.rain) {
      r.y += r.v * dt;
      r.x += r.v * dt * slant;
      if (r.y - r.len > I.y + I.h || r.x > I.x + I.w + 40) Object.assign(r, this.newStreak(I, false));
      g.strokeStyle = `rgba(215,225,238,${(r.a * (0.35 + 0.65 * this.bright)).toFixed(3)})`;
      g.lineWidth = r.z * 1.2;
      g.beginPath();
      g.moveTo(r.x, r.y);
      g.lineTo(r.x - r.len * slant, r.y - r.len);
      g.stroke();
    }
  },
  newStreak(I, anywhere) {
    const z = 0.3 + Math.random() * 0.7;
    return { x: I.x - 40 + Math.random() * (I.w + 40), y: anywhere ? I.y + Math.random() * I.h : I.y - Math.random() * 60, z, len: (14 + Math.random() * 22) * z, v: (700 + Math.random() * 600) * z, a: (0.18 + Math.random() * 0.3) * z };
  },

  drawSnow(g, I, dt, reduce) {
    const want = Math.round((reduce ? 50 : 220) * this.snowI * clamp(I.w * I.h / 400000, 0.4, 1.6));
    while (this.snow.length < want) this.snow.push(this.newFlake(I, true));
    if (this.snow.length > want) this.snow.length = want;
    for (const f of this.snow) {
      f.y += f.vy * dt;
      f.x += (this.wind * 40 * f.z + Math.sin(this.t * 1.3 + f.ph) * 14 * f.z) * dt;
      if (f.y - f.r > I.y + I.h) Object.assign(f, this.newFlake(I, false));
      const a = (0.55 + 0.45 * f.z) * (0.4 + 0.6 * this.bright);
      if (f.r > 2.2) {
        const rg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 1.6);
        rg.addColorStop(0, `rgba(255,255,255,${a.toFixed(2)})`);
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = rg;
        g.beginPath(); g.arc(f.x, f.y, f.r * 1.6, 0, TAU); g.fill();
      } else {
        g.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
        g.beginPath(); g.arc(f.x, f.y, f.r, 0, TAU); g.fill();
      }
    }
  },
  newFlake(I, anywhere) {
    const z = Math.random();
    return { x: I.x + Math.random() * I.w, y: anywhere ? I.y + Math.random() * I.h : I.y - 10, z, r: 0.7 + z * 2.8, vy: 22 + z * 60, ph: Math.random() * TAU };
  },

  drawSnowBank(g, I, dt) {
    const target = this.snowI > 0 ? 1 : 0;
    this.snowDepth = clamp(this.snowDepth + (target ? dt / 90 : -dt / 300), 0, 1);
    if (this.snowDepth <= 0.01) return;
    const G = Room.geo;
    if (!G) return;
    const base = I.y + I.h - G.bottom;
    const h = 4 + 16 * this.snowDepth;
    g.fillStyle = `rgba(248,250,255,${(0.92 * (0.5 + 0.5 * this.bright)).toFixed(2)})`;
    g.beginPath();
    g.moveTo(I.x, base + 2);
    for (let x = 0; x <= I.w; x += 10) g.lineTo(I.x + x, base - h * (0.75 + 0.25 * Math.sin(x * 0.07) * Math.cos(x * 0.023)));
    g.lineTo(I.x + I.w, base + 2);
    g.closePath();
    g.fill();
  },

  drawCold(g, panes) {
    if (this.frost <= 0 && this.fogGlass <= 0) return;
    for (const p of panes) {
      if (this.fogGlass > 0) {
        const lg = g.createLinearGradient(0, p.y + p.h * 0.55, 0, p.y + p.h);
        lg.addColorStop(0, 'rgba(240,244,248,0)');
        lg.addColorStop(1, `rgba(240,244,248,${(0.4 * this.fogGlass).toFixed(2)})`);
        g.fillStyle = lg;
        g.fillRect(p.x, p.y, p.w, p.h);
      }
      if (this.frost > 0) {
        if (!this.frostTex || this.frostTex.w !== Math.round(p.w)) this.frostTex = { w: Math.round(p.w), c: this.makeFrost(p.w, Math.max(p.h, 60)) };
        g.save();
        g.globalAlpha = this.frost;
        g.drawImage(this.frostTex.c, p.x, p.y, p.w, p.h);
        g.restore();
      }
    }
  },
  makeFrost(w, h) {
    const c = makeCanvas(w, h), g = c.getContext('2d');
    const edge = (x0, y0, x1, y1) => {
      const lg = g.createLinearGradient(x0, y0, x1, y1);
      lg.addColorStop(0, 'rgba(235,245,255,0.55)');
      lg.addColorStop(1, 'rgba(235,245,255,0)');
      return lg;
    };
    const d = Math.min(w, h) * 0.22;
    g.fillStyle = edge(0, h, 0, h - d); g.fillRect(0, h - d, w, d);
    g.fillStyle = edge(0, 0, d, 0); g.fillRect(0, 0, d, h);
    g.fillStyle = edge(w, 0, w - d, 0); g.fillRect(w - d, 0, d, h);
    const r = mulberry32(5);
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = 0.8;
    const branch = (x, y, a, len, depth) => {
      if (depth > 3 || len < 3) return;
      let px = x, py = y;
      const segs = 5 + Math.floor(r() * 5);
      g.beginPath();
      g.moveTo(px, py);
      for (let i = 0; i < segs; i++) {
        a += (r() - 0.5) * 0.5;
        px += Math.cos(a) * len / segs; py += Math.sin(a) * len / segs;
        g.lineTo(px, py);
        if (r() < 0.35) { g.stroke(); branch(px, py, a + (r() < 0.5 ? 1 : -1) * 1.05, len * 0.5, depth + 1); g.beginPath(); g.moveTo(px, py); }
      }
      g.stroke();
    };
    for (let i = 0; i < 70; i++) {
      const side = Math.floor(r() * 3);
      if (side === 0) branch(r() * w, h, -Math.PI / 2 + (r() - 0.5), d * (0.6 + r()), 0);
      else if (side === 1) branch(0, r() * h, (r() - 0.5), d * (0.6 + r()), 0);
      else branch(w, r() * h, Math.PI + (r() - 0.5), d * (0.6 + r()), 0);
    }
    return c;
  },

  drawDrops(g, panes, dt, reduce) {
    const rate = this.rainI > 0 ? (reduce ? 6 : 30) * this.rainI + (this.storm ? 14 : 0) : 0;
    if (rate && panes.length) {
      let n = rate * dt;
      while (n > 0) {
        if (Math.random() < n) {
          const p = panes[Math.random() < 0.5 ? 0 : 1];
          const big = Math.random() < 0.22;
          this.drops.push({ x: p.x + Math.random() * p.w, y: p.y + Math.random() * p.h * 0.95, r: big ? 2.4 + Math.random() * 2.8 : 0.7 + Math.random() * 1.5, vy: 0, slide: false, trail: 0, pane: p === panes[0] ? 0 : 1, seed: Math.random() * 10 });
        }
        n -= 1;
      }
    }
    if (this.drops.length > 240) this.drops.splice(0, this.drops.length - 240);
    const map = Scene.photoMap();
    const dark = 1 - this.bright;
    const keep = [];
    for (const d of this.drops) {
      const p = panes[d.pane];
      if (!p) continue;
      if (this.rainI <= 0) d.r -= dt * 0.08;
      if (d.r < 0.5) continue;
      if (d.r > 3.3 && !reduce) {
        d.slide = true;
        d.vy = Math.min(d.vy + 70 * dt, 30 + d.r * 16);
        d.y += d.vy * dt;
        d.x += Math.sin(d.y * 0.05 + d.seed) * 0.25;
        d.trail += d.vy * dt;
        if (d.trail > 9) {
          d.trail = 0;
          keep.push({ x: d.x + (Math.random() - 0.5), y: d.y - d.r * 1.2, r: d.r * 0.28, vy: 0, slide: false, trail: 0, pane: d.pane, seed: 0 });
          d.r *= 0.985;
        }
      }
      if (d.y - d.r > p.y + p.h) continue;
      keep.push(d);
    }
    // Merge sliding drops with ones they touch
    for (const a of keep) {
      if (!a.slide) continue;
      for (const b of keep) {
        if (b === a || b.r <= 0 || b.pane !== a.pane) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        if (dx * dx + dy * dy < (a.r + b.r * 0.8) ** 2) { a.r = Math.min(7, Math.sqrt(a.r * a.r + b.r * b.r)); b.r = 0; }
      }
    }
    this.drops = keep.filter((d) => d.r > 0);
    for (const d of this.drops) {
      const p = panes[d.pane];
      if (d.y < p.y || d.x < p.x || d.x > p.x + p.w) continue;
      const rx = d.r * (d.slide ? 0.86 : 1), ry = d.r * (d.slide ? 1.18 : 1);
      if (d.r > 1.5 && map) {
        g.save();
        g.beginPath();
        g.ellipse(d.x, d.y, rx, ry, 0, 0, TAU);
        g.clip();
        // A drop is a tiny lens: it shows the scene above it, upside down and squeezed.
        const sx = (d.x - map.x) / map.s, sy = (d.y - d.r * 5 - map.y) / map.s;
        const sw = (d.r * 9) / map.s;
        g.translate(d.x, d.y);
        g.scale(1, -1);
        try { g.drawImage(map.img, sx - sw / 2, sy - sw / 2, sw, sw, -rx, -ry, rx * 2, ry * 2); } catch { /* not decoded yet */ }
        g.setTransform(Room.dpr, 0, 0, Room.dpr, 0, 0);
        const lg = g.createRadialGradient(d.x - rx * 0.2, d.y - ry * 0.25, 0, d.x, d.y, Math.max(rx, ry));
        lg.addColorStop(0, 'rgba(255,255,255,0.18)');
        lg.addColorStop(0.72, 'rgba(255,255,255,0.05)');
        lg.addColorStop(1, 'rgba(10,20,30,0.45)');
        g.fillStyle = lg;
        g.fillRect(d.x - rx, d.y - ry, rx * 2, ry * 2);
        if (dark > 0.05) { g.fillStyle = `rgba(8,12,24,${(dark * 0.45).toFixed(2)})`; g.fillRect(d.x - rx, d.y - ry, rx * 2, ry * 2); }
        g.restore();
        g.fillStyle = `rgba(255,255,255,${(0.45 * (0.4 + 0.6 * this.bright)).toFixed(2)})`;
        g.beginPath(); g.ellipse(d.x, d.y + ry * 0.62, rx * 0.5, ry * 0.18, 0, 0, TAU); g.fill();
        g.fillStyle = dark > 0.3 ? 'rgba(255,214,160,0.9)' : `rgba(255,255,255,${(0.85 * (0.4 + 0.6 * this.bright)).toFixed(2)})`;
        g.beginPath(); g.arc(d.x - rx * 0.35, d.y - ry * 0.4, Math.max(0.6, d.r * 0.22), 0, TAU); g.fill();
      } else {
        g.fillStyle = `rgba(225,235,242,${(0.28 * (0.4 + 0.6 * this.bright)).toFixed(2)})`;
        g.beginPath(); g.arc(d.x, d.y, d.r, 0, TAU); g.fill();
        g.fillStyle = `rgba(255,255,255,${(0.55 * (0.4 + 0.6 * this.bright)).toFixed(2)})`;
        g.beginPath(); g.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, Math.max(0.4, d.r * 0.3), 0, TAU); g.fill();
      }
    }
  },

  drawBeam(g, dt, reduce) {
    const b = this.beam;
    if (!b || b.k < 0.05) return;
    // Faint shaft of light from the lower pane down onto the sill
    const lg = g.createLinearGradient(0, b.top, 0, b.frontY);
    lg.addColorStop(0, 'rgba(255,240,205,0)');
    lg.addColorStop(0.6, `rgba(255,238,200,${(0.07 * b.k).toFixed(3)})`);
    lg.addColorStop(1, `rgba(255,232,190,${(0.1 * b.k).toFixed(3)})`);
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(b.x0, b.top); g.lineTo(b.x1, b.top);
    g.lineTo(b.x1 - b.shift, b.frontY); g.lineTo(b.x0 - b.shift, b.frontY);
    g.closePath();
    g.fill();
    if (reduce) return;
    while (this.motes.length < 36) this.motes.push({ u: Math.random(), v: Math.random(), du: (Math.random() - 0.5) * 0.02, dv: (Math.random() - 0.5) * 0.015, r: 0.6 + Math.random() * 1.3, ph: Math.random() * TAU });
    for (const m of this.motes) {
      m.u = (m.u + m.du * dt + 1) % 1;
      m.v = (m.v + m.dv * dt + 1) % 1;
      const y = lerp(b.top, b.frontY, m.v);
      const sh = b.shift * m.v;
      const x = lerp(b.x0, b.x1, m.u) - sh;
      const a = (0.25 + 0.35 * Math.sin(this.t * 1.5 + m.ph)) * b.k;
      if (a <= 0) continue;
      g.fillStyle = `rgba(255,248,225,${a.toFixed(2)})`;
      g.beginPath(); g.arc(x, y, m.r, 0, TAU); g.fill();
    }
  },

  lightning(now) {
    if (!this.storm) { Scene.el.flash.style.opacity = '0'; Scene.el.flashRoom.style.opacity = '0'; return; }
    if (!this.nextFlash) this.nextFlash = now + 3000 + Math.random() * 6000;
    if (now > this.nextFlash) {
      this.flashAt = now;
      this.nextFlash = now + 7000 + Math.random() * 14000;
      setTimeout(() => Audio2.play('thunder'), 900 + Math.random() * 2200);
    }
    const t = now - this.flashAt;
    const pulses = [[0, 90, 1], [140, 220, 0.45], [260, 420, 0.8]];
    let s = 0;
    for (const [a, b, v] of pulses) if (t >= a && t <= b) s = v * (1 - (t - a) / (b - a) * 0.6);
    Scene.el.flash.style.opacity = s.toFixed(2);
    Scene.el.flashRoom.style.opacity = (s * 0.35).toFixed(2);
  },

  /* ---------- one-shot particles ---------- */
  pour(x, y, k = 1) {
    for (let i = 0; i < 4 * k + 1; i++) this.parts.push({ type: 'water', x: x + Math.random() * 4, y: y + Math.random() * 4, vx: 60 + Math.random() * 40, vy: 20 + Math.random() * 30, life: 0, max: 0.9, r: 1.6 + Math.random() * 1.8, col: '#7CC4F2' });
  },
  drops(x, y, col, n = 8) {
    for (let i = 0; i < n; i++) this.parts.push({ type: 'water', x: x + (Math.random() - 0.5) * 8, y, vx: (Math.random() - 0.5) * 20, vy: 30 + Math.random() * 40, life: -i * 0.06, max: 0.9, r: 2 + Math.random() * 1.6, col });
  },
  sparkle(x, y, col = '#FFE27A', n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * 90;
      this.parts.push({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0, max: 0.7 + Math.random() * 0.5, r: 2 + Math.random() * 3, col });
    }
  },
  mist(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = Math.PI + (Math.random() - 0.5) * 0.9, sp = 60 + Math.random() * 120;
      this.parts.push({ type: 'mist', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 0.6 + Math.random() * 0.4, r: 1 + Math.random() * 2, col: '#D6EEFB' });
    }
  },
  wipeAt(x, y) {
    for (let i = 0; i < 3; i++) this.parts.push({ type: 'spark', x: x + (Math.random() - 0.5) * 40, y: y + (Math.random() - 0.5) * 30, vx: 0, vy: -10, life: 0, max: 0.45, r: 1.5 + Math.random() * 2, col: '#FFFFFF' });
  },
  drawParts(g, dt) {
    const alive = [];
    for (const p of this.parts) {
      p.life += dt;
      if (p.life < 0) { alive.push(p); continue; }
      if (p.life > p.max) continue;
      if (p.type === 'water') p.vy += 600 * dt;
      if (p.type === 'mist') { p.vx *= 0.94; p.vy *= 0.94; }
      if (p.type === 'spark') p.vy += 60 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const k = 1 - p.life / p.max;
      g.globalAlpha = clamp(p.type === 'mist' ? k * 0.7 : k, 0, 1);
      g.fillStyle = p.col;
      if (p.type === 'spark') {
        const r = p.r * (0.6 + 0.4 * k);
        g.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * TAU, rr = i % 2 ? r * 0.4 : r;
          const px = p.x + Math.cos(a) * rr, py = p.y + Math.sin(a) * rr;
          i ? g.lineTo(px, py) : g.moveTo(px, py);
        }
        g.closePath();
        g.fill();
      } else {
        g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
      }
      alive.push(p);
    }
    g.globalAlpha = 1;
    this.parts = alive;
  },
};

// ---- plant.js ----
/* Cartoon cactus + pot, drawn as SVG. Units: pot base at (0,0), plant grows up (−y). */

const Plant = {
  uidN: 0,

  hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  },

  /* Visual inputs derived from game state (quantised so re-renders are cheap to skip). */
  visual(S, opts = {}) {
    const P = S.plant, sp = SPECIES[P.species];
    const q = (v, s = 1) => Math.round(v / s) * s;
    const drought = clamp(P.dryHours / 24 / sp.dryDays, 0, 1.5);
    return {
      species: P.species,
      seed: this.hash(S.id + P.species),
      color: P.color,
      size: q(sizeFromGrowth(P.growth), 0.004),
      growth: q(P.growth, 0.5),
      stage: stageIndex(P.growth),
      pot: P.pot.size, potStyle: P.pot.style,
      moisture: q(P.moisture, 4), saucer: P.saucer > 0.5,
      shrivel: q(smoothstep(0.25, 1.1, drought), 0.05),
      rot: q(clamp((P.rot - 25) / 60, 0, 1), 0.05),
      etiol: q(P.etiol / 100, 0.05),
      burn: q(clamp((P.sunburn - 15) / 70, 0, 1), 0.05),
      cold: q(clamp(P.cold / 60, 0, 1), 0.05),
      dust: q(P.dust / 100, 0.1),
      pests: Math.ceil(P.pests),
      health: q(P.health, 5),
      bloom: P.bloom?.stage || null,
      pups: P.pups,
      lean: q(P.lean, 0.05),
      mood: opts.mood || 'content',
      face: S.settings.face !== false,
      wet: S.env.sillWet > 0.3,
    };
  },

  /* Full SVG markup. `box` = [minX, minY, w, h] in plant units. */
  svg(v, box = [-230, -580, 460, 660], extraClass = '') {
    const id = `pl${++this.uidN}`;
    const D = new Defs(id);
    const potSvg = this.pot(v, D);
    const soilY = -POT_SIZES[v.pot].w * 0.82 + POT_SIZES[v.pot].w * 0.82 * 0.2 * 0.45;
    const body = this.body(v, D, soilY);
    const sat = 0.45 + 0.55 * clamp(v.health / 100, 0, 1);
    D.add(`<filter id="${id}-sat" x="-10%" y="-10%" width="120%" height="120%"><feColorMatrix type="saturate" values="${sat.toFixed(2)}"/></filter>`);
    const lean = v.lean * 7;
    return `<svg class="plant-svg ${extraClass}" viewBox="${box.join(' ')}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>${D.out()}</defs>
      <g class="pot-g">${potSvg.back}</g>
      <g class="plant-g" style="transform-origin:0px ${soilY}px">
        <g style="transform:rotate(${lean.toFixed(2)}deg);transform-origin:0px ${soilY}px">
          <g filter="url(#${id}-sat)">${body}</g>
        </g>
      </g>
      <g class="pot-front">${potSvg.front}</g>
    </svg>`;
  },

  /* ---------------- pot ---------------- */
  pot(v, D) {
    const pw = POT_SIZES[v.pot].w, ph = pw * 0.82, rimH = ph * 0.2, rimW = pw * 1.1, baseW = pw * 0.76;
    const st = v.potStyle || 'terracotta';
    const pal = {
      terracotta: { body: '#D8733F', light: '#EE9565', dark: '#A9502A', rim: '#E4834F', line: '#6A2E14' },
      sky: { body: '#3C94D6', light: '#8CCBF3', dark: '#1F64A6', rim: '#4AA3E3', line: '#123E6B' },
      cream: { body: '#F1E6D0', light: '#FFFFFF', dark: '#CDBB98', rim: '#F7EEDD', line: '#6E5B41' },
      talavera: { body: '#F7F1E4', light: '#FFFFFF', dark: '#D7CDB8', rim: '#2F5DB8', line: '#1D326B' },
      sunset: { body: '#F08A4B', light: '#F9B27E', dark: '#C9553A', rim: '#E4566A', line: '#6B2A22' },
      midnight: { body: '#2E333B', light: '#58606C', dark: '#1B1F25', rim: '#3B414B', line: '#0F1216' },
    }[st];
    const g = D.lin([[0, pal.dark], [0.18, pal.light], [0.42, pal.body], [1, pal.dark]], 0, 0, 1, 0);
    const rg = D.lin([[0, pal.dark], [0.2, pal.light], [0.5, pal.rim], [1, pal.dark]], 0, 0, 1, 0);
    const top = -ph;
    const bodyPath = `M ${-pw / 2} ${top + rimH} L ${pw / 2} ${top + rimH} L ${baseW / 2} ${-6} Q ${baseW / 2} 0 ${baseW / 2 - 8} 0 L ${-baseW / 2 + 8} 0 Q ${-baseW / 2} 0 ${-baseW / 2} -6 Z`;
    let deco = '';
    const r = mulberry32(v.seed + 3);
    if (st === 'terracotta' || st === 'cream') {
      const dots = st === 'cream' ? 26 : 16;
      for (let i = 0; i < dots; i++) {
        const y = top + rimH + 8 + r() * (ph - rimH - 16);
        const t = (y - (top + rimH)) / (ph - rimH);
        const half = lerp(pw / 2, baseW / 2, t) - 7;
        const x = (r() * 2 - 1) * half;
        deco += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.9 + r() * 1.3).toFixed(1)}" fill="${st === 'cream' ? '#8C765A' : '#B35C33'}" opacity="${st === 'cream' ? 0.7 : 0.45}"/>`;
      }
    } else if (st === 'sky') {
      let d = `M ${-pw / 2} ${top + rimH + 6}`;
      for (let i = 0; i <= 10; i++) {
        const x = -pw / 2 + (pw * i) / 10;
        d += ` Q ${x - pw / 40} ${top + rimH + 14 + (i % 2) * 10} ${x} ${top + rimH + 8 + (i % 3) * 5}`;
      }
      d += ` L ${pw / 2} ${top + rimH} L ${-pw / 2} ${top + rimH} Z`;
      deco += `<path d="${d}" fill="#9ED3F5" opacity="0.8"/>`;
    } else if (st === 'talavera') {
      const cy = top + rimH + (ph - rimH) * 0.48;
      for (let i = -2; i <= 2; i++) {
        const cx = i * pw * 0.2;
        const s = 7 + (2 - Math.abs(i)) * 1.5;
        deco += `<g transform="translate(${cx} ${cy})">${[0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="${-s}" rx="${s * 0.45}" ry="${s * 0.8}" fill="#2F5DB8" transform="rotate(${a})"/>`).join('')}<circle r="${s * 0.45}" fill="#F0B429"/></g>`;
      }
      deco += `<path d="M ${-pw * 0.47} ${top + rimH + 7} H ${pw * 0.47}" stroke="#F0B429" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>`;
      deco += `<path d="M ${-baseW * 0.46} -10 H ${baseW * 0.46}" stroke="#2F5DB8" stroke-width="4"/>`;
    } else if (st === 'sunset') {
      const cols = ['#F6C453', '#E8566B'];
      for (let k = 0; k < 2; k++) {
        const y = top + rimH + (ph - rimH) * (0.3 + k * 0.3);
        const t = (y - (top + rimH)) / (ph - rimH);
        const hw = lerp(pw / 2, baseW / 2, t);
        deco += `<path d="M ${-hw} ${y} L ${hw} ${y} L ${hw - 2} ${y + 11} L ${-hw + 2} ${y + 11} Z" fill="${cols[k]}"/>`;
      }
    } else if (st === 'midnight') {
      deco += `<path d="M ${-pw * 0.3} ${top + rimH + 10} Q ${-pw * 0.34} ${-ph * 0.45} ${-baseW * 0.28} -12" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    }
    const saucer = `<path d="M ${-pw * 0.62} -3 Q ${-pw * 0.62} 9 ${-pw * 0.5} 9 L ${pw * 0.5} 9 Q ${pw * 0.62} 9 ${pw * 0.62} -3 Z" fill="${pal.dark}" stroke="${pal.line}" stroke-width="2.5" stroke-linejoin="round"/>
      ${v.saucer ? `<ellipse cx="0" cy="-2" rx="${pw * 0.56}" ry="3" fill="#6FA8C9" opacity="0.85"/>` : ''}
      <path d="M ${-pw * 0.6} -3 H ${pw * 0.6}" stroke="${pal.light}" stroke-width="2" opacity="0.6"/>`;
    // Soil inside the rim
    const m = v.moisture / 100;
    const soilCol = m > 0.6 ? mix('#5A3B25', '#3A2616', (m - 0.6) / 0.4) : mix('#C9A57A', '#5A3B25', m / 0.6);
    const soilCy = top + rimH * 0.45;
    const srx = pw * 0.49, sry = pw * 0.085;
    let soil = `<ellipse cx="0" cy="${soilCy}" rx="${srx}" ry="${sry}" fill="${soilCol}"/>`;
    for (let i = 0; i < 18; i++) {
      const a = r() * TAU, rr = Math.sqrt(r()) * 0.9;
      soil += `<circle cx="${(Math.cos(a) * srx * rr).toFixed(1)}" cy="${(soilCy + Math.sin(a) * sry * rr).toFixed(1)}" r="${(0.8 + r() * 1.6).toFixed(1)}" fill="${m > 0.5 ? '#2A1A10' : '#E9D6B5'}" opacity="0.55"/>`;
    }
    if (m < 0.12) soil += `<path d="M ${-srx * 0.5} ${soilCy - 1} l 8 3 l 6 -2 M ${srx * 0.15} ${soilCy + 2} l 7 -3 l 5 2" stroke="#9C7C57" stroke-width="1.4" fill="none"/>`;
    if (m > 0.75) soil += `<ellipse cx="${-srx * 0.35}" cy="${soilCy - sry * 0.3}" rx="${srx * 0.22}" ry="${sry * 0.25}" fill="#ffffff" opacity="0.28"/>`;
    const back = `${saucer}
      <path d="${bodyPath}" fill="url(#${g})" stroke="${pal.line}" stroke-width="3" stroke-linejoin="round"/>
      <g clip-path="none">${deco}</g>
      <path d="M ${-pw * 0.36} ${top + rimH + 8} Q ${-pw * 0.4} ${-ph * 0.4} ${-baseW * 0.33} -10" stroke="#ffffff" stroke-opacity="${st === 'midnight' ? 0.1 : 0.28}" stroke-width="5" fill="none" stroke-linecap="round"/>
      <rect x="${-rimW / 2}" y="${top}" width="${rimW}" height="${rimH}" rx="${rimH * 0.35}" fill="url(#${rg})" stroke="${pal.line}" stroke-width="3"/>
      <path d="M ${-rimW / 2 + 5} ${top + 3.5} H ${rimW / 2 - 5}" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
      ${soil}`;
    // Front lip of the rim over the soil so the plant looks planted
    const front = `<path d="M ${-rimW / 2 + 1.5} ${top + rimH * 0.5} Q 0 ${top + rimH * 0.5 + sry * 1.6} ${rimW / 2 - 1.5} ${top + rimH * 0.5} L ${rimW / 2 - 1.5} ${top + rimH - 1.5} Q ${rimW / 2 - 1.5} ${top + rimH - 1.5} ${rimW / 2 - rimH * 0.35} ${top + rimH - 1.5} L ${-rimW / 2 + rimH * 0.35} ${top + rimH - 1.5} Q ${-rimW / 2 + 1.5} ${top + rimH - 1.5} ${-rimW / 2 + 1.5} ${top + rimH - 1.5} Z" fill="url(#${rg})"/>
      <path d="M ${-rimW / 2 + 1.5} ${top + rimH * 0.5} Q 0 ${top + rimH * 0.5 + sry * 1.6} ${rimW / 2 - 1.5} ${top + rimH * 0.5}" stroke="${pal.line}" stroke-width="2.4" fill="none" opacity="0.8"/>
      <rect x="${-rimW / 2}" y="${top}" width="${rimW}" height="${rimH}" rx="${rimH * 0.35}" fill="none" stroke="${pal.line}" stroke-width="3"/>`;
    return { back, front };
  },

  /* ---------------- plant bodies ---------------- */
  palette(v) {
    let base = '#5FAF55', light = '#9BD67C', dark = '#2F7A3B', line = '#1F4A26';
    if (v.species === 'christmas') { base = '#58A84E'; light = '#8ED36F'; dark = '#2D6E35'; }
    if (v.species === 'oldlady') { base = '#6FAE62'; light = '#A8D98D'; dark = '#3C7B45'; }
    if (v.species === 'bunny') { base = '#7AB85A'; light = '#B2DC86'; dark = '#437F3A'; }
    const yellow = '#B9B35A', brown = '#8A6A33';
    if (v.shrivel > 0) { base = mix(base, yellow, v.shrivel * 0.5); light = mix(light, '#D8D38A', v.shrivel * 0.45); }
    if (v.rot > 0) { dark = mix(dark, brown, v.rot * 0.6); }
    if (v.etiol > 0) { light = mix(light, '#DDEFB0', v.etiol * 0.6); base = mix(base, '#9CCB76', v.etiol * 0.4); }
    return { base, light, dark, line };
  },

  body(v, D, soilY) {
    const pal = this.palette(v);
    const fn = { barrel: this.barrel, bunny: this.bunny, saguaro: this.saguaro, moon: this.moon, oldlady: this.oldlady, christmas: this.christmas }[v.species];
    return `<g transform="translate(0 ${soilY.toFixed(1)})">${fn.call(this, v, D, pal)}</g>`;
  },

  bodyGrad(D, pal) {
    return D.rad([[0, pal.light], [0.55, pal.base], [1, pal.dark]], 0.32, 0.28, 0.85);
  },

  spineCluster(x, y, len, rot, col = '#F4D56A', n = 5) {
    let s = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(len * 0.2 + 0.8).toFixed(1)}" fill="#FFF3CF"/>`;
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * TAU;
      s += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + Math.cos(a) * len).toFixed(1)}" y2="${(y + Math.sin(a) * len).toFixed(1)}"/>`;
    }
    return `<g stroke="${col}" stroke-width="1.3" stroke-linecap="round">${s}</g>`;
  },

  conditionOverlays(v, D, clipId, cx, cy, rx, ry) {
    let o = '';
    if (v.burn > 0) o += `<ellipse cx="${cx + rx * 0.35}" cy="${cy - ry * 0.45}" rx="${rx * 0.45}" ry="${ry * 0.35}" fill="#F0DDB0" opacity="${(0.65 * v.burn).toFixed(2)}" clip-path="url(#${clipId})"/>`;
    if (v.rot > 0) {
      const rg = D.lin([[0, 'rgba(120,90,40,0)'], [1, 'rgba(120,85,35,0.95)']], 0, 0, 0, 1);
      o += `<rect x="${cx - rx}" y="${cy - ry}" width="${rx * 2}" height="${ry * 2}" fill="url(#${rg})" opacity="${(0.75 * v.rot).toFixed(2)}" clip-path="url(#${clipId})"/>`;
    }
    if (v.cold > 0) o += `<rect x="${cx - rx}" y="${cy - ry}" width="${rx * 2}" height="${ry * 2}" fill="#8C7BC9" opacity="${(0.35 * v.cold).toFixed(2)}" clip-path="url(#${clipId})"/>`;
    if (v.dust > 0.15) {
      const r = mulberry32(v.seed + 77);
      let d = '';
      for (let i = 0; i < 40 * v.dust; i++) d += `<circle cx="${(cx + (r() * 2 - 1) * rx * 0.9).toFixed(1)}" cy="${(cy + (r() * 2 - 1) * ry * 0.9).toFixed(1)}" r="${(0.6 + r()).toFixed(1)}"/>`;
      o += `<g fill="#CFC6B3" opacity="0.7" clip-path="url(#${clipId})">${d}</g>`;
    }
    if (v.pests > 0) {
      const r = mulberry32(v.seed + 99);
      for (let i = 0; i < Math.min(9, 2 + v.pests * 1.2); i++) {
        const px = cx + (r() * 1.6 - 0.8) * rx * 0.8, py = cy + (r() * 1.4 - 0.5) * ry * 0.8;
        o += `<g class="bug" transform="translate(${px.toFixed(1)} ${py.toFixed(1)})"><circle r="3.4" fill="#FFFFFF"/><circle cx="3" cy="1" r="2.6" fill="#F4F1EA"/><circle cx="-2.6" cy="1.4" r="2.4" fill="#FAF8F2"/><path d="M -4 3 l -2 2 M 4 3 l 2 2" stroke="#BDB6A6" stroke-width="0.8"/></g>`;
      }
    }
    return o;
  },

  face(v, x, y, s) {
    if (!v.face) return '';
    s = Math.max(s, 0.62);
    const m = v.mood;
    const E = (ex) => `translate(${(x + ex * s).toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})`;
    const eye = (ex) => {
      if (m === 'happy' || m === 'proud') return `<path transform="${E(ex)}" d="M -4.6 1.6 Q 0 -4.6 4.6 1.6" stroke="#1B2A1E" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
      if (m === 'sleepy') return `<path transform="${E(ex)}" d="M -4.4 -0.5 Q 0 3.6 4.4 -0.5" stroke="#1B2A1E" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
      if (m === 'cold' || m === 'ouch') return `<path transform="${E(ex)}" d="${ex < 0 ? 'M -4 -3.5 L 3 0 L -4 3.5' : 'M 4 -3.5 L -3 0 L 4 3.5'}" stroke="#1B2A1E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      const lid = m === 'thirsty' || m === 'sick' ? `<rect x="-5.4" y="-6.4" width="10.8" height="5" fill="var(--lid)"/>` : '';
      return `<g transform="${E(ex)}"><g class="eye"><ellipse rx="4" ry="5.2" fill="#1B2A1E"/><circle cx="1.5" cy="-2" r="1.6" fill="#fff"/>${lid}</g></g>`;
    };
    let mouth;
    const M = `translate(${x.toFixed(1)} ${(y + 7.5 * s).toFixed(1)}) scale(${s.toFixed(3)})`;
    switch (m) {
      case 'happy': mouth = `<path transform="${M}" d="M -5 -1 Q 0 6 5 -1 Q 0 2.6 -5 -1 Z" fill="#8E2F3B" stroke="#1B2A1E" stroke-width="1.8" stroke-linejoin="round"/>`; break;
      case 'proud': mouth = `<path transform="${M}" d="M -6 -1.5 Q 0 8 6 -1.5 Q 0 3 -6 -1.5 Z" fill="#8E2F3B" stroke="#1B2A1E" stroke-width="1.8" stroke-linejoin="round"/>`; break;
      case 'thirsty': mouth = `<path transform="${M}" d="M -3.2 1.5 Q 0 -1.8 3.2 1.5" stroke="#1B2A1E" stroke-width="2" fill="none" stroke-linecap="round"/><path transform="${M}" d="M -1 2 q 1 3.4 2.4 0" fill="#E57B8B"/>`; break;
      case 'soggy': case 'sick': mouth = `<path transform="${M}" d="M -5 1.5 q 1.7 -2 3.3 0 t 3.3 0 t 3.3 0" stroke="#1B2A1E" stroke-width="1.9" fill="none" stroke-linecap="round"/>`; break;
      case 'cold': mouth = `<path transform="${M}" d="M -5 0 l 2 -1.6 l 2 1.6 l 2 -1.6 l 2 1.6" stroke="#1B2A1E" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`; break;
      case 'hot': mouth = `<ellipse transform="${M}" cx="0" cy="0.8" rx="3.4" ry="3" fill="#8E2F3B" stroke="#1B2A1E" stroke-width="1.8"/>`; break;
      case 'itchy': mouth = `<path transform="${M}" d="M -4 0.5 h 8" stroke="#1B2A1E" stroke-width="2" stroke-linecap="round"/>`; break;
      case 'ouch': mouth = `<ellipse transform="${M}" cx="0" cy="0.5" rx="2.6" ry="3.2" fill="#8E2F3B" stroke="#1B2A1E" stroke-width="1.8"/>`; break;
      case 'sleepy': mouth = `<ellipse transform="${M}" cx="0" cy="0.3" rx="1.8" ry="1.3" fill="#1B2A1E"/>`; break;
      default: mouth = `<path transform="${M}" d="M -3.6 -0.4 Q 0 3.6 3.6 -0.4" stroke="#1B2A1E" stroke-width="2.1" fill="none" stroke-linecap="round"/>`;
    }
    const cheekCol = m === 'cold' ? '#9FB7E8' : m === 'hot' ? '#FF6B6B' : '#FF8FA3';
    const cr = m === 'hot' ? 1.3 : 1;
    const cheeks = `<g opacity="${m === 'hot' ? 0.75 : 0.55}" fill="${cheekCol}"><ellipse cx="${(x - 11 * s).toFixed(1)}" cy="${(y + 5 * s).toFixed(1)}" rx="${(4.2 * s * cr).toFixed(1)}" ry="${(2.6 * s * cr).toFixed(1)}"/><ellipse cx="${(x + 11 * s).toFixed(1)}" cy="${(y + 5 * s).toFixed(1)}" rx="${(4.2 * s * cr).toFixed(1)}" ry="${(2.6 * s * cr).toFixed(1)}"/></g>`;
    let extra = '';
    if (m === 'thirsty' || m === 'hot') extra += `<path transform="translate(${(x + 15 * s).toFixed(1)} ${(y - 9 * s).toFixed(1)}) scale(${s.toFixed(3)})" d="M 0 -5 Q 3.6 0 0 3 Q -3.6 0 0 -5 Z" fill="#7CC4F2" stroke="#2B6C99" stroke-width="1"/>`;
    if (m === 'soggy' || m === 'sick') extra += `<path d="M ${(x - 9 * s).toFixed(1)} ${(y - 8 * s).toFixed(1)} l ${(5 * s).toFixed(1)} ${(-2 * s).toFixed(1)} M ${(x + 9 * s).toFixed(1)} ${(y - 8 * s).toFixed(1)} l ${(-5 * s).toFixed(1)} ${(-2 * s).toFixed(1)}" stroke="#1B2A1E" stroke-width="${(1.8 * s).toFixed(1)}" stroke-linecap="round"/>`;
    if (m === 'proud') extra += `<path transform="translate(${(x - 15 * s).toFixed(1)} ${(y - 10 * s).toFixed(1)}) scale(${(s * 0.8).toFixed(3)})" d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2Z" fill="#FFE27A"/>`;
    return `<g class="face" style="--lid:${v.faceLid || '#6DB05E'}">${cheeks}${eye(-7.5)}${eye(7.5)}${mouth}${extra}</g>`;
  },

  flower(x, y, r, col, rot = 0, kind = 'cup') {
    const centre = kind === 'star' ? '#F7A21B' : '#FFE9A0';
    let petals = '';
    const n = kind === 'star' ? 8 : 6;
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * 360;
      petals += `<ellipse cx="0" cy="${(-r * 0.55).toFixed(1)}" rx="${(r * 0.32).toFixed(1)}" ry="${(r * 0.6).toFixed(1)}" transform="rotate(${a.toFixed(0)})"/>`;
    }
    return `<g class="flower" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g fill="${col}" stroke="${mix(col, '#5A2A1A', 0.45)}" stroke-width="1">${petals}</g><circle r="${(r * 0.3).toFixed(1)}" fill="${centre}" stroke="#C07A1A" stroke-width="0.8"/></g>`;
  },

  bud(x, y, r, col) {
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><ellipse rx="${(r * 0.45).toFixed(1)}" ry="${(r * 0.75).toFixed(1)}" cy="${(-r * 0.4).toFixed(1)}" fill="${col}" stroke="${mix(col, '#40220f', 0.5)}" stroke-width="1"/><path d="M ${-r * 0.4} 0 Q 0 ${r * 0.5} ${r * 0.4} 0" fill="#6DAF55"/></g>`;
  },

  /* Round, ribbed globe */
  barrel(v, D, pal) {
    const R = 112 * v.size * (1 - 0.12 * v.shrivel) * (1 + 0.04 * v.rot);
    const Ry = R * 0.9 * (1 + 0.12 * v.etiol);
    const cy = -Ry;
    const grad = this.bodyGrad(D, pal);
    const clip = D.clip(`<ellipse cx="0" cy="${cy}" rx="${R}" ry="${Ry}"/>`);
    let out = `<ellipse cx="0" cy="${cy}" rx="${R}" ry="${Ry}" fill="url(#${grad})" stroke="${pal.line}" stroke-width="3"/>`;
    const ribs = Math.round(10 + v.size * 12);
    let ribPaths = '', spines = '';
    const r = mulberry32(v.seed);
    for (let i = 0; i < ribs; i++) {
      const th = -Math.PI / 2 + ((i + 0.5) / ribs) * Math.PI;
      const sx = Math.sin(th);
      const depth = 1 + 0.5 * v.shrivel;
      ribPaths += `<path d="M 0 ${(cy - Ry).toFixed(1)} Q ${(sx * R * 1.32).toFixed(1)} ${cy.toFixed(1)} 0 ${(cy + Ry).toFixed(1)}" stroke="${pal.dark}" stroke-width="${(1.8 * depth).toFixed(1)}" fill="none" opacity="${(0.55 * Math.cos(th) + 0.2).toFixed(2)}"/>`;
      if (Math.abs(sx) < 0.93 && v.size > 0.24) {
        const steps = Math.round(3 + v.size * 5);
        for (let k = 1; k < steps; k++) {
          const t = k / steps;
          const yy = cy - Ry + t * 2 * Ry;
          const q = 1 - Math.pow(2 * t - 1, 2);
          const xx = sx * R * 0.66 * q * 1.0 + sx * R * 0.34 * Math.sqrt(q);
          if (Math.hypot(xx / R, (yy - cy) / Ry) > 0.97) continue;
          spines += this.spineCluster(xx, yy, 4 + v.size * 7, r() * TAU, '#F2CF4F', 5);
        }
      }
    }
    out += `<g clip-path="url(#${clip})">${ribPaths}</g>${spines}`;
    // Woolly crown
    out += `<ellipse cx="0" cy="${(cy - Ry * 0.93).toFixed(1)}" rx="${(R * 0.26).toFixed(1)}" ry="${(Ry * 0.1).toFixed(1)}" fill="#F7E3A3" stroke="#D8B85A" stroke-width="1.2"/>`;
    out += `<ellipse cx="${(-R * 0.4).toFixed(1)}" cy="${(cy - Ry * 0.45).toFixed(1)}" rx="${(R * 0.16).toFixed(1)}" ry="${(Ry * 0.1).toFixed(1)}" fill="#fff" opacity="0.28" transform="rotate(-30 ${(-R * 0.4).toFixed(1)} ${(cy - Ry * 0.45).toFixed(1)})"/>`;
    out += this.conditionOverlays(v, D, clip, 0, cy, R, Ry);
    if (v.bloom) {
      const n = v.bloom === 'bud' ? 5 : 8;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI - Math.PI;
        const fx = Math.cos(a) * R * 0.3, fy = cy - Ry * 0.93 + Math.sin(a) * Ry * 0.08;
        out += v.bloom === 'bud' ? this.bud(fx, fy, 9 + v.size * 5, '#F2D14B') : this.flower(fx, fy - 4, 9 + v.size * 7, v.bloom === 'fading' ? '#E3C67A' : SPECIES.barrel.bloom, i * 20, 'star');
      }
    }
    out += this.face({ ...v, faceLid: pal.base }, 0, cy + Ry * 0.12, clamp(R / 55, 0.62, 1.6));
    return out;
  },

  /* Old Lady: fuzzy white ball with a crown of pink flowers */
  oldlady(v, D, pal) {
    const R = 100 * v.size * (1 - 0.1 * v.shrivel) * (1 + 0.04 * v.rot);
    const Ry = R * 0.96 * (1 + 0.14 * v.etiol);
    const r = mulberry32(v.seed);
    let out = '';
    // Offsets at the base
    const pupR = R * 0.42;
    for (let i = 0; i < v.pups; i++) {
      const side = i % 2 ? 1 : -1;
      const px = side * (R * 0.95 + pupR * 0.35 * (i >> 1)), py = -pupR * 0.9;
      out += this.fuzzBall(px, py, pupR * (1 - 0.15 * (i >> 1)), pal, D, r);
    }
    out += this.fuzzBall(0, -Ry, R, pal, D, r, Ry);
    const clip = D.clip(`<ellipse cx="0" cy="${-Ry}" rx="${R}" ry="${Ry}"/>`);
    out += this.conditionOverlays(v, D, clip, 0, -Ry, R, Ry);
    if (v.bloom) {
      const n = v.bloom === 'bud' ? 7 : 11;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI + (i / (n - 1)) * Math.PI;
        const fx = Math.cos(a) * R * 0.62, fy = -Ry - Ry * 0.62 + Math.abs(Math.sin(a)) * -Ry * 0.12 + (1 - Math.abs(Math.cos(a))) * -Ry * 0.25;
        out += v.bloom === 'bud' ? this.bud(fx, fy, 7 + v.size * 5, '#E86DB3') : this.flower(fx, fy, 7 + v.size * 6, v.bloom === 'fading' ? '#C98FB0' : SPECIES.oldlady.bloom, i * 25);
      }
    }
    out += this.face({ ...v, faceLid: '#E9EFE2' }, 0, -Ry + Ry * 0.12, clamp(R / 52, 0.62, 1.6));
    return out;
  },

  fuzzBall(cx, footY, R, pal, D, r, Ry = R * 0.96) {
    const cy = footY === -Ry ? -Ry : footY;
    const grad = this.bodyGrad(D, pal);
    let s = `<ellipse cx="${cx}" cy="${cy}" rx="${R}" ry="${Ry}" fill="url(#${grad})" stroke="${pal.line}" stroke-width="3"/>`;
    // Tubercles in a spiral
    const n = Math.round(20 + R * 0.9);
    let tub = '';
    for (let i = 0; i < n; i++) {
      const a = i * 2.39996, rr = Math.sqrt((i + 0.5) / n);
      const x = cx + Math.cos(a) * rr * R * 0.92, y = cy + Math.sin(a) * rr * Ry * 0.92;
      tub += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.2 + R * 0.025).toFixed(1)}" fill="${pal.dark}" opacity="0.35"/>`;
    }
    // Soft white hairs: little curls all over (denser near the rim) plus wisps off the silhouette.
    let hair = '';
    const m = Math.round(40 + R * 1.7);
    for (let i = 0; i < m; i++) {
      const a = r() * TAU, rr = Math.pow(r(), 0.45);
      const x = cx + Math.cos(a) * rr * R * 0.95, y = cy + Math.sin(a) * rr * Ry * 0.95;
      const l = 3 + r() * 5, t = r() * TAU;
      const x2 = x + Math.cos(t) * l, y2 = y + Math.sin(t) * l;
      const bx = (x + x2) / 2 + Math.cos(t + 1.57) * l * 0.6, by = (y + y2) / 2 + Math.sin(t + 1.57) * l * 0.6;
      hair += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} Q${bx.toFixed(1)} ${by.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
    }
    const wc = Math.round(26 + R * 0.55);
    for (let i = 0; i < wc; i++) {
      const a = (i / wc) * TAU + r() * 0.2;
      const x = cx + Math.cos(a) * R * 0.98, y = cy + Math.sin(a) * Ry * 0.98;
      const l = 4 + r() * 6;
      hair += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} q ${(Math.cos(a) * l * 0.5 + (r() - 0.5) * 4).toFixed(1)} ${(Math.sin(a) * l * 0.5 - 2).toFixed(1)} ${(Math.cos(a) * l).toFixed(1)} ${(Math.sin(a) * l).toFixed(1)}"/>`;
    }
    const veil = D.rad([[0, 'rgba(255,255,255,0)'], [0.62, 'rgba(255,255,255,0.08)'], [1, 'rgba(255,255,255,0.5)']], 0.5, 0.5, 0.5);
    s += `${tub}<ellipse cx="${cx}" cy="${cy}" rx="${R}" ry="${Ry}" fill="url(#${veil})"/>`;
    s += `<g stroke="#FFFFFF" stroke-width="1.25" fill="none" stroke-linecap="round" opacity="0.92">${hair}</g>`;
    s += `<ellipse cx="${(cx - R * 0.42).toFixed(1)}" cy="${(cy - Ry * 0.42).toFixed(1)}" rx="${(R * 0.2).toFixed(1)}" ry="${(Ry * 0.12).toFixed(1)}" fill="#fff" opacity="0.35" transform="rotate(-35 ${(cx - R * 0.42).toFixed(1)} ${(cy - Ry * 0.42).toFixed(1)})"/>`;
    return s;
  },

  /* Moon cactus: coloured ball grafted on a green triangular stem */
  moon(v, D, pal) {
    const col = SPECIES.moon.colors[v.color] || SPECIES.moon.colors.pink;
    const stemH = 30 + 70 * v.size, stemW = 16 + 16 * v.size;
    const R = (16 + 60 * v.size) * (1 - 0.1 * v.shrivel);
    const Ry = R * 0.9 * (1 + 0.1 * v.etiol);
    const r = mulberry32(v.seed);
    const sg = D.lin([[0, pal.dark], [0.35, pal.light], [0.6, pal.base], [1, pal.dark]], 0, 0, 1, 0);
    let out = `<path d="M ${-stemW / 2} 0 L ${-stemW / 2 + 2} ${-stemH} L ${stemW / 2 - 2} ${-stemH} L ${stemW / 2} 0 Z" fill="url(#${sg})" stroke="${pal.line}" stroke-width="3" stroke-linejoin="round"/>`;
    out += `<path d="M 0 -2 L 0 ${-stemH}" stroke="${pal.dark}" stroke-width="2" opacity="0.6"/>`;
    for (let k = 1; k < 4; k++) out += this.spineCluster(stemW * 0.28, -stemH * k / 4, 3, 0.4, '#E9E4C9', 3) + this.spineCluster(-stemW * 0.28, -stemH * k / 4 + 6, 3, 1.1, '#E9E4C9', 3);
    const cy = -stemH - Ry * 0.85;
    const cp = { base: col, light: mix(col, '#FFFFFF', 0.45), dark: mix(col, '#3A0A16', 0.4), line: mix(col, '#2A0610', 0.7) };
    const grad = this.bodyGrad(D, cp);
    // Pups on the scion
    for (let i = 0; i < v.pups; i++) {
      const a = i % 2 ? -0.35 : Math.PI + 0.35;
      const px = Math.cos(a) * R * 0.95, py = cy + Ry * 0.35 + (i >> 1) * -R * 0.35;
      out += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(R * 0.3).toFixed(1)}" fill="url(#${grad})" stroke="${cp.line}" stroke-width="2.5"/>`;
    }
    out += `<ellipse cx="0" cy="${cy}" rx="${R}" ry="${Ry}" fill="url(#${grad})" stroke="${cp.line}" stroke-width="3"/>`;
    const clip = D.clip(`<ellipse cx="0" cy="${cy}" rx="${R}" ry="${Ry}"/>`);
    const ribs = 8;
    let rp = '', sp = '';
    for (let i = 0; i < ribs; i++) {
      const th = -Math.PI / 2 + ((i + 0.5) / ribs) * Math.PI, sx = Math.sin(th);
      rp += `<path d="M 0 ${(cy - Ry).toFixed(1)} Q ${(sx * R * 1.3).toFixed(1)} ${cy.toFixed(1)} 0 ${(cy + Ry).toFixed(1)}" stroke="${cp.dark}" stroke-width="2" fill="none" opacity="${(0.5 * Math.cos(th) + 0.2).toFixed(2)}"/>`;
      if (Math.abs(sx) < 0.9 && R > 20) for (let k = 1; k < 4; k++) {
        const t = k / 4, q = 1 - Math.pow(2 * t - 1, 2);
        sp += this.spineCluster(sx * R * 0.95 * Math.sqrt(q), cy - Ry + t * 2 * Ry, 3 + R * 0.05, r() * TAU, '#F7F0DC', 4);
      }
    }
    out += `<g clip-path="url(#${clip})">${rp}</g>${sp}`;
