<title>Windowsill Cactus</title>
<meta name="description" content="Raise a baby cactus on a realistic windowsill in real time, with the view outside matched to your real weather.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Gluten:wght@500..800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>/* Layout: one full-bleed scene (real photo behind a rendered window); sticker-style HUD in the
   corners; a tool caddy docked along the bottom. The game commits to a single look: the scene
   carries its own day/night lighting, and the UI stickers stay light like physical labels. */
:root {
  --paper: #FFFBF1;
  --paper-2: #F4EEDD;
  --ink: #213024;
  --ink-soft: #55644F;
  --line: #2B3A2E;
  --leaf: #4E9A45;
  --leaf-deep: #2F6B34;
  --clay: #D8733F;
  --sun: #F4B63A;
  --water: #3C8FD6;
  --rose: #E8566B;
  --warn: #E08A1E;
  --wood: #C98C55;
  --wood-dark: #7A4A22;
  --shadow-hard: 0 4px 0 rgba(33, 48, 36, 0.3);
  --shadow-soft: 0 12px 28px rgba(20, 16, 10, 0.22);
  --font-display: 'Gluten', 'Nunito', ui-rounded, system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --caddy-h: 112px;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #2A2520;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
kbd { font-family: var(--font-body); }

#app { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#scene { position: absolute; inset: 0; background: #3A342D; }
#scene canvas, #interior, #roomLight, #flashRoom { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#interior { transition: filter 2.5s ease; }

/* ---------- outside ---------- */
#outside { position: absolute; overflow: hidden; background: #8FA3B0; --px: 0px; --py: 0px; }
.photo-wrap { position: absolute; inset: 0; animation: drift 70s ease-in-out infinite alternate; }
.photo {
  position: absolute; inset: -2%; width: 104%; height: 104%; max-width: none; object-fit: cover;
  opacity: 0; transition: opacity 2.4s ease, filter 3s ease;
  transform: translate(var(--px), var(--py));
}
.photo.on { opacity: 1; }
.photo.flash { transition: none; opacity: 0; filter: brightness(1.35) saturate(0.9); }
#skyGrade { position: absolute; inset: 0; pointer-events: none; transition: background 3s ease; }
@keyframes drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.06) translate(-1%, -0.6%); } }

#flashRoom { background: radial-gradient(80% 70% at 50% 35%, rgba(235, 240, 255, 0.9), rgba(200, 210, 255, 0.35)); opacity: 0; mix-blend-mode: screen; }
#roomLight { transition: opacity 3s ease; }

/* ---------- curtain ---------- */
#curtain { position: absolute; pointer-events: none; }
#curtain .panel {
  position: absolute; top: 0; bottom: 0; width: 6.5%;
  background:
    repeating-linear-gradient(90deg, rgba(120, 110, 90, 0.16) 0 2px, rgba(255, 255, 255, 0.5) 5px 8px, rgba(200, 190, 170, 0.14) 11px 13px),
    linear-gradient(180deg, rgba(255, 253, 247, 0.9), rgba(246, 241, 229, 0.82));
  box-shadow: inset 0 -30px 40px rgba(0, 0, 0, 0.05);
  transition: width 0.9s cubic-bezier(.4, .1, .2, 1);
  backdrop-filter: blur(1.5px);
}
#curtain .panel.l { left: 0; border-right: 1px solid rgba(255, 255, 255, 0.5); }
#curtain .panel.r { right: 0; border-left: 1px solid rgba(255, 255, 255, 0.5); }
#curtain.drawn .panel {
  width: 51%;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 10px, rgba(255, 255, 255, 0.3) 16px 22px, rgba(210, 200, 180, 0.1) 28px 32px),
    linear-gradient(180deg, rgba(255, 253, 247, 0.62), rgba(250, 246, 236, 0.5));
}
#curtain::before { content: ''; position: absolute; left: -6px; right: -6px; top: 0; height: 6px; border-radius: 3px; background: linear-gradient(#EDE6D6, #B8AE99); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.25); }

/* ---------- plant ---------- */
#plant, #plantShadow { position: absolute; pointer-events: none; }
#plant svg, #plantShadow svg { width: 100%; height: 100%; overflow: visible; display: block; }
#plant .plant-g, #plant .pot-g, #plant .pot-front { pointer-events: visiblePainted; cursor: pointer; }
#plant .plant-g { animation: breathe 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
#plant:focus-visible { outline: none; }
#plant:focus-visible .plant-g { filter: drop-shadow(0 0 6px var(--sun)); }
#plant.target .plant-g, #plant.target .pot-g { filter: drop-shadow(0 0 10px rgba(255, 236, 140, 0.95)) drop-shadow(0 0 3px rgba(255, 255, 255, 0.9)); }
#plant.squish .plant-g { animation: squish 0.62s cubic-bezier(.3, 1.6, .5, 1); }
#plant.spin .plant-g { animation: spin 0.75s ease-in-out; }
#plant.planting { animation: plantDrop 1s cubic-bezier(.3, 1.4, .5, 1); }
#plantShadow { opacity: 0; filter: brightness(0) blur(4px); transition: opacity 2s ease, transform 2s ease; }
#plantShadow svg .face, #plantShadow svg .flower { display: none; }
#plant .eye { animation: blink 5.6s infinite; transform-box: fill-box; transform-origin: center; }
#plant .bug { animation: wiggle 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.lamp-on #plant .plant-g { filter: drop-shadow(0 0 14px rgba(255, 150, 230, 0.55)) drop-shadow(0 0 3px rgba(255, 190, 240, 0.6)); }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.02); } }
@keyframes squish { 0% { transform: scale(1.14, 0.84); } 40% { transform: scale(0.93, 1.09); } 70% { transform: scale(1.03, 0.98); } 100% { transform: scale(1, 1); } }
@keyframes spin { 0% { transform: scaleX(1); } 45% { transform: scaleX(0.62) skewY(3deg); } 100% { transform: scaleX(1); } }
@keyframes plantDrop { 0% { transform: translateY(-70px) scale(0.9); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(0.12); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

#glassReflect {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity 3s ease; mix-blend-mode: screen;
  background:
    radial-gradient(34% 30% at 16% 20%, rgba(255, 196, 130, 0.30), rgba(255, 196, 130, 0) 70%),
    radial-gradient(18% 14% at 82% 70%, rgba(255, 220, 170, 0.12), rgba(255, 220, 170, 0) 70%),
    linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(255, 240, 220, 0.07) 42%, rgba(255, 255, 255, 0) 55%);
}

/* ---------- grow lamp ---------- */
#growLamp { position: absolute; pointer-events: none; opacity: 0; transform: translateY(-14px) rotate(-4deg); transition: opacity 0.5s ease, transform 0.6s cubic-bezier(.3, 1.5, .5, 1); }
#growLamp svg { position: relative; width: 100%; height: 100%; overflow: visible; }
#growLamp.on { opacity: 1; transform: none; }
#growLamp .cone {
  position: absolute; left: -95%; top: 52%; width: 170%; height: 260%;
  background: conic-gradient(from 200deg at 78% 0%, rgba(255, 170, 235, 0) 0deg, rgba(255, 190, 240, 0.4) 16deg, rgba(255, 215, 245, 0.5) 30deg, rgba(255, 170, 235, 0) 54deg);
  filter: blur(8px); mix-blend-mode: screen; opacity: 0; transition: opacity 0.6s ease;
}
#growLamp.on .cone { opacity: 1; }

/* ---------- window sash handle ---------- */
#sashHit { position: absolute; cursor: ns-resize; touch-action: none; border-radius: 6px; z-index: 5; }
#sashHit:hover, #sashHit.grab { background: rgba(255, 236, 150, 0.18); box-shadow: 0 0 0 2px rgba(255, 236, 150, 0.55); }
.target-glass #fxGlass { filter: drop-shadow(0 0 0 transparent); }
.target-glass #outside { box-shadow: inset 0 0 0 4px rgba(255, 236, 150, 0.8); }

/* ---------- cards / HUD ---------- */
.card {
  background: var(--paper);
  border: 2.5px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-hard), var(--shadow-soft);
}
#hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; pointer-events: none;
}
#hud > * { pointer-events: auto; }
.plant-card { display: flex; align-items: stretch; gap: 0; padding: 0; overflow: hidden; min-width: 0; max-width: 330px; position: relative; }
.plant-card::before { /* the stake of a nursery plant tag */
  content: ''; position: absolute; left: -2px; top: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%) rotate(45deg);
  background: var(--paper); border-left: 2.5px solid var(--line); border-bottom: 2.5px solid var(--line); display: none;
}
.plant-card .day {
  display: grid; place-content: center; text-align: center; padding: 8px 12px; min-width: 64px;
  background: var(--leaf); color: #fff; border-right: 2.5px solid var(--line);
}
.plant-card .day span { font: 800 11px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.9; }
.plant-card .day b { font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-top: 2px; }
.pc-main { padding: 9px 14px 10px; min-width: 0; }
.pc-main h1 { margin: 0; font: 700 23px/1.05 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-main .latin { margin: 1px 0 3px; font: 700 18px/1 var(--font-hand); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 12.5px; color: var(--leaf-deep); }
.sdots { display: inline-flex; gap: 3px; }
.sdots i { width: 8px; height: 8px; border-radius: 50%; border: 1.8px solid var(--leaf-deep); background: transparent; }
.sdots i.on { background: var(--leaf); }
.stage .height { color: var(--ink-soft); font-weight: 700; font-variant-numeric: tabular-nums; }

.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
.hud-row { display: flex; gap: 8px; align-items: stretch; }
.weather-chip { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 9px; text-align: left; max-width: 330px; min-width: 0; }
.weather-chip:active, .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(33, 48, 36, 0.3), var(--shadow-soft); }
.wx-icon svg { width: 44px; height: 46px; display: block; }
.wx-text { display: flex; flex-direction: column; min-width: 0; }
.wx-main { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wx-main b { font: 700 21px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.wx-sub { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.weather-chip[data-src="live"] #wxSrc { color: var(--leaf-deep); }
.weather-chip[data-src="live"] #wxSrc::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3CC35C; margin-right: 4px; vertical-align: 1px; box-shadow: 0 0 0 3px rgba(60, 195, 92, 0.25); animation: pulse 2s ease-in-out infinite; }
.weather-chip[data-src="preview"] { background: #FFF4D6; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(60, 195, 92, 0.08); } }
.clock { display: flex; flex-direction: column; justify-content: center; padding: 5px 12px; text-align: right; }
.clock b { font: 700 17px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.clock span { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
.icon-btn { width: 50px; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 26px; height: 26px; }

/* ---------- meters ---------- */
.meters {
  position: absolute; z-index: 19; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 104px);
  width: clamp(220px, 21vw, 272px); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px;
}
.meter { display: grid; grid-template-columns: 20px 1fr auto; grid-template-rows: auto 9px; column-gap: 7px; align-items: center; }
.meter .mi { grid-column: 1; grid-row: 1 / 3; display: grid; place-items: center; }
.meter .mi svg { width: 20px; height: 20px; }
.meter .ml { grid-column: 2; grid-row: 1; font-weight: 800; font-size: 12.5px; color: var(--ink); white-space: nowrap; }
.meter .val { grid-column: 3; grid-row: 1; font-weight: 800; font-size: 12px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .track { grid-column: 2 / 4; grid-row: 2; height: 9px; border-radius: 6px; background: #E9E2D0; border: 1.8px solid var(--line); overflow: hidden; }
.meter .fill { display: block; height: 100%; width: 0; border-radius: 4px; transition: width 0.8s ease, background 0.5s ease; background: var(--leaf); }
.meter[data-tone="dry"] .fill { background: linear-gradient(90deg, #E0A33C, #F2C46D); }
.meter[data-tone="wet"] .fill { background: linear-gradient(90deg, #2F7CC2, #5DB0EA); }
.meter[data-tone="ok"] .fill { background: linear-gradient(90deg, #3E8B3E, #6DBE5A); }
.meter[data-tone="mid"] .fill { background: linear-gradient(90deg, #D9941F, #F2C94C); }
.meter[data-tone="low"] .fill { background: linear-gradient(90deg, #C9443C, #EE7A62); }
.meter[data-tone="grow"] .fill { background: repeating-linear-gradient(135deg, #6DBE5A 0 6px, #5BAE4A 6px 12px); }
#mSoil .fill { transition: width 1.2s cubic-bezier(.3, .7, .3, 1); }
.need {
  margin-top: 3px; display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 8px 8px 11px;
  border: 2px dashed #B9AE95; background: var(--paper-2); border-radius: 12px; font-weight: 700; font-size: 13px; line-height: 1.25;
}
.need .need-text { flex: 1; min-width: 0; }
.need .act { flex: none; background: var(--leaf); color: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 3px 9px; font-weight: 800; font-size: 12.5px; box-shadow: 0 2px 0 var(--line); }
.need:hover .act { background: var(--leaf-deep); }

/* ---------- caddy ---------- */
#caddy {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; justify-content: center; pointer-events: none;
}
.caddy-box {
  pointer-events: auto; display: flex; align-items: stretch; gap: 8px; max-width: 100%; min-width: 0; overflow-x: auto; scrollbar-width: none;
  padding: 10px 12px 12px; border: 2.5px solid #4A2C12; border-radius: 22px;
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 30px, rgba(74, 44, 18, 0.35) 30px 32px),
    linear-gradient(180deg, #D9A26B, #B87B45);
  box-shadow: 0 4px 0 #4A2C12, 0 14px 30px rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 230, 190, 0.5);
}
.caddy-box::-webkit-scrollbar { display: none; }
.caddy-div { width: 3px; border-radius: 2px; background: rgba(74, 44, 18, 0.55); margin: 4px 2px; flex: none; }
.tools { display: flex; gap: 8px; }
.tool {
  position: relative; flex: none; width: 80px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 4px 6px; border: 2.5px solid var(--line); border-radius: 16px; background: var(--paper);
  box-shadow: 0 4px 0 rgba(43, 58, 46, 0.55); touch-action: pan-x;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
}
.tool:hover { transform: translateY(-3px); box-shadow: 0 7px 0 rgba(43, 58, 46, 0.55); }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43, 58, 46, 0.55); }
.tool .tool-icon { width: 46px; height: 46px; display: grid; place-items: center; pointer-events: none; }
.tool .tool-icon svg { width: 46px; height: 46px; overflow: visible; }
.tool .tool-name { font-weight: 800; font-size: 12.5px; line-height: 1.1; white-space: nowrap; pointer-events: none; }
.tool kbd {
  position: absolute; top: 4px; right: 5px; font-size: 10px; font-weight: 900; color: var(--ink-soft);
  border: 1.5px solid #CFC5AE; border-radius: 5px; padding: 0 3px; line-height: 14px; background: #fff;
}
.tool.on { background: #FFF1B8; }
.tool.dim { opacity: 0.55; }
.tool.nudge { background: #FFF6D8; animation: nudge 1.6s ease-in-out infinite; }
.tool.nudge::after { content: ''; position: absolute; inset: -6px; border-radius: 20px; border: 3px solid var(--sun); opacity: 0.9; pointer-events: none; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
body.dragging, body.dragging * { cursor: grabbing !important; }

.tool-ghost {
  position: fixed; left: 0; top: 0; z-index: 60; width: 86px; height: 86px; pointer-events: none;
  filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.35)); transition: transform 0.05s linear;
}
.tool-ghost svg { width: 100%; height: 100%; overflow: visible; }
.tool-ghost.flying { transition: transform 0.38s cubic-bezier(.3, .8, .3, 1); }
.tool-ghost.bye { opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; }

/* ---------- bubble, toasts, hints ---------- */
#bubble {
  position: absolute; z-index: 16; transform: translate(-50%, -100%) scale(0.9); transform-origin: 50% 100%;
  background: var(--paper); border: 2.5px solid var(--line); border-radius: 18px; padding: 10px 14px;
  font-weight: 800; font-size: 14.5px; line-height: 1.3; box-shadow: var(--shadow-hard), var(--shadow-soft);
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.35s cubic-bezier(.3, 1.6, .5, 1); text-wrap: pretty;
}
#bubble::after {
  content: ''; position: absolute; left: 50%; bottom: -11px; width: 16px; height: 16px; transform: translateX(-50%) rotate(45deg);
  background: var(--paper); border-right: 2.5px solid var(--line); border-bottom: 2.5px solid var(--line); border-bottom-right-radius: 4px;
}
#bubble.in { opacity: 1; transform: translate(-50%, -100%) scale(1); }

#toasts {
  position: absolute; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: min(440px, calc(100% - 32px));
}
.toast {
  display: flex; gap: 8px; align-items: center; background: var(--paper); border: 2.5px solid var(--line); border-radius: 14px;
  padding: 8px 14px; font-weight: 800; font-size: 14px; box-shadow: var(--shadow-hard), var(--shadow-soft);
  opacity: 0; transform: translateY(-10px); transition: opacity 0.25s ease, transform 0.3s ease; text-align: center; text-wrap: balance;
}
.toast.in { opacity: 1; transform: none; }
.toast.good { background: #EAF6DF; }
.toast.warn { background: #FFF0D6; }
.toast.big { background: #FFF6CF; font: 700 18px/1.2 var(--font-display); padding: 10px 18px; }
.toast .ti svg { width: 18px; height: 18px; display: block; }

#hint {
  position: absolute; z-index: 21; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--caddy-h) + 14px);
  transform: translateX(-50%) translateY(6px); background: rgba(33, 36, 30, 0.88); color: #FFFBF1; border-radius: 10px;
  padding: 6px 12px; font-weight: 700; font-size: 13px; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}
#hint.in { opacity: 1; transform: translateX(-50%); }

#meterPop {
  position: absolute; z-index: 17; transform: translate(-50%, -10px) scale(0.85); opacity: 0; width: 150px; padding: 10px 10px 8px;
  background: var(--paper); border: 2.5px solid var(--line); border-radius: 18px; text-align: center; box-shadow: var(--shadow-hard), var(--shadow-soft);
  transition: opacity 0.25s ease, transform 0.35s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none;
}
#meterPop.in { opacity: 1; transform: translate(-50%, 0) scale(1); }
#meterPop svg { width: 100%; display: block; }
#meterPop svg text { font-family: var(--font-body); }
#meterPop .needle { transform-origin: 60px 70px; transition: transform 1s cubic-bezier(.3, 1.4, .5, 1); }
#meterPop b { font: 700 28px/1 var(--font-display); display: block; margin-top: -4px; }
#meterPop span { font-weight: 900; font-size: 12px; letter-spacing: 0.1em; color: var(--ink-soft); }

.credit {
  position: absolute; z-index: 19; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--caddy-h) + 10px);
  border: 0; background: rgba(20, 20, 18, 0.45); color: rgba(255, 255, 255, 0.85); font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 8px; max-width: 45vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.credit:hover { background: rgba(20, 20, 18, 0.7); color: #fff; }

/* ---------- modal ---------- */
#modal {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  background: rgba(24, 26, 20, 0.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0; transition: opacity 0.22s ease;
}
#modal.show { opacity: 1; }
.sheet {
  position: relative; width: min(560px, 100%); max-height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 16px);
  overflow: auto; background: var(--paper); border: 2.5px solid var(--line); border-radius: 24px; padding: 24px;
  box-shadow: 0 6px 0 rgba(33, 48, 36, 0.35), 0 30px 60px rgba(0, 0, 0, 0.35); transform: translateY(12px) scale(0.98);
  transition: transform 0.28s cubic-bezier(.3, 1.3, .5, 1); overscroll-behavior: contain; user-select: text; -webkit-user-select: text;
}
#modal.show .sheet { transform: none; }
.sheet:focus { outline: none; }
.sheet.wide { width: min(1000px, 100%); }
.sheet h2 { font: 700 30px/1.08 var(--font-display); margin: 0 0 10px; text-wrap: balance; }
.sheet h4 { margin: 18px 0 8px; font-size: 12.5px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--leaf-deep); }
.lede { margin: 0; font-size: 16px; line-height: 1.5; max-width: 62ch; color: var(--ink-soft); font-weight: 600; }
.note { margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-soft); font-weight: 600; max-width: 65ch; }
.note a, .credit-list a { color: var(--leaf-deep); font-weight: 800; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.row input[type="text"] { flex: 1; min-width: 160px; }
.btn {
  border: 2.5px solid var(--line); border-radius: 14px; padding: 10px 18px; font-weight: 900; font-size: 15px; background: var(--paper);
  box-shadow: 0 4px 0 var(--line); transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--leaf); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--leaf-deep); }
.btn.ghost { background: var(--paper); }
.btn.ghost:hover { background: var(--paper-2); }
.btn.danger { color: #A3322B; border-color: #A3322B; box-shadow: 0 4px 0 #A3322B; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
input[type="text"] {
  width: 100%; box-sizing: border-box; border: 2.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 800; font-size: 16px;
  background: #fff; user-select: text;
}
.field { margin-top: 14px; }
.field > label { display: block; font-size: 12.5px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
.field.inline { display: flex; align-items: center; gap: 10px; }
.field.inline > label { margin: 0; }
.field.inline input[type="range"] { flex: 1; accent-color: var(--leaf); }
.field output { font-weight: 900; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip-btn, .mini-btn {
  border: 2px solid var(--line); background: var(--paper-2); border-radius: 999px; padding: 4px 11px; font-weight: 800; font-size: 13px;
}
.chip-btn:hover, .mini-btn:hover { background: #FFF1B8; }
.mini-btn.accent { background: var(--sun); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg.small { display: flex; flex-wrap: wrap; }
.seg button {
  border: 2.5px solid var(--line); background: #fff; border-radius: 12px; padding: 7px 10px; font-weight: 800; font-size: 13.5px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 3px 0 rgba(43, 58, 46, 0.4);
}
.seg button b { font: 700 20px/1 var(--font-display); }
.seg button span { font-size: 12px; color: var(--ink-soft); }
.seg button.on { background: var(--leaf); color: #fff; }
.seg button.on span { color: #EAF6DF; }
.seg button:disabled { opacity: 0.4; cursor: not-allowed; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--line); box-shadow: 0 3px 0 rgba(43, 58, 46, 0.4); }
.swatch.on { outline: 3px solid var(--sun); outline-offset: 2px; }
dl.stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 8px 0 0; font-size: 14.5px; }
dl.stats dt { font-weight: 800; color: var(--ink-soft); }
dl.stats dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; }
dl.stats.small { font-size: 13px; grid-template-columns: auto 1fr auto 1fr; }

/* onboarding */
.onboard { padding: 26px; }
.wel-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.wel-head h2 { font-size: 38px; margin-bottom: 6px; }
.species-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.species-card {
  display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; background: #fff;
  border: 2.5px solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 rgba(43, 58, 46, 0.45); transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.species-card:hover { transform: translateY(-3px); box-shadow: 0 7px 0 rgba(43, 58, 46, 0.45); }
.species-card[aria-pressed="true"] { outline: 4px solid var(--sun); outline-offset: 2px; background: #FFFCEB; }
.sc-art {
  height: 150px; position: relative;
  background: linear-gradient(180deg, #BFE0F5 0%, #E8F3F7 62%, #C18A56 62%, #A56E3E 72%, #EBDFC9 72%);
  border-bottom: 2.5px solid var(--line);
}
.sc-art svg { position: absolute; left: 50%; bottom: 18px; height: 136px; width: auto; transform: translateX(-50%); overflow: visible; }
.sc-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.sc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.sc-head h3 { margin: 0; font: 700 20px/1.1 var(--font-display); }
.latin { font: 700 17px/1.1 var(--font-hand); color: var(--ink-soft); margin: 0; }
.blurb { margin: 2px 0 4px; font-size: 13.5px; line-height: 1.35; font-weight: 600; color: var(--ink-soft); }
.pill { font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; border: 2px solid var(--line); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.diff-easy { background: #DDF2CF; }
.diff-medium { background: #FFEBB8; }
.diff-tricky { background: #FFD6CC; }
.traits { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: auto; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.traits > span { display: inline-flex; align-items: center; gap: 4px; }
.dots { display: inline-flex; gap: 1px; }
.dots i { width: 15px; height: 15px; opacity: 0.22; filter: grayscale(1); }
.dots i.on { opacity: 1; filter: none; }
.dots svg { width: 15px; height: 15px; display: block; }
.wel-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
.wel-foot .fact { margin: 0; flex: 1; min-width: 220px; font: 700 20px/1.25 var(--font-hand); color: var(--leaf-deep); }
.naming { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; }
.name-art {
  height: 280px; border: 2.5px solid var(--line); border-radius: 18px; position: relative; overflow: hidden;
  background: linear-gradient(180deg, #BFE0F5 0%, #E8F3F7 66%, #C18A56 66%, #A56E3E 76%, #EBDFC9 76%);
}
.name-art svg { position: absolute; left: 50%; bottom: 26px; height: 230px; width: auto; transform: translateX(-50%); overflow: visible; }
.name-body h2 { font-size: 34px; }

/* report */
.report h2 { font-size: 32px; }
.wx-list, .events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.wx-list li { display: grid; grid-template-columns: 28px 44px 1fr; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.wx-i svg { width: 28px; height: 30px; display: block; }
.events li { font-weight: 700; font-size: 14px; padding-left: 18px; position: relative; }
.events li::before { content: ''; position: absolute; left: 3px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); }
.todo { margin: 16px 0 0; padding: 10px 14px; border: 2px dashed #B9AE95; border-radius: 12px; background: var(--paper-2); font-weight: 800; }

/* weather */
.weather-panel section { border-top: 2px solid #E6DECB; margin-top: 16px; padding-top: 2px; }
.sky-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.sky-chip {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border: 2.5px solid var(--line); border-radius: 14px;
  background: #fff; font-weight: 800; font-size: 12.5px; box-shadow: 0 3px 0 rgba(43, 58, 46, 0.4);
}
.sky-chip svg { width: 38px; height: 40px; }
.sky-chip:hover { background: #FFF6D8; }
.sky-chip.on { background: #EAF6DF; outline: 3px solid var(--leaf); }
.preview-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* journal */
.journal-sheet { padding: 22px; }
.j-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.j-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-areas: "chart days" "ach days"; gap: 8px 22px; }
.j-chart { grid-area: chart; }
.j-days { grid-area: days; min-width: 0; }
.j-ach { grid-area: ach; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font: 700 10px var(--font-body); fill: var(--ink-soft); }
.chart .grid { stroke: #E3DBC7; stroke-width: 1; }
.chart .area { fill: rgba(94, 175, 85, 0.18); }
.chart .line { fill: none; stroke: var(--leaf-deep); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--leaf); stroke: var(--line); stroke-width: 2; }
.chart .unit { font-weight: 900; }
ol.days {
  list-style: none; margin: 0; padding: 4px 12px; max-height: 430px; overflow: auto; border: 2px solid #E3DBC7; border-radius: 14px;
  background: repeating-linear-gradient(180deg, #FFFDF6 0 33px, #E9E1CC 33px 34px);
}
ol.days li { display: grid; grid-template-columns: 64px 30px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px dashed #DDD3BC; }
ol.days li.today { grid-template-columns: 64px 1fr; }
.jd b { display: block; font: 700 16px/1.1 var(--font-display); }
.jd span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.jx p { margin: 0; font-size: 13.5px; font-weight: 700; line-height: 1.35; }
.jx .hand { font: 700 19px/1.15 var(--font-hand); color: var(--leaf-deep); margin-top: 2px; }
ul.ach { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
ul.ach li { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 2px solid #E3DBC7; border-radius: 12px; opacity: 0.6; }
ul.ach li.got { opacity: 1; border-color: var(--line); background: #FFFAE6; }
ul.ach .medal svg { width: 26px; height: 26px; display: block; }
ul.ach b { display: block; font-size: 13px; }
ul.ach span { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); line-height: 1.2; }

/* repot + credits */
.repot { display: grid; grid-template-columns: 260px 1fr; gap: 22px; align-items: start; }
.repot-art {
  height: 300px; border: 2.5px solid var(--line); border-radius: 18px; position: relative; overflow: hidden;
  background: linear-gradient(180deg, #BFE0F5 0%, #E8F3F7 70%, #C18A56 70%, #A56E3E 80%, #EBDFC9 80%);
}
.repot-art svg { position: absolute; left: 50%; bottom: 20px; height: 270px; width: auto; transform: translateX(-50%); overflow: visible; }
.pot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pot-opt { display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 8px; border: 2.5px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 rgba(43, 58, 46, 0.4); }
.pot-opt.on { background: #EAF6DF; outline: 3px solid var(--leaf); }
.pot-opt:disabled { opacity: 0.5; cursor: not-allowed; }
.pot-opt b { font-size: 13.5px; }
.pot-opt small { grid-column: 2; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }
.pot-dot { grid-row: 1 / 3; width: 28px; height: 28px; border-radius: 6px 6px 10px 10px; border: 2px solid var(--line); }
.pot-dot[data-style="terracotta"] { background: #D8733F; }
.pot-dot[data-style="sky"] { background: #3C94D6; }
.pot-dot[data-style="cream"] { background: radial-gradient(circle at 30% 40%, #8C765A 1.5px, transparent 2px) 0 0/8px 8px, #F1E6D0; }
.pot-dot[data-style="talavera"] { background: radial-gradient(circle, #2F5DB8 3px, transparent 3.5px) 0 0/10px 10px, #F7F1E4; }
.pot-dot[data-style="sunset"] { background: linear-gradient(#F08A4B 33%, #F6C453 33% 66%, #E8566B 66%); }
.pot-dot[data-style="midnight"] { background: #2E333B; }
.help ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: step; }
.help li { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; }
.help li .hi { width: 38px; height: 38px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
.help li .hi svg { width: 28px; height: 28px; }
.help li b { display: block; font-size: 15px; }
.help li span { font-size: 13.5px; font-weight: 600; color: var(--ink-soft); line-height: 1.4; }
.help .keys { margin-top: 12px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
.help .keys kbd { border: 1.5px solid #CFC5AE; border-radius: 5px; padding: 0 4px; background: #fff; font-weight: 900; }
.credit-list { margin: 12px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .species-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .j-grid { grid-template-columns: 1fr; grid-template-areas: "chart" "days" "ach"; }
}
@media (max-width: 720px) {
  :root { --caddy-h: 96px; }
  #hud { padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 0; gap: 8px; }
  .plant-card { max-width: none; flex: 1; }
  .plant-card .day { min-width: 50px; padding: 6px 8px; }
  .plant-card .day b { font-size: 26px; }
  .pc-main { padding: 6px 10px 7px; }
  .pc-main h1 { font-size: 19px; }
  .pc-main .latin { font-size: 15px; }
  .stage { font-size: 11.5px; gap: 5px; }
  .stage .height { display: none; }
  .weather-chip { padding: 5px 9px 5px 6px; gap: 6px; max-width: 180px; }
  .wx-icon svg { width: 34px; height: 36px; }
  .wx-main { font-size: 13px; }
  .wx-main b { font-size: 18px; }
  .wx-main #wxCond, .wx-sub { display: none; }
  .clock { display: none; }
  .icon-btn { width: 42px; height: 42px; }
  #btnHelp { display: none; }
  .hud-right { flex-direction: row; align-items: stretch; gap: 6px; }
  .meters {
    top: auto; left: 10px; right: 10px; width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--caddy-h) + 6px);
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 8px 10px;
  }
  .meters .need { grid-column: 1 / -1; margin-top: 0; padding: 6px 6px 6px 9px; font-size: 12.5px; }
  .meter .ml { font-size: 11.5px; }
  .meter .val { font-size: 11px; }
  #caddy { padding: 0 8px calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .caddy-box { padding: 8px 8px 10px; gap: 6px; border-radius: 18px; }
  .tool { width: 68px; padding: 5px 2px 5px; border-radius: 14px; }
  .tool .tool-icon, .tool .tool-icon svg { width: 38px; height: 38px; }
  .tool .tool-name { font-size: 11.5px; }
  .tool kbd { display: none; }
  .credit { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 66px); right: 10px; font-size: 10px; }
  .sheet { padding: 18px; border-radius: 20px; }
  .sheet h2 { font-size: 26px; }
  .wel-head h2 { font-size: 30px; }
  .species-grid { grid-template-columns: 1fr; }
  .species-card { flex-direction: row; }
  .sc-art { height: auto; width: 116px; flex: none; border-bottom: 0; border-right: 2.5px solid var(--line); }
  .sc-art svg { height: 104px; bottom: 16px; }
  .naming, .repot { grid-template-columns: 1fr; }
  .name-art { height: 170px; }
  .name-art svg { height: 150px; bottom: 18px; }
  .repot-art { height: 200px; }
  .repot-art svg { height: 180px; }
  .seg button { padding: 6px 4px; }
  dl.stats.small { grid-template-columns: auto 1fr; }
}
@media (max-height: 560px) and (min-width: 721px) {
  .meters { top: calc(env(safe-area-inset-top, 0px) + 92px); gap: 4px; padding: 7px 10px; width: 220px; }
  .meters .need { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .photo-wrap, #plant .plant-g, #plant .eye, #plant .bug, .tool.nudge, .weather-chip[data-src="live"] #wxSrc::before { animation: none !important; }
  .photo, #interior, #plantShadow { transition-duration: 0.01s !important; }
}
</style>

          <path d="M18 50 L58 34 Q66 32 68 40 L70 48 Q71 55 64 57 L24 66 Q16 67 15 60 Z" fill="#5C6470" stroke="#1D2127" stroke-width="3.5" stroke-linejoin="round"/>

          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#FFE9A8" stroke="#2C3A33" stroke-width="1.8"/><path d="M9.3 9.4 A2.8 2.8 0 1 1 13 12 Q12 12.6 12 14" stroke="#2C3A33" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.3" fill="#2C3A33"/></svg>
        </button>
        <button class="card icon-btn" id="btnJournal" type="button" aria-label="Journal" title="Journal">
          <svg viewBox="0 0 24 24"><path d="M4 5 Q4 3 6 3 H19 V19 H6 Q4 19 4 21 Z" fill="#E4834F" stroke="#6A2E14" stroke-width="1.6"/><path d="M4 21 Q4 19 6 19 H19 V21 Z" fill="#FBF3E4" stroke="#6A2E14" stroke-width="1.4"/><path d="M8 7 H15 M8 10 H13" stroke="#FBF3E4" stroke-width="1.6" stroke-linecap="round"/></svg>

function mulberry32(seed) {
  let a = seed >>> 0;
  return function rand() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Classic 2D gradient noise, roughly in [-0.7, 0.7]. */
function makeNoise(seed = 1) {
  const r = mulberry32(seed);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [perm[i], perm[j]] = [perm[j], perm[i]];
  }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const G = [[1, 0], [-1, 0], [0, 1], [0, -1], [0.7071, 0.7071], [-0.7071, 0.7071], [0.7071, -0.7071], [-0.7071, -0.7071]];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  return function noise(x, y) {
    const xf = Math.floor(x), yf = Math.floor(y);
    const X = xf & 255, Y = yf & 255;
    x -= xf; y -= yf;
    const u = fade(x), v = fade(y);
    const g = (i, j, dx, dy) => { const q = G[p[p[i] + j] & 7]; return q[0] * dx + q[1] * dy; };
    const n00 = g(X, Y, x, y), n10 = g(X + 1, Y, x - 1, y);
    const n01 = g(X, Y + 1, x, y - 1), n11 = g(X + 1, Y + 1, x - 1, y - 1);
    return lerp(lerp(n00, n10, u), lerp(n01, n11, u), v);
  };
}

function fbm(noise, x, y, octaves = 4) {
  let sum = 0, amp = 1, f = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * noise(x * f, y * f);
    norm += amp; amp *= 0.5; f *= 2.03;
  }
  return sum / norm;
}

}

const pad2 = (n) => String(n).padStart(2, '0');

}
/* Whole calendar days between two instants, DST-safe. */
function calendarDays(t0, t1) {

}

function fmtAgo(ms) {

  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} h ago`;

  return `${d} day${d === 1 ? '' : 's'} ago`;
}

  for (const [k, v] of Object.entries(props || {})) {

    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);

    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);

    if (c == null || c === false) continue;

}

// ---- sun.js ----
/* Solar position (low-precision almanac formulas, good to ~0.5°). */

function sunPosition(t, lat, lon) {
  const d = t / DAY + 2440587.5 - 2451545.0; // days since J2000
  const g = ((357.529 + 0.98560028 * d) % 360) * DEG;
  const q = (280.459 + 0.98564736 * d) % 360;
  const L = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * DEG;
  const eps = (23.439 - 0.00000036 * d) * DEG;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(eps) * Math.sin(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
  const lst = (gmst * 15 + lon) * DEG;
  const H = lst - ra;
  const phi = lat * DEG;
  const el = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const A = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
  const az = ((A / DEG) + 180 + 360) % 360;
  return { el: el / DEG, az };
}

/* Times (ms) when the sun crosses `alt` degrees on the local calendar day of t. */
function sunCrossings(t, lat, lon, alt = -0.833) {
  const t0 = startOfDay(t);
  const step = 10 * MIN;
  let rise = null, set = null;
  let prev = sunPosition(t0, lat, lon).el - alt;
  for (let k = step; k <= DAY; k += step) {
    const cur = sunPosition(t0 + k, lat, lon).el - alt;
    if (prev < 0 && cur >= 0 && rise == null) rise = refine(t0 + k - step, t0 + k);
    if (prev >= 0 && cur < 0 && set == null) set = refine(t0 + k - step, t0 + k);
    prev = cur;
  }
  return { rise, set };
  function refine(a, b) {
    const up = sunPosition(a, lat, lon).el - alt < 0;
    for (let i = 0; i < 12; i++) {
      const m = (a + b) / 2;
      const below = sunPosition(m, lat, lon).el - alt < 0;
      if (below === up) a = m; else b = m;
    }
    return (a + b) / 2;
  }
}

/* Coarse phase of the sky, used for photo choice and room lighting. */
function skyPhase(t, lat, lon) {
  const { el, az } = sunPosition(t, lat, lon);
  const morning = az < 180;
  if (el < -7) return { phase: 'night', el, az };
  if (el < -0.5) return { phase: morning ? 'dawn' : 'dusk', el, az };
  if (el < 8) return { phase: morning ? 'sunrise' : 'sunset', el, az };
  return { phase: 'day', el, az };
}

/* 0 (full night) .. 1 (full daylight) ambient level, smooth through twilight. */
function daylightLevel(el) {
  return smoothstep(-8, 10, el);
}

/* Month 1..12 in the plant's growing hemisphere (southern hemisphere shifted by 6). */
function hemiMonth(t, lat) {
  const m = new Date(t).getMonth() + 1;
  return lat < 0 ? ((m + 5) % 12) + 1 : m;
}

function seasonOf(t, lat) {
  const m = hemiMonth(t, lat);
  if (m === 12 || m <= 2) return 'winter';
  if (m <= 5) return 'spring';
  if (m <= 8) return 'summer';
  return 'autumn';
}

const ACCU_SERVER = 'AccuWeather®';

const ACCU_ICONS = {

  26: 'freezing_rain', 29: 'sleet', 30: 'clear', 31: 'clear', 32: 'partly',
  33: 'clear', 34: 'mostly_clear', 35: 'partly', 36: 'partly', 37: 'haze', 38: 'cloudy', 39: 'rain', 40: 'rain',
  41: 'storm', 42: 'storm', 43: 'flurries', 44: 'snow',
};

const TEXT_RULES = [
  [/thunder|t-?storm|lightning/i, 'storm'],
  [/freezing (rain|drizzle)|ice pellets|glaze|\bice\b/i, 'freezing_rain'],
  [/sleet|wintry mix|rain and snow|snow and rain/i, 'sleet'],
  [/flurr/i, 'flurries'],
  [/blizzard|snow/i, 'snow'],
  [/heavy rain|downpour|torrential|pouring/i, 'heavy_rain'],
  [/drizzle|sprinkle|light rain/i, 'drizzle'],
  [/rain|shower/i, 'rain'],
  [/fog|mist/i, 'fog'],
  [/haz|smoke|dust/i, 'haze'],
  [/overcast|dreary/i, 'overcast'],
  [/mostly cloudy|considerable cloud/i, 'cloudy'],
  [/partly|intermittent clouds|some clouds|variable clouds|few clouds/i, 'partly'],
  [/mostly (sunny|clear)/i, 'mostly_clear'],
  [/cloud/i, 'overcast'],
  [/sunny|clear|fair|sunshine/i, 'clear'],
];

function condFromText(text) {
  if (!text) return null;
  for (const [re, cond] of TEXT_RULES) if (re.test(text)) return cond;
  return null;
}

function walkJson(obj, fn, depth = 0, seen = new Set()) {
  if (obj == null || depth > 9 || typeof obj !== 'object' || seen.has(obj)) return;
  seen.add(obj);
  if (Array.isArray(obj)) {
    for (const v of obj.slice(0, 60)) walkJson(v, fn, depth + 1, seen);
    return;
  }
  for (const [k, v] of Object.entries(obj)) {
    fn(k, v, obj);
    walkJson(v, fn, depth + 1, seen);
  }
}

/* Pull a temperature in °C out of the many shapes weather APIs use. */
function readTempC(v, holder) {
  if (v == null) return null;
  if (typeof v === 'number') {
    const unit = String(holder?.Unit ?? holder?.unit ?? holder?.units ?? '').toUpperCase();
    if (unit.startsWith('F')) return (v - 32) / 1.8;
    if (unit.startsWith('C')) return v;
    return null;
  }
  if (typeof v === 'string') {
    const m = v.match(/(-?\d+(?:\.\d+)?)\s*°?\s*([CF])\b/i);
    if (m) return m[2].toUpperCase() === 'F' ? (parseFloat(m[1]) - 32) / 1.8 : parseFloat(m[1]);
    return null;
  }
  if (typeof v === 'object') {
    if (v.Metric && typeof v.Metric.Value === 'number') return v.Metric.Value;
    if (v.metric && typeof v.metric.value === 'number') return v.metric.value;
    if (v.Imperial && typeof v.Imperial.Value === 'number') return (v.Imperial.Value - 32) / 1.8;
    if (v.imperial && typeof v.imperial.value === 'number') return (v.imperial.value - 32) / 1.8;
    if (typeof v.Value === 'number') return readTempC(v.Value, v);
    if (typeof v.value === 'number') return readTempC(v.value, v);
    if (typeof v.celsius === 'number') return v.celsius;
    if (typeof v.fahrenheit === 'number') return (v.fahrenheit - 32) / 1.8;
  }
  return null;
}

/* Best-effort reading of a current-conditions payload of unknown shape. */
function parseCurrentConditions(result) {
  const payload = result && 'payload' in result ? result.payload : result;
  const texts = [];
  for (const block of result?.content || []) if (block?.type === 'text' && block.text) texts.push(block.text);
  const out = { text: null, icon: null, isDay: null, tempC: null, humidity: null, cloud: null, wind: null, precipType: null, hasPrecip: null, place: null, lat: null, lon: null };

  const visit = (k, v, holder) => {
    const key = k.toLowerCase().replace(/[^a-z]/g, '');
    if (out.text == null && typeof v === 'string' && v.length < 80 && /^(weathertext|iconphrase|phrase|shortphrase|condition|conditions|conditiontext|summary|description|weather|text|weatherdescription)$/.test(key) && condFromText(v)) out.text = v;
    if (out.icon == null && typeof v === 'number' && /^(weathericon|icon|iconcode|iconnumber)$/.test(key) && v >= 1 && v <= 44) out.icon = v;
    if (out.isDay == null && typeof v === 'boolean' && /^(isdaytime|isday|daytime|day)$/.test(key)) out.isDay = v;
    if (out.tempC == null && /^(temperature|temp|tempc|temperaturec|tempf|temperaturef|airtemperature|currenttemperature)$/.test(key)) {
      let c = readTempC(v, holder);
      if (c == null && typeof v === 'number') c = /f$/.test(key) ? (v - 32) / 1.8 : /c$/.test(key) ? v : null;
      if (c != null && c > -70 && c < 60) out.tempC = c;
    }
    if (out.humidity == null && typeof v === 'number' && /^(relativehumidity|humidity|indoorrelativehumidity)$/.test(key) && v >= 0 && v <= 100) out.humidity = v;
    if (out.cloud == null && typeof v === 'number' && /^(cloudcover|clouds|cloudiness)$/.test(key) && v >= 0 && v <= 100) out.cloud = v;
    if (out.wind == null && /^(wind|windspeed)$/.test(key)) {
      const s = typeof v === 'number' ? v : v?.Speed?.Metric?.Value ?? v?.speed?.metric?.value ?? v?.Speed?.Value ?? v?.speed;
      if (typeof s === 'number') out.wind = s;
    }
    if (out.hasPrecip == null && typeof v === 'boolean' && /^(hasprecipitation|precipitation|isprecipitating)$/.test(key)) out.hasPrecip = v;
    if (out.precipType == null && typeof v === 'string' && /^(precipitationtype|preciptype)$/.test(key)) out.precipType = v;
    if (out.place == null && typeof v === 'string' && /^(localizedname|englishname|city|cityname|locationname)$/.test(key) && v.length < 60) out.place = v;
    if (out.lat == null && typeof v === 'number' && /^(latitude|lat)$/.test(key) && Math.abs(v) <= 90) out.lat = v;
    if (out.lon == null && typeof v === 'number' && /^(longitude|lon|lng)$/.test(key) && Math.abs(v) <= 180) out.lon = v;
  };
  if (payload && typeof payload === 'object') walkJson(payload, visit);

  const allText = [typeof payload === 'string' ? payload : '', ...texts].join('\n');
  if (out.tempC == null) {
    const m = allText.match(/(-?\d+(?:\.\d+)?)\s*°\s*([CF])\b/i);
    if (m) out.tempC = m[2].toUpperCase() === 'F' ? (parseFloat(m[1]) - 32) / 1.8 : parseFloat(m[1]);
  }
  let cond = out.icon ? ACCU_ICONS[out.icon] : null;
  if (!cond) cond = condFromText(out.text);
  if (!cond) cond = condFromText(allText.slice(0, 600));
  if (out.icon && out.isDay == null) out.isDay = out.icon < 33;
  if (!cond) return null;
  if (out.hasPrecip && out.precipType && ['clear', 'mostly_clear', 'partly', 'cloudy', 'overcast'].includes(cond)) {
    cond = /snow/i.test(out.precipType) ? 'snow' : /ice|sleet|mixed/i.test(out.precipType) ? 'sleet' : 'rain';
  }
  return {
    cond,
    label: out.text || CONDITIONS[cond].label,
    tempC: out.tempC,
    humidity: out.humidity,
    cloud: out.cloud ?? CONDITIONS[cond].cloud,
    precip: CONDITIONS[cond].precip,
    wind: out.wind,
    isDay: out.isDay,
    place: out.place,
    lat: out.lat,
    lon: out.lon,
  };
}

/* Location search result -> {key, name, lat, lon}. */
function parseLocation(result) {
  const payload = result && 'payload' in result ? result.payload : result;
  let best = null;
  const consider = (o) => {
    if (!o || typeof o !== 'object' || Array.isArray(o)) return;
    const key = o.Key ?? o.key ?? o.locationKey ?? o.LocationKey ?? o.location_key ?? o.id;
    const name = o.LocalizedName ?? o.localizedName ?? o.EnglishName ?? o.name ?? o.city;
    if (key == null || name == null) return;
    const geo = o.GeoPosition || o.geoPosition || o.geo || o;
    best = best || {
      key: String(key), name: String(name),
      region: o.AdministrativeArea?.ID || o.AdministrativeArea?.LocalizedName || o.region || '',
      lat: typeof geo.Latitude === 'number' ? geo.Latitude : geo.latitude ?? geo.lat ?? null,
      lon: typeof geo.Longitude === 'number' ? geo.Longitude : geo.longitude ?? geo.lon ?? null,
    };
  };
  if (Array.isArray(payload)) payload.forEach(consider);
  consider(payload);
  if (!best && payload && typeof payload === 'object') walkJson(payload, (k, v) => { if (!best) { if (Array.isArray(v)) v.forEach(consider); else consider(v); } });
  if (!best) {
    const text = (result?.content || []).map((b) => b.text || '').join('\n');
    const m = text.match(/(?:location\s*key|key)\W+(\d{3,})/i);
    if (m) best = { key: m[1], name: '', region: '', lat: null, lon: null };
  }
  return best;
}

/* Fill a tool's input from its JSON schema using what we know about the place. */
function buildToolInput(schema, ctx) {
  const props = schema && typeof schema === 'object' ? schema.properties || {} : {};
  const required = new Set(schema?.required || []);
  const input = {};
  for (const [name, spec] of Object.entries(props)) {
    const n = name.toLowerCase();
    const desc = String(spec?.description || '').toLowerCase();
    const type = Array.isArray(spec?.type) ? spec.type.find((t) => t !== 'null') : spec?.type || (spec?.enum ? typeof spec.enum[0] : 'string');
    let v;
    if (type === 'object' && spec?.properties) {
      v = buildToolInput(spec, ctx);
    } else if (/(^|_)lat(itude)?$/.test(n) || n === 'lat') v = ctx.lat;
    else if (/(^|_)(lon|lng|long|longitude)$/.test(n)) v = ctx.lon;
    else if (/location_?key|locationkey|^key$|loc_?id|location_?id|citykey/.test(n) || /location key/.test(desc)) v = ctx.key;
    else if (/query|^q$|city|location|place|search|address|name|text|term|zip|postal/.test(n)) v = ctx.query;
    else if (/unit|metric|system/.test(n)) {
      if (spec?.enum) v = spec.enum.find((e) => /metric|celsius|^c$/i.test(String(e))) ?? spec.enum[0];
      else v = type === 'boolean' ? true : 'metric';
    } else if (/lang|locale/.test(n)) v = 'en-us';
    else if (/detail/.test(n) && type === 'boolean') v = true;
    else if (spec?.default !== undefined) v = spec.default;
    if (v == null || v === '') {
      if (required.has(name)) return null;
      continue;
    }
    if (type === 'number' || type === 'integer') v = Number(v);
    else if (type === 'string') v = String(v);
    else if (type === 'boolean') v = Boolean(v);
    input[name] = v;
  }
  return input;
}

/* Typical temperature for a place and time, for hours with no observation. */
function climateTempC(t, lat) {
  const a = Math.abs(lat);
  const mean = 27 - 0.36 * a;
  const amp = clamp(0.33 * a - 1.5, 1, 20);
  const d = new Date(t);
  const doy = (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / DAY;
  const peak = lat >= 0 ? 200 : 17;
  const hour = d.getHours() + d.getMinutes() / 60;
  return mean + amp * Math.cos(TAU * (doy - peak) / 365) + 4.5 * Math.cos(TAU * (hour - 15) / 24);
}

/* Weather to use for simulation at time t: nearest earlier observation, else climate. */
function weatherAt(log, t, lat) {
  let best = null;
  for (let i = log.length - 1; i >= 0; i--) {
    if (log[i].t <= t + 5 * MIN) { best = log[i]; break; }
  }
  const est = { cond: 'partly', cloud: 55, precip: 0.08, tempC: climateTempC(t, lat), humidity: 60, estimated: true };
  if (!best) return est;
  const age = t - best.t;
  const hold = best.src === 'manual' ? 6 * HOUR : 3 * HOUR;
  if (age > hold + 3 * HOUR) return est;
  const w = {
    cond: best.cond, cloud: best.cloud ?? CONDITIONS[best.cond].cloud, precip: best.precip ?? CONDITIONS[best.cond].precip,
    tempC: best.tempC ?? climateTempC(t, lat), humidity: best.humidity ?? 60,
  };
  if (age <= hold) return w;
  const k = (age - hold) / (3 * HOUR); // fade towards the estimate
  return { ...w, cloud: lerp(w.cloud, est.cloud, k), precip: lerp(w.precip, est.precip, k), tempC: lerp(w.tempC, est.tempC, k) };
}

const WET = new Set(['drizzle', 'rain', 'heavy_rain', 'freezing_rain', 'sleet']);
const SNOWY = new Set(['snow', 'flurries']);
const SUNNY = new Set(['clear', 'mostly_clear', 'partly', 'haze']);

function dayPhotoFor(cond, season, dk) {
  switch (cond) {
    case 'clear':
    case 'mostly_clear': return season === 'summer' && Number(dk.slice(-2)) % 2 ? 'farm' : 'clear';
    case 'partly': return 'partly';
    case 'haze': return 'hazy';
    case 'cloudy': return season === 'autumn' ? 'cloudy_fall' : 'cloudy';
    case 'overcast': return season === 'autumn' ? 'cloudy_fall' : 'cloudy';
    case 'fog': return 'fog';
    case 'storm': return 'storm';
    case 'flurries': return 'snow_sun';
    case 'snow': return 'snow';
    default: return WET.has(cond) ? 'rain' : 'partly';
  }
}

/* Which photo to show and how to grade it for the current sky. */
function chooseScene(cond, phase, season, dk) {
  if (phase === 'night') {
    if (WET.has(cond) || cond === 'storm') return { photo: 'night_rain', grade: 'native-night' };
    if (SNOWY.has(cond)) return { photo: 'snow', grade: 'night' };
    if (cond === 'fog') return { photo: 'fog', grade: 'night' };
    if (cond === 'cloudy' || cond === 'overcast') return { photo: 'cloudy', grade: 'night' };
    return { photo: 'night', grade: 'native-night' };
  }
  if (phase === 'dawn' || phase === 'dusk') {
    if (SUNNY.has(cond)) return { photo: 'dusk', grade: 'native' };
    return { photo: dayPhotoFor(cond, season, dk), grade: 'twilight' };
  }
  if (phase === 'sunrise' || phase === 'sunset') {
    if (SUNNY.has(cond)) return { photo: 'golden', grade: 'native' };
    return { photo: dayPhotoFor(cond, season, dk), grade: 'golden' };
  }
  return { photo: dayPhotoFor(cond, season, dk), grade: 'day' };
}

const GRADES = {
  day: { filter: 'none', overlay: 'transparent', blend: 'normal' },
  native: { filter: 'none', overlay: 'transparent', blend: 'normal' },
  'native-night': { filter: 'brightness(.92)', overlay: 'transparent', blend: 'normal' },
  golden: { filter: 'saturate(1.12) sepia(.22) brightness(.9)', overlay: 'linear-gradient(180deg, rgba(255,150,70,.35), rgba(255,190,120,.12) 60%, rgba(80,40,20,.1))', blend: 'soft-light' },
  twilight: { filter: 'brightness(.5) saturate(.7)', overlay: 'linear-gradient(180deg, rgba(70,70,150,.55), rgba(230,120,120,.25))', blend: 'multiply' },
  night: { filter: 'brightness(.26) saturate(.5) contrast(1.08)', overlay: 'linear-gradient(180deg, rgba(20,30,80,.55), rgba(10,15,40,.6))', blend: 'multiply' },
};

/* ---------- live weather through the AccuWeather connector ---------- */

const Live = {
  mcp: null,
  schemas: {},
  state: 'off', // off | unavailable | ready | loading | live | error
  message: '',
  lastTry: 0,

  async init() {
    try {
      this.mcp = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('mcp') : null;
    } catch { this.mcp = null; }
    this.state = this.mcp ? 'ready' : 'unavailable';
    if (!this.mcp) this.message = 'Live weather needs the page open inside Claude.';
    return !!this.mcp;
  },

  errorText(e, place) {
    switch (e?.code) {
      case 'server_not_connected':
      case 'server_not_found':
        return 'Add the AccuWeather connector in claude.ai → Settings → Connectors (free, no account), then reload.';
      case 'needs_reauth': return 'Reconnect AccuWeather in claude.ai → Settings → Connectors.';
      case 'selection_required': return 'Pick which AccuWeather connector to use when Claude asks, then try again.';
      case 'not_in_manifest':
      case 'consent_required': return 'Live weather is switched off for this page. You can set the sky by hand.';
      case 'blocked_by_policy':
      case 'approval_required': return 'Your organisation blocks the AccuWeather connector here.';
      case 'tool_error': return `AccuWeather couldn’t find “${place}”. Try a nearby city name.`;
      case 'not_granted':
      case 'capability_disabled':
      case 'capability_removed': return 'Live weather isn’t available in this view.';
      case 'parse': return 'AccuWeather answered, but the reply wasn’t readable. Set the sky by hand for now.';
      default: return 'AccuWeather didn’t answer. The game will try again soon.';
    }
  },

  async describe(tool) {
    if (this.schemas[tool] !== undefined) return this.schemas[tool];
    try {
      const d = await this.mcp.describeTool(ACCU_SERVER, tool);
      this.schemas[tool] = d?.inputSchema || null;
    } catch (e) {
      // Connection problems are worth reporting; anything else just means "no schema".
      if (['server_not_connected', 'server_not_found', 'needs_reauth', 'selection_required', 'blocked_by_policy'].includes(e?.code)) throw e;
      return null;
    }
    return this.schemas[tool];
  },

  /* The connector's schema is only readable once the viewer has allowed it for this page. */
  async ensureConsent() {
    let perms = null;
    try { perms = await window.claude.use('permissions'); } catch { perms = null; }
    if (!perms) return;
    const name = `mcp:${ACCU_SERVER}`;
    let st = await perms.state(name).catch(() => 'unavailable');
    if (st === 'prompt') {
      const res = await perms.request([name]).catch(() => ({}));
      st = res?.[name] || st;
    }
    if (st === 'denied') throw { code: 'not_in_manifest' };
  },

  async call(tool, input) {
    try {
      return await this.mcp.callTool(ACCU_SERVER, tool, input, { cache: false });
    } catch (e) {
      if (e?.retryable) {
        await sleep(clamp(e.retryAfterMs || 2500, 1000, 15000) + Math.random() * 800);
        return this.mcp.callTool(ACCU_SERVER, tool, input, { cache: false });
      }
      throw e;
    }
  },

  /* place: {query, lat, lon, key}. Resolves {weather, place} or throws {code}. */
  async fetchCurrent(place) {
    if (!this.mcp) throw { code: 'not_granted' };
    this.lastTry = Date.now();
    await this.ensureConsent();
    const ctx = { query: place.query, lat: place.lat, lon: place.lon, key: place.key };
    // The first call asks the viewer for consent; schemas become readable after that.
    let schema = await this.describe(ACCU_TOOLS.current);
    let input = schema ? buildToolInput(schema, ctx) : null;
    let found = null;
    const needsKey = schema && Object.keys(schema.properties || {}).some((k) => /key|loc_?id|location_?id/i.test(k) || /location key/i.test(schema.properties[k]?.description || ''));
    if ((!input || needsKey) && !ctx.key) {
      const sSchema = await this.describe(ACCU_TOOLS.search);
      const sInput = (sSchema && buildToolInput(sSchema, ctx)) || { query: ctx.query };
      const res = await this.call(ACCU_TOOLS.search, sInput);
      found = parseLocation(res);
      if (found) ctx.key = found.key;
      if (!schema) { this.schemas[ACCU_TOOLS.current] = undefined; schema = await this.describe(ACCU_TOOLS.current); }
      input = schema ? buildToolInput(schema, ctx) : null;
    }
    if (!input) input = ctx.key ? { locationKey: ctx.key, query: ctx.query } : { query: ctx.query };
    const res = await this.call(ACCU_TOOLS.current, input);
    const w = parseCurrentConditions(res);
    if (!w) {
      console.info('[weather] unreadable AccuWeather reply', res);
      throw { code: 'parse' };
    }
    return {
      weather: w,
      place: {
        key: ctx.key || null,
        name: found?.name || w.place || place.query,
        region: found?.region || '',
        lat: found?.lat ?? w.lat ?? place.lat,
        lon: found?.lon ?? w.lon ?? place.lon,
      },
    };
  },
};

// ---- sim.js ----
/* Game state and the real-time plant simulation (integrated in ≤1 hour steps). */

const SAVE_VERSION = 1;
const SEASON_GROWTH = [0.45, 0.5, 0.8, 1, 1.1, 1.1, 1.05, 1, 0.9, 0.75, 0.55, 0.45];

function usesFahrenheit() {
  try {
    const loc = (navigator.language || 'en-US').toUpperCase();
    return /-(US|LR|MM|BS|BZ|KY|PW)$/.test(loc);
  } catch { return true; }
}

function newGame({ species, name, color, facing, home }) {
  const now = Date.now();
  return {
    v: SAVE_VERSION,
    id: Math.random().toString(36).slice(2, 10),
    createdAt: now,
    updatedAt: now,
    plant: {
      species, name: name || SPECIES[species].nick, color: color || null, plantedAt: now,
      growth: 0, health: 88, moisture: 18, saucer: 0, nutrients: 35,
      rot: 0, dryHours: 0, cold: 0, heat: 0, sunburn: 0, etiol: 0,
      lean: 0, leanDir: Math.random() < 0.5 ? -1 : 1, dust: 0, pests: 0,
      bloom: null, bloomCount: 0, lastBloomAt: 0, pups: 0, pupProgress: 0,
      pot: { size: 0, style: 'terracotta' },
      lastWaterAt: 0, lastFeedAt: 0, lastTurnAt: now, lastRepotAt: 0, turns: 0,
      lightAvg: SPECIES[species].lightNeed, healthyStreak: 0, stage: 0,
    },
    env: { windowOpen: 0, curtain: false, lamp: false, glassDirt: 18, facing: facing || 'S', wall: 'plaster', sillWet: 0 },
    home: home || guessHome(),
    wx: { mode: 'manual', current: null, log: [], liveSince: 0 },
    sim: { t: now },
    day: freshDay(now),
    journal: [],
    ach: {},
    settings: { units: usesFahrenheit() ? 'F' : 'C', sound: false, face: true },
    stats: { waterings: 0, visits: 1, lastVisit: now, feeds: 0 },
    tips: {},
  };
}

function freshDay(t) {
  return { key: dayKey(t), light: 0, hours: {}, tMin: null, tMax: null, acts: {}, growth: 0, notes: [] };
}

function dayNumber(S, t = Date.now()) {
  return calendarDays(S.plant.plantedAt, t) + 1;
}

/* Light reaching the sill, 0..~1. */
function windowLight(sun, w, env) {
  const facingAz = WINDOW_FACING[env.facing]?.az ?? 180;
  const up = Math.max(0, Math.sin(sun.el * DEG));
  const rel = angleDiff(sun.az, facingAz);
  const beam = sun.el > 0 ? Math.max(0, Math.cos(sun.el * DEG) * Math.cos(rel * DEG)) * Math.pow(up, 0.4) : 0;
  const cloud = clamp((w.cloud ?? 50) / 100, 0, 1);
  const precip = clamp(w.precip ?? 0, 0, 1);
  const fog = w.cond === 'fog' ? 0.6 : 1;
  const glass = 1 - clamp(env.glassDirt, 0, 100) / 300;
  const curtain = env.curtain ? 0.5 : 1;
  const direct = beam * Math.pow(1 - cloud, 1.5) * (1 - 0.6 * precip) * fog * glass * curtain;
  const diffuse = 0.12 * Math.pow(up, 0.6) * (1 - 0.45 * cloud * cloud) * (1 - 0.35 * precip) * fog * glass * (env.curtain ? 0.8 : 1);
  return { direct, diffuse, total: direct + diffuse, rel };
}

function sillTemp(sun, w, env, direct) {
  const indoor = sun.el > 0 ? 21 : 19.5;
  const k = 0.12 + 0.5 * env.windowOpen;
  return indoor + ((w.tempC ?? indoor) - indoor) * k + direct * 5 * (env.curtain ? 0.5 : 1);
}

function simulate(S, to, emit = () => {}) {
  let t = S.sim.t;
  if (!(to > t)) return;
  if (to - t > 150 * DAY) t = to - 150 * DAY;
  while (t < to - 1000) {
    const next = Math.min(to, Math.floor(t / HOUR) * HOUR + HOUR);
    const mid = (t + next) / 2;
    if (dayKey(mid) !== S.day.key) closeDay(S, mid, emit);
    stepPlant(S, mid, (next - t) / HOUR, emit);
    t = next;
  }
  S.sim.t = to;
}

function stepPlant(S, t, dt, emit) {
  const P = S.plant, E = S.env, sp = SPECIES[P.species];
  const w = weatherAt(S.wx.log, t, S.home.lat);
  const sun = sunPosition(t, S.home.lat, S.home.lon);
  const L = windowLight(sun, w, E);
  const light = L.total + (E.lamp ? 0.42 : 0);
  const sill = sillTemp(sun, w, E, L.direct);
  const rh = clamp(45 + ((w.humidity ?? 55) - 50) * (0.25 + 0.5 * E.windowOpen), 20, 92);
  const size = sizeFromGrowth(P.growth);

  // Day log
  const D = S.day;
  const good = clamp(light / 0.35, 0, 1.2);
  D.light += good * dt;
  D.hours[w.cond] = (D.hours[w.cond] || 0) + dt;
  if (!w.estimated && w.tempC != null) {
    D.tMin = D.tMin == null ? w.tempC : Math.min(D.tMin, w.tempC);
    D.tMax = D.tMax == null ? w.tempC : Math.max(D.tMax, w.tempC);
  }
  P.lightAvg += (good * 24 - P.lightAvg) * (1 - Math.exp(-dt / 36));

  // Soil moisture
  const potF = [1.55, 1.25, 1, 0.85][P.pot.size];
  const tempF = clamp(1 + 0.06 * (sill - 20), 0.35, 2.3);
  const rhF = clamp(1 + (45 - rh) * 0.012, 0.6, 1.5);
  let dry = 0.3 * potF * tempF * (1 + 1.4 * light) * rhF * (0.75 + 0.5 * size) * (1 + 0.3 * E.windowOpen) * dt;
  if (P.saucer > 0) {
    P.saucer = Math.max(0, P.saucer - (0.9 + 0.3 * tempF) * dt);
    dry *= 0.25;
  }
  P.moisture = clamp(P.moisture - dry, 0, 100);
  if (E.windowOpen > 0.1 && (WET.has(w.cond) || w.cond === 'storm')) {
    P.moisture = clamp(P.moisture + 1.4 * (w.precip || 0.5) * E.windowOpen * dt, 0, 100);
    E.sillWet = Math.min(1, E.sillWet + 0.2 * dt);
    if (!D.notes.includes('Rain blew in through the open window.')) D.notes.push('Rain blew in through the open window.');
  } else E.sillWet = Math.max(0, E.sillWet - 0.08 * dt);

  // Rot from soggy soil
  const wet = P.moisture > 72 ? (P.moisture - 72) / 28 : 0;
  const rotIn = (wet + (P.saucer > 0 ? 0.6 : 0)) * 0.9 * sp.rotSens * (sill < 16 ? 1.8 : 1) * (light < 0.1 ? 1.25 : 1);
  P.rot = clamp(P.rot + (rotIn - (P.moisture < 40 ? 0.5 : 0.08)) * dt, 0, 100);

  // Drought
  if (P.moisture < 4) P.dryHours += dt; else P.dryHours = Math.max(0, P.dryHours - 3 * dt);
  const droughtDays = P.dryHours / 24;

  // Temperature stress
  if (sill < sp.coldMin) P.cold = clamp(P.cold + (sp.coldMin - sill) * 0.8 * dt, 0, 100);
  else P.cold = Math.max(0, P.cold - 1.2 * dt);
  if (sill > 36) P.heat = clamp(P.heat + (sill - 36) * dt, 0, 100);
  else P.heat = Math.max(0, P.heat - 1.5 * dt);

  // Harsh direct sun
  const burn = Math.max(0, L.direct - 0.45) * 6 * sp.sunburn - 0.08;
  P.sunburn = clamp(P.sunburn + burn * dt, 0, 100);

  // Food, dust, pests
  P.nutrients = Math.max(0, P.nutrients - 0.07 * dt);
  P.dust = clamp(P.dust + 0.02 * dt, 0, 100);
  E.glassDirt = clamp(E.glassDirt + 0.035 * dt, 0, 100);
  const pestChance = 0.0008 * (E.windowOpen > 0.2 ? 0.6 : 1) * (P.health < 50 ? 2 : 1) * (P.dust > 50 ? 1.3 : 1);
  if (P.pests === 0 && Math.random() < pestChance * dt) {
    P.pests = 1;
    emit('pests');
  } else if (P.pests > 0) P.pests = Math.min(12, P.pests + 0.012 * P.pests * dt);

  // Leaning towards the light
  P.lean = clamp(P.lean + P.leanDir * 0.0012 * Math.min(1, light * 2) * dt, -1, 1);

  // Health
  let dmg = 0;
  if (P.rot > 45) dmg += (P.rot - 45) * 0.02;
  if (droughtDays > sp.dryDays) dmg += 0.12;
  if (P.cold > 25) dmg += (P.cold - 25) * 0.01;
  if (P.heat > 20) dmg += 0.05;
  if (P.sunburn > 40) dmg += (P.sunburn - 40) * 0.006;
  if (P.pests > 0) dmg += 0.015 * P.pests;
  if (P.nutrients > 85) dmg += 0.05;
  const heal = dmg > 0.01 ? 0 : 0.14;
  P.health = clamp(P.health + (heal - dmg) * dt, 0, 100);

  // Growth
  const potCap = POT_SIZES[P.pot.size].cap;
  const rootbound = size > potCap;
  const Fl = clamp(P.lightAvg / sp.lightNeed, 0.1, 1.15);
  const m = P.moisture;
  const Fw = m < 3 ? 0.12 : m < 10 ? 0.65 : m <= 72 ? 1 : m <= 90 ? 0.8 : 0.55;
  const Ft = sill < 8 ? 0.1 : sill < 16 ? 0.55 : sill <= 32 ? 1 : sill <= 38 ? 0.6 : 0.2;
  const Fh = 0.25 + 0.75 * (P.health / 100);
  const Fs = SEASON_GROWTH[hemiMonth(t, S.home.lat) - 1];
  const Fn = Fs >= 0.75 ? 1 + 0.35 * (P.nutrients / 100) : 1;
  const young = 1.55 - 0.75 * size;
  const g = (6 / 24) * sp.rate * young * Fl * Fw * Ft * Fh * Fs * Fn * (rootbound ? 0.3 : 1) * dt;
  P.growth += g;
  D.growth += g;

  const st = stageIndex(P.growth);
  if (st > P.stage) {
    P.stage = st;
    D.notes.push(`Reached the ${STAGES[st].name} stage.`);
    emit('stage', st);
    if (STAGES[st].id === 'mature') unlock(S, 'mature', emit);
  }
  if (rootbound && !P.rootboundWarned) {
    P.rootboundWarned = true;
    emit('rootbound');
  }
  if (sp.pups && st >= 4 && P.pups < sp.pups) {
    P.pupProgress += g * 0.06;
    if (P.pupProgress >= 1) {
      P.pupProgress = 0;
      P.pups++;
      D.notes.push('A new baby offset appeared.');
      emit('pup');
    }
  }

  // Bloom lifecycle
  if (P.bloom) {
    const age = (t - P.bloom.since) / DAY;
    if (P.bloom.stage === 'bud' && age > 2.5) { P.bloom = { stage: 'open', since: t }; D.notes.push('Flowers opened!'); emit('bloom'); unlock(S, 'firstBloom', emit); P.bloomCount++; }
    else if (P.bloom.stage === 'open' && age > 5) { P.bloom = { stage: 'fading', since: t }; }
    else if (P.bloom.stage === 'fading' && age > 1.2) { P.bloom = null; P.lastBloomAt = t; }
  }
}

function closeDay(S, t, emit) {
  const D = S.day, P = S.plant, sp = SPECIES[P.species];
  const conds = Object.entries(D.hours).sort((a, b) => b[1] - a[1]);
  const t0 = new Date(`${D.key}T12:00:00`).getTime();
  S.journal.push({
    k: D.key,
    n: calendarDays(P.plantedAt, t0) + 1,
    cond: conds[0]?.[0] || null,
    hi: D.tMax == null ? null : Math.round(D.tMax * 10) / 10,
    lo: D.tMin == null ? null : Math.round(D.tMin * 10) / 10,
    light: Math.round(D.light * 10) / 10,
    moist: Math.round(P.moisture),
    g: Math.round(D.growth * 100) / 100,
    size: Math.round(sizeFromGrowth(P.growth) * 1000) / 1000,
    h: Math.round(P.health),
    acts: D.acts,
    notes: D.notes.slice(0, 6),
  });
  if (S.journal.length > 400) S.journal.splice(0, S.journal.length - 400);

  // Stretching from low light
  if (D.light < sp.lightNeed * 0.5) P.etiol = clamp(P.etiol + 6, 0, 100);
  else P.etiol = Math.max(0, P.etiol - 3);

  // Streaks
  P.healthyStreak = P.health > 85 ? P.healthyStreak + 1 : 0;
  if (P.healthyStreak >= 7) unlock(S, 'greenThumb', emit);

  // Budding
  const st = stageIndex(P.growth);
  const month = hemiMonth(t, S.home.lat);
  const canBloom = st >= (P.species === 'christmas' || P.species === 'oldlady' ? 4 : 5);
  const inSeason = sp.bloomMonths.includes(month);
  const cooled = !P.lastBloomAt || t - P.lastBloomAt > 25 * DAY;
  if (!P.bloom && canBloom && cooled && P.health > 65 && P.rot < 40 && P.dryHours / 24 < sp.dryDays) {
    const chance = inSeason ? 0.35 : P.healthyStreak >= 10 ? 0.05 : 0;
    if (Math.random() < chance) {
      P.bloom = { stage: 'bud', since: t };
      D.notes.push('Flower buds appeared!');
      emit('bud');
    }
  }

  S.day = freshDay(t);
  const n = dayNumber(S, t);
  if (n >= 7) unlock(S, 'week', emit);
  if (n >= 30) unlock(S, 'month', emit);
  if (n >= 100) unlock(S, 'hundred', emit);
  emit('day', n);
}

function unlock(S, id, emit) {
  if (S.ach[id]) return false;
  S.ach[id] = Date.now();
  emit && emit('ach', id);
  return true;
}

/* ---------- player actions (return a message for the UI) ---------- */
const Actions = {
  water(S, amount = 70) {
    const P = S.plant, sp = SPECIES[P.species];
    const before = P.moisture;
    const total = before + amount;
    P.moisture = Math.min(100, total);
    if (total > 100) P.saucer = Math.min(30, P.saucer + (total - 100) * 0.5);
    P.lastWaterAt = Date.now();
    S.stats.waterings++;
    S.day.acts.water = (S.day.acts.water || 0) + 1;
    const damp = P.species === 'christmas' ? 70 : 45;
    if (before > damp) {
      P.rot = clamp(P.rot + 6 * sp.rotSens, 0, 100);
      return { tone: 'warn', text: 'The soil was still damp. Too much water can rot the roots.' };
    }
    if (P.lastRepotAt && Date.now() - P.lastRepotAt < 5 * DAY) {
      P.rot = clamp(P.rot + 4, 0, 100);
      return { tone: 'warn', text: 'Fresh roots are tender. After repotting, wait about a week before watering.' };
    }
    return { tone: 'good', text: before < 10 ? 'A good deep soak. Now let it dry out.' : 'Watered.' };
  },
  feed(S) {
    const P = S.plant;
    const Fs = SEASON_GROWTH[hemiMonth(Date.now(), S.home.lat) - 1];
    const since = P.lastFeedAt ? (Date.now() - P.lastFeedAt) / DAY : 99;
    P.nutrients = clamp(P.nutrients + (Fs >= 0.75 ? 30 : 15), 0, 100);
    P.lastFeedAt = Date.now();
    S.stats.feeds = (S.stats.feeds || 0) + 1;
    S.day.acts.feed = (S.day.acts.feed || 0) + 1;
    if (since < 14) return { tone: 'warn', text: 'Fed again so soon? Too much food can burn the roots.' };
    if (Fs < 0.75) return { tone: 'info', text: 'Cacti rest in the cold months. Food helps most in spring and summer.' };
    return { tone: 'good', text: 'A little cactus food. Growth will get a boost.' };
  },
  turn(S) {
    const P = S.plant;
    P.lean *= 0.3;
    P.turns++;
    P.lastTurnAt = Date.now();
    S.day.acts.turn = (S.day.acts.turn || 0) + 1;
    return { tone: 'good', text: 'Quarter turn. It will grow straight and even.' };
  },
  swab(S) {
    const P = S.plant;
    S.day.acts.swab = (S.day.acts.swab || 0) + 1;
    if (P.pests > 0) {
      P.pests = 0;
      return { tone: 'good', text: 'Mealybugs gone. Keep an eye out for fluffy white spots.' };
    }
    return { tone: 'info', text: 'No mealybugs found. Nice and clean.' };
  },
  mist(S) {
    const P = S.plant, sp = SPECIES[P.species];
    S.day.acts.mist = (S.day.acts.mist || 0) + 1;
    if (sp.likesMist) {
      P.moisture = clamp(P.moisture + 2, 0, 100);
      P.health = clamp(P.health + 1, 0, 100);
      return { tone: 'good', text: 'Rainforest cacti love a little humidity.' };
    }
    P.rot = clamp(P.rot + 2, 0, 100);
    return { tone: 'info', text: 'Desert cacti don’t need misting. Water at the roots instead.' };
  },
  clean(S) {
    const was = S.env.glassDirt;
    S.env.glassDirt = 0;
    S.plant.dust = 0;
    S.day.acts.clean = (S.day.acts.clean || 0) + 1;
    return { tone: 'good', text: was > 30 ? 'Sparkling. More light gets through now.' : 'The glass was already pretty clean.' };
  },
  repot(S, size, style) {
    const P = S.plant;
    const bigger = size > P.pot.size;
    P.pot = { size, style };
    S.day.acts.repot = 1;
    if (bigger) {
      P.lastRepotAt = Date.now();
      P.rootboundWarned = false;
      P.moisture = Math.min(P.moisture, 15);
      P.health = clamp(P.health - 3, 0, 100);
      return { tone: 'good', text: 'Repotted in fresh gritty mix. Wait about a week before watering.' };
    }
    return { tone: 'good', text: `Moved to the ${POT_STYLES[style].name} pot.` };
  },
};

function meterReading(moisture) {
  const v = clamp(Math.round(1 + moisture / 11), 1, 10);
  const zone = v <= 3 ? 'DRY' : v <= 7 ? 'MOIST' : 'WET';
  return { v, zone };
}

/* What the cactus would say, most important first. */
function needs(S, now = Date.now(), wx = null) {
  const P = S.plant, E = S.env, sp = SPECIES[P.species];
  const out = [];
  const thirstyAt = P.species === 'christmas' ? 30 : 6;
  const size = sizeFromGrowth(P.growth);
  if (E.windowOpen > 0.1 && wx && (WET.has(wx.cond) || wx.cond === 'storm' || SNOWY.has(wx.cond))) out.push({ id: 'close', tool: 'window', text: 'It’s coming in the window! Close it.' });
  if (E.windowOpen > 0.1 && wx && wx.tempC != null && wx.tempC < sp.coldMin + 6) out.push({ id: 'cold', tool: 'window', text: 'Brr. It’s cold out there. Close the window.' });
  if (P.pests > 0) out.push({ id: 'pests', tool: 'swab', text: 'Mealybugs! Dab them off with the swab.' });
  if (P.rot > 45) out.push({ id: 'rot', tool: null, text: 'My roots are soggy. Let the soil dry out completely.' });
  if (P.moisture < thirstyAt) out.push({ id: 'water', tool: 'water', text: P.dryHours > 24 * sp.dryDays * 0.5 ? 'So thirsty… time for a deep drink.' : 'Soil’s dry. I could use a drink.' });
  if (size > POT_SIZES[P.pot.size].cap) out.push({ id: 'repot', tool: 'repot', text: 'My roots are crowded. Could I get a bigger pot?' });
  if (P.sunburn > 30) out.push({ id: 'burn', tool: 'curtain', text: 'This sun is harsh. Draw the sheer curtain for a bit.' });
  if (Math.abs(P.lean) > 0.35) out.push({ id: 'turn', tool: 'turn', text: 'I’m leaning toward the light. Give me a quarter turn.' });
  if (P.lightAvg < sp.lightNeed * 0.55) out.push({ id: 'light', tool: 'lamp', text: 'It’s been dim lately. The grow light would help.' });
  if (E.glassDirt > 55) out.push({ id: 'glass', tool: 'cloth', text: 'The glass is getting dusty. A wipe lets more sun in.' });
  const Fs = SEASON_GROWTH[hemiMonth(now, S.home.lat) - 1];
  if (Fs >= 0.9 && P.nutrients < 12 && (!P.lastFeedAt || now - P.lastFeedAt > 25 * DAY)) out.push({ id: 'feed', tool: 'food', text: 'Growing season! A little food would be nice.' });
  return out;
}

function moodOf(S, now, phase) {
  const P = S.plant, sp = SPECIES[P.species];
  if (P.health < 30) return 'sick';
  if (P.rot > 50) return 'soggy';
  if (P.pests > 0) return 'itchy';
  if (P.cold > 20) return 'cold';
  if (P.heat > 15 || P.sunburn > 45) return 'hot';
  if (P.moisture < 4 && P.dryHours > 24 * Math.min(4, sp.dryDays * 0.3)) return 'thirsty';
  if (phase === 'night') return 'sleepy';
  if (P.bloom?.stage === 'open') return 'proud';
  if (P.health > 80) return 'happy';
  return 'content';
}

// ---- store.js ----
/* Saving: this browser (always) plus the viewer's Claude account (when the page can). */

const Store = {
  KEY: 'windowsill-cactus-v1',
  db: null,
  ref: null,
  cloudOn: false,
  chain: Promise.resolve(),
  dirtyCloud: false,

  loadLocal() {
    const S = local.get(this.KEY);
