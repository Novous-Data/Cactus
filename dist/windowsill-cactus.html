    out += `<ellipse cx="${(-R * 0.38).toFixed(1)}" cy="${(cy - Ry * 0.45).toFixed(1)}" rx="${(R * 0.2).toFixed(1)}" ry="${(Ry * 0.12).toFixed(1)}" fill="#fff" opacity="0.4" transform="rotate(-30 ${(-R * 0.38).toFixed(1)} ${(cy - Ry * 0.45).toFixed(1)})"/>`;
    out += this.conditionOverlays(v, D, clip, 0, cy, R, Ry);
    if (v.bloom) {
      for (let i = 0; i < 3; i++) {
        const fx = (i - 1) * R * 0.35, fy = cy - Ry * 0.95 - (i === 1 ? 6 : 0);
        out += v.bloom === 'bud' ? this.bud(fx, fy, 9 + v.size * 5, '#FFB3C8') : this.flower(fx, fy - 5, 9 + v.size * 7, v.bloom === 'fading' ? '#E5B6C2' : SPECIES.moon.bloom, i * 30);
      }
    }
    out += this.face({ ...v, faceLid: col }, 0, cy + Ry * 0.12, clamp(R / 50, 0.62, 1.5));
    return out;
  },

  /* Saguaro: ribbed column with arms later in life */
  saguaro(v, D, pal) {
    const H = (38 + 250 * Math.max(0, v.size - 0.2) / 0.8) * (1 + 0.12 * v.etiol);
    const W = (24 + 30 * v.size) * (1 - 0.14 * v.shrivel) * (1 + 0.04 * v.rot);
    const grad = D.lin([[0, pal.dark], [0.3, pal.light], [0.62, pal.base], [1, pal.dark]], 0, 0, 1, 0);
    const r = mulberry32(v.seed);
    let arms = '';
    const armCount = v.stage >= 5 ? 2 : v.stage >= 4 ? 1 : 0;
    const armW = W * 0.72;
    const armDefs = [{ side: 1, at: 0.48, out: 0.95, up: 0.3 }, { side: -1, at: 0.6, out: 0.8, up: 0.22 }];
    for (let i = 0; i < armCount; i++) {
      const a = armDefs[i];
      const y0 = -H * a.at, x0 = a.side * W * 0.3;
      const x1 = a.side * (W * 0.5 + armW * a.out), y1 = y0 - H * 0.02;
      const y2 = y0 - H * a.up;
      const d = `M ${x0} ${y0} L ${x1 - a.side * armW * 0.5} ${y1} Q ${x1} ${y1} ${x1} ${y1 - armW * 0.5} L ${x1} ${y2}`;
      arms += `<path d="${d}" stroke="${pal.line}" stroke-width="${armW + 6}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      arms += `<path d="${d}" stroke="url(#${grad})" stroke-width="${armW}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      arms += `<path d="M ${x1 - armW * 0.18} ${y1 - armW * 0.5} L ${x1 - armW * 0.18} ${y2}" stroke="${pal.dark}" stroke-width="1.6" opacity="0.6"/><path d="M ${x1 + armW * 0.18} ${y1 - armW * 0.5} L ${x1 + armW * 0.18} ${y2}" stroke="${pal.dark}" stroke-width="1.6" opacity="0.6"/>`;
      if (v.bloom === 'open' || v.bloom === 'fading') arms += this.flower(x1, y2 - armW * 0.45, 7 + v.size * 4, v.bloom === 'fading' ? '#E8E2D0' : '#FFFFFF', 10);
      arms += `<g data-arm-tip="${x1.toFixed(0)},${y2.toFixed(0)}"></g>`;
    }
    const top = -H;
    const body = `M ${-W / 2} 0 L ${-W / 2} ${top + W / 2} Q ${-W / 2} ${top} 0 ${top} Q ${W / 2} ${top} ${W / 2} ${top + W / 2} L ${W / 2} 0 Z`;
    let out = arms + `<path d="${body}" fill="url(#${grad})" stroke="${pal.line}" stroke-width="3" stroke-linejoin="round"/>`;
    const clip = D.clip(`<path d="${body}"/>`);
    let ribs = '', sp = '';
    const nR = 5;
    for (let i = 0; i < nR; i++) {
      const u = ((i + 0.5) / nR) * 2 - 1;
      const x = Math.sin(u * Math.PI / 2) * W * 0.5;
      ribs += `<path d="M ${x.toFixed(1)} -2 L ${(x * 0.9).toFixed(1)} ${(top + W * 0.3).toFixed(1)}" stroke="${pal.dark}" stroke-width="${(1.8 + v.shrivel).toFixed(1)}" opacity="${(0.65 - Math.abs(u) * 0.3).toFixed(2)}"/>`;
      if (Math.abs(u) < 0.8 && v.size > 0.24) {
        const n = Math.round(3 + v.size * 8);
        for (let k = 0; k < n; k++) {
          const yy = -H * 0.08 - (k / n) * H * 0.82;
          sp += this.spineCluster(x * 1.02, yy, 3 + v.size * 3, r() * TAU, '#EFE3B8', 4);
        }
      }
    }
    out += `<g clip-path="url(#${clip})">${ribs}</g>${sp}`;
    out += `<path d="M ${(-W * 0.28).toFixed(1)} ${(top + W * 0.55).toFixed(1)} L ${(-W * 0.28).toFixed(1)} ${(-H * 0.2).toFixed(1)}" stroke="#fff" stroke-width="${(W * 0.12).toFixed(1)}" opacity="0.22" stroke-linecap="round"/>`;
    out += this.conditionOverlays(v, D, clip, 0, -H / 2, W / 2, H / 2);
    if (v.bloom) {
      for (let i = 0; i < 3; i++) {
        const fx = (i - 1) * W * 0.28, fy = top + 4 - (i === 1 ? 5 : 0);
        out += v.bloom === 'bud' ? this.bud(fx, fy, 8 + v.size * 5, '#F6F1DF') : this.flower(fx, fy - 4, 9 + v.size * 6, v.bloom === 'fading' ? '#E8E2D0' : '#FFFFFF', i * 15);
      }
    }
    const faceY = Math.max(top + W * 0.62, -H * 0.62);
    out += this.face({ ...v, faceLid: pal.base }, 0, faceY, clamp(W / 34, 0.62, 1.4));
    return out;
  },

  /* Bunny ears: branching flat pads dotted with glochids */
  bunny(v, D, pal) {
    const r = mulberry32(v.seed);
    const pads = [];
    const k = v.size;
    const main = { x: 0, y: 0, rx: 18 + 30 * k, ry: 24 + 42 * k, rot: 0, born: 0, depth: 0 };
    pads.push(main);
    const births = [10, 18, 34, 48, 70, 90, 118, 150, 185, 230];
    const queue = [main];
    let bi = 0;
    while (queue.length && bi < births.length) {
      const parent = queue.shift();
      for (const side of [-1, 1]) {
        if (bi >= births.length) break;
        const born = births[bi++];
        const grow = clamp((v.growth - born) / 22, 0, 1);
        if (grow <= 0) continue;
        const scale = (0.72 - parent.depth * 0.06) * (0.35 + 0.65 * grow);
        const ang = parent.rot + side * (28 + r() * 16);
        const pr = parent.rot * DEG;
        const tipX = parent.x + Math.sin(pr) * parent.ry * 1.75 + side * parent.rx * 0.45 * Math.cos(pr);
        const tipY = parent.y - Math.cos(pr) * parent.ry * 1.75 + side * parent.rx * 0.45 * Math.sin(pr) * 0.3;
        const child = { x: tipX, y: tipY, rx: main.rx * scale, ry: main.ry * scale, rot: ang, born, depth: parent.depth + 1 };
        pads.push(child);
        queue.push(child);
      }
    }
    const grad = this.bodyGrad(D, pal);
    let out = '';
    // Draw children first so the main pad (with the face) sits in front
    const order = pads.slice(1).reverse().concat([main]);
    for (const p of order) {
      const cx = p.x + Math.sin(p.rot * DEG) * p.ry, cy = p.y - Math.cos(p.rot * DEG) * p.ry;
      const rx = p.rx * (1 - 0.14 * v.shrivel), ry = p.ry * (1 + 0.1 * v.etiol);
      out += `<g transform="rotate(${p.rot.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})">`;
      out += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="url(#${grad})" stroke="${pal.line}" stroke-width="3"/>`;
      let dots = '';
      const step = 10 + 2 * k;
      for (let yy = -ry + step * 0.7; yy < ry - step * 0.4; yy += step * 0.86) {
        const row = Math.round((yy + ry) / (step * 0.86));
        for (let xx = -rx + step * 0.6 + (row % 2) * step * 0.5; xx < rx - step * 0.4; xx += step) {
          if ((xx * xx) / (rx * rx) + (yy * yy) / (ry * ry) > 0.8) continue;
          dots += `<circle cx="${(cx + xx).toFixed(1)}" cy="${(cy + yy).toFixed(1)}" r="${(1.6 + k * 0.9).toFixed(1)}"/>`;
        }
      }
      out += `<g fill="#F6E7B2" stroke="#D9BE6A" stroke-width="0.7">${dots}</g>`;
      out += `<ellipse cx="${(cx - rx * 0.35).toFixed(1)}" cy="${(cy - ry * 0.4).toFixed(1)}" rx="${(rx * 0.2).toFixed(1)}" ry="${(ry * 0.14).toFixed(1)}" fill="#fff" opacity="0.28"/>`;
      if (v.bloom && p.depth >= 1 && p.born >= births[Math.min(3, births.length - 1)] - 40) {
        const fy = cy - ry * 0.95;
        out += v.bloom === 'bud' ? this.bud(cx + rx * 0.3, fy, 8 + k * 5, '#F7E27A') : this.flower(cx + rx * 0.3, fy - 4, 8 + k * 7, v.bloom === 'fading' ? '#E5D79A' : SPECIES.bunny.bloom, 0);
      }
      out += `</g>`;
    }
    const mcx = 0, mcy = -main.ry, mrx = main.rx, mry = main.ry;
    const clip = D.clip(`<ellipse cx="${mcx}" cy="${mcy}" rx="${mrx}" ry="${mry}"/>`);
    out += this.conditionOverlays(v, D, clip, mcx, mcy, mrx, mry);
    out += this.face({ ...v, faceLid: pal.base }, 0, mcy + mry * 0.1, clamp(mrx / 30, 0.62, 1.5));
    return out;
  },

  /* Christmas cactus: arching chains of toothed segments */
  christmas(v, D, pal) {
    const r = mulberry32(v.seed);
    const k = v.size;
    const segL = 18 + 14 * k, segW = 12 + 9 * k;
    const total = Math.round(3 + v.growth / 5.5);
    const grad = D.lin([[0, pal.light], [0.5, pal.base], [1, pal.dark]], 0, 0, 1, 1);
    const segs = [];
    const stems = [{ x: 0, y: 0, a: -90, d: 0 }, { x: -segW * 0.4, y: 0, a: -128, d: 0 }, { x: segW * 0.4, y: 0, a: -52, d: 0 }];
    const frontier = stems.slice();
    let made = 0;
    while (made < total && frontier.length) {
      frontier.sort((a, b) => a.d - b.d);
      const f = frontier.shift();
      const droop = (f.a > -90 ? 1 : -1) * (10 + f.d * 6) * (f.d > 0 ? 1 : 0);
      const ang = f.a + droop * 0.6 + (r() - 0.5) * 10;
      const L = segL * (f.d === 0 ? 1.1 : 1);
      const ex = f.x + Math.cos(ang * DEG) * L, ey = f.y + Math.sin(ang * DEG) * L;
      segs.push({ x: f.x, y: f.y, ex, ey, ang, d: f.d });
      made++;
      frontier.push({ x: ex, y: ey, a: ang + (ang > -90 ? 6 : -6), d: f.d + 1 });
      if (f.d >= 1 && r() < 0.35 && made < total) frontier.push({ x: ex, y: ey, a: ang + (r() < 0.5 ? 28 : -28), d: f.d + 1 });
    }
    let out = '';
    const drawSeg = (s, wScale = 1) => {
      const w = segW * wScale * (1 - 0.18 * v.shrivel);
      const len = Math.hypot(s.ex - s.x, s.ey - s.y);
      const tx = `translate(${s.x.toFixed(1)} ${s.y.toFixed(1)}) rotate(${(s.ang + 90).toFixed(1)})`;
      const hw = w / 2;
      const d = `M 0 0 C ${-hw} ${-len * 0.1} ${-hw * 1.05} ${-len * 0.45} ${-hw * 0.8} ${-len * 0.55} L ${-hw * 1.15} ${-len * 0.62} L ${-hw * 0.78} ${-len * 0.78} L ${-hw * 1.1} ${-len * 0.95} L ${-hw * 0.3} ${-len} L ${hw * 0.3} ${-len} L ${hw * 1.1} ${-len * 0.95} L ${hw * 0.78} ${-len * 0.78} L ${hw * 1.15} ${-len * 0.62} L ${hw * 0.8} ${-len * 0.55} C ${hw * 1.05} ${-len * 0.45} ${hw} ${-len * 0.1} 0 0 Z`;
      return `<g transform="${tx}"><path d="${d}" fill="url(#${grad})" stroke="${pal.line}" stroke-width="2.6" stroke-linejoin="round"/><path d="M 0 ${-len * 0.1} L 0 ${-len * 0.9}" stroke="${pal.dark}" stroke-width="1.4" opacity="0.5"/></g>`;
    };
    const deep = segs.slice().sort((a, b) => b.d - a.d);
    for (const s of deep) if (s !== segs[0]) out += drawSeg(s);
    // Flowers hang from the chain tips
    if (v.bloom) {
      const tips = segs.filter((s) => !segs.some((o) => Math.abs(o.x - s.ex) < 0.1 && Math.abs(o.y - s.ey) < 0.1)).slice(0, 7);
      for (const t of tips) {
        const col = v.bloom === 'fading' ? '#C98AA5' : SPECIES.christmas.bloom;
        if (v.bloom === 'bud') out += this.bud(t.ex, t.ey, 8 + k * 4, '#F07AA8');
        else out += `<g transform="translate(${t.ex.toFixed(1)} ${t.ey.toFixed(1)}) rotate(${(t.ang + 90).toFixed(0)})"><path d="M 0 0 C -5 -10 -4 -18 -12 -24 M 0 0 C 5 -10 4 -18 12 -24" stroke="${col}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M -3 0 Q 0 -22 3 0 Z" fill="${col}"/><path d="M 0 -6 L 0 -28" stroke="#FCE0EC" stroke-width="1.2"/><circle cx="0" cy="-28" r="1.8" fill="#FFE27A"/></g>`;
      }
    }
    // Central segment with the face, drawn larger in front
    const s0 = segs[0];
    const faceSeg = { ...s0, ex: s0.x, ey: s0.y - segL * 1.35, ang: -90 };
    out += drawSeg(faceSeg, 1.55);
    const fy = -segL * 0.72;
    const clip = D.clip(`<ellipse cx="0" cy="${fy}" rx="${segW * 0.75}" ry="${segL * 0.62}"/>`);
    out += this.conditionOverlays(v, D, clip, 0, fy, segW * 0.75, segL * 0.62);
    out += this.face({ ...v, faceLid: pal.base }, 0, fy + 2, clamp(segW / 18, 0.62, 1.2));
    return out;
  },
};

/* Collects <defs> with ids unique to one SVG. */
class Defs {
  constructor(prefix) { this.p = prefix; this.n = 0; this.items = []; }
  id() { return `${this.p}-${++this.n}`; }
  add(s) { this.items.push(s); }
  lin(stops, x1 = 0, y1 = 0, x2 = 1, y2 = 1) {
    const id = this.id();
    this.items.push(`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`);
    return id;
  }
  rad(stops, fx = 0.35, fy = 0.3, r = 0.8) {
    const id = this.id();
    this.items.push(`<radialGradient id="${id}" cx="${fx}" cy="${fy}" r="${r}" fx="${fx}" fy="${fy}">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</radialGradient>`);
    return id;
  }
  clip(shape) {
    const id = this.id();
    this.items.push(`<clipPath id="${id}">${shape}</clipPath>`);
    return id;
  }
  out() { return this.items.join(''); }
}

const Tools = {
  ghost: null,
  drag: null,
  busy: false,

  init() {
    const caddy = $('#caddy .tools');
    for (const t of TOOLS) {
      const b = el('button', { class: 'tool', type: 'button', id: `tool-${t.id}`, dataset: { tool: t.id }, 'aria-label': `${t.name} (${t.key})` },
        el('span', { class: 'tool-icon', html: ICONS[t.id] }),
        el('span', { class: 'tool-name', text: t.name }),
        el('kbd', { text: t.key }));
      b.addEventListener('pointerdown', (e) => this.down(e, t.id, b));
      b.addEventListener('click', (e) => { if (e.detail === 0) this.use(t.id); }); // keyboard activation
      b.addEventListener('mouseenter', () => UI.hint(t.tip, 'tool'));
      b.addEventListener('mouseleave', () => UI.hint(null, 'tool'));
      caddy.append(b);
    }
    requestAnimationFrame(() => { const box = $('.caddy-box'); if (box) box.scrollLeft = 0; });
    window.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, select, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
      if (UI.modalOpen()) return;
      const t = TOOLS.find((x) => x.key.toLowerCase() === e.key.toLowerCase());
      if (t) { e.preventDefault(); this.use(t.id); }
    });
  },

  refresh(S) {
    const lampBtn = $('#tool-lamp');
    if (lampBtn) lampBtn.classList.toggle('on', !!S.env.lamp);
    const needed = new Set(needs(S, Date.now(), Game.wx).map((n) => n.tool));
    for (const b of $$('.tool')) b.classList.toggle('nudge', needed.has(b.dataset.tool));
    const size = sizeFromGrowth(S.plant.growth);
    $('#tool-repot')?.classList.toggle('dim', size < POT_SIZES[S.plant.pot.size].cap * 0.8 && S.plant.pot.size < 3);
  },

  down(e, id, btn) {
    if (e.button !== 0 || this.busy) return;
    e.preventDefault();
    const start = { x: e.clientX, y: e.clientY };
    let dragging = false;
    const move = (ev) => {
      if (!dragging && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 8) {
        dragging = true;
        this.startDrag(id, ev);
      }
      if (dragging) this.moveDrag(ev);
    };
    const up = (ev) => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (dragging) this.endDrag(ev, ev.type === 'pointercancel');
      else if (ev.type === 'pointerup') this.use(id);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    void btn;
  },

  makeGhost(id, x, y) {
    const gh = el('div', { class: `tool-ghost tool-ghost-${id}`, html: ICONS[id] });
    document.body.append(gh);
    this.ghost = gh;
    this.placeGhost(x, y);
    return gh;
  },
  placeGhost(x, y, rot = 0) {
    if (!this.ghost) return;
    this.ghost.style.transform = `translate(${x}px, ${y}px) translate(-50%, -60%) rotate(${rot}deg)`;
  },
  dropGhost() {
    const gh = this.ghost;
    this.ghost = null;
    if (!gh) return;
    gh.classList.add('bye');
    setTimeout(() => gh.remove(), 260);
  },

  targetFor(id) {
    if (id === 'cloth') return 'glass';
    return 'plant';
  },
  overTarget(id, x, y) {
    const L = Room.L;
    if (!L) return false;
    if (this.targetFor(id) === 'glass') {
      const I = L.inner;
      return x > I.x && x < I.x + I.w && y > I.y && y < I.y + I.h;
    }
    const r = Scene.plantRect();
    return x > r.x - 20 && x < r.x + r.w + 20 && y > r.y - 30 && y < r.y + r.h + 10;
  },

  startDrag(id, e) {
    this.drag = { id, wiped: 0, last: { x: e.clientX, y: e.clientY } };
    this.makeGhost(id, e.clientX, e.clientY);
    document.body.classList.add('dragging');
    Audio2.play('pick');
  },
  moveDrag(e) {
    const d = this.drag;
    if (!d) return;
    const over = this.overTarget(d.id, e.clientX, e.clientY);
    const tilt = d.id === 'water' && over ? -38 : 0;
    this.placeGhost(e.clientX, e.clientY, tilt);
    Scene.highlight(over ? this.targetFor(d.id) : null);
    if (d.id === 'water' && over) FX.pour(e.clientX - 34, e.clientY - 18, 0.4);
    if (d.id === 'cloth' && over) {
      d.wiped += Math.hypot(e.clientX - d.last.x, e.clientY - d.last.y);
      FX.wipeAt(e.clientX, e.clientY);
      if (d.wiped > 900 && !d.done) { d.done = true; this.apply('cloth', e.clientX, e.clientY); }
    }
    d.last = { x: e.clientX, y: e.clientY };
  },
  endDrag(e, cancelled) {
    const d = this.drag;
    this.drag = null;
    document.body.classList.remove('dragging');
    Scene.highlight(null);
    if (!d) return;
    const over = !cancelled && this.overTarget(d.id, e.clientX, e.clientY);
    if (over && !(d.id === 'cloth' && d.done)) this.animateUse(d.id, e.clientX, e.clientY, true);
    else this.dropGhost();
  },

  /* Tap / keyboard: fly to the target and act. */
  use(id) {
    if (this.busy || !Game.S) return;
    if (id === 'lamp') return this.apply('lamp');
    if (id === 'repot') return UI.openRepot();
    if (id === 'turn') return this.apply('turn');
    const btn = $(`#tool-${id}`);
    const b = btn.getBoundingClientRect();
    const r = Scene.plantRect();
    const target = id === 'cloth'
      ? { x: Room.L.inner.x + Room.L.inner.w * 0.3, y: Room.L.inner.y + Room.L.inner.h * 0.35 }
      : { x: r.x + r.w / 2, y: r.y + Math.min(r.h * 0.35, 80) };
    this.makeGhost(id, b.x + b.width / 2, b.y + b.height / 2);
    this.ghost.classList.add('flying');
    requestAnimationFrame(() => {
      this.placeGhost(target.x, target.y);
      setTimeout(() => { this.ghost?.classList.remove('flying'); this.animateUse(id, target.x, target.y, false); }, 380);
    });
  },

  animateUse(id, x, y, fromDrag) {
    this.busy = true;
    const done = () => { this.busy = false; };
    const P = Scene.potTop();
    const gh = this.ghost;
    const at = (gx, gy, rot = 0, ms = 300) => {
      if (!gh) return;
      gh.style.transition = `transform ${ms}ms cubic-bezier(.3,.7,.3,1)`;
      this.placeGhost(gx, gy, rot);
    };
    switch (id) {
      case 'water': {
        at(P.x - 46, P.y - 60, -40, 280);
        let n = 0;
        const iv = setInterval(() => { FX.pour(P.x - 76, P.y - 70, 1); if (++n > 22) clearInterval(iv); }, 55);
        Audio2.play('pour');
        setTimeout(() => { this.apply('water'); this.dropGhost(); done(); }, 1350);
        break;
      }
      case 'meter': {
        at(P.x + 8, P.y - 18, 0, 260);
        setTimeout(() => { at(P.x + 8, P.y + 6, 0, 360); }, 260);
        setTimeout(() => { this.apply('meter'); this.dropGhost(); done(); }, 900);
        break;
      }
      case 'food': {
        at(P.x - 10, P.y - 64, -120, 300);
        setTimeout(() => FX.drops(P.x - 26, P.y - 46, '#A5D86E', 10), 320);
        setTimeout(() => { this.apply('food'); this.dropGhost(); done(); }, 1000);
        break;
      }
      case 'swab': {
        const r = Scene.plantRect();
        let k = 0;
        const iv = setInterval(() => {
          at(r.x + r.w * (0.3 + 0.4 * (k % 2)), r.y + r.h * (0.3 + 0.08 * k), k % 2 ? 20 : -10, 160);
          if (++k > 6) clearInterval(iv);
        }, 170);
        setTimeout(() => { this.apply('swab'); this.dropGhost(); done(); }, 1300);
        break;
      }
      case 'mist': {
        const r = Scene.plantRect();
        at(r.x + r.w + 40, r.y + r.h * 0.35, 0, 260);
        let k = 0;
        const iv = setInterval(() => { FX.mist(r.x + r.w + 8, r.y + r.h * 0.3); Audio2.play('spritz'); if (++k > 2) clearInterval(iv); }, 330);
        setTimeout(() => { this.apply('mist'); this.dropGhost(); done(); }, 1200);
        break;
      }
      case 'cloth': {
        const I = Room.L.inner;
        const path = [[0.25, 0.3], [0.7, 0.28], [0.3, 0.55], [0.75, 0.5], [0.35, 0.75], [0.7, 0.72]];
        path.forEach(([px, py], i) => setTimeout(() => {
          const gx = I.x + I.w * px, gy = I.y + I.h * py;
          at(gx, gy, i % 2 ? 12 : -12, 200);
          FX.wipeAt(gx, gy);
        }, i * 190));
        setTimeout(() => { this.apply('cloth', x, y); this.dropGhost(); done(); }, path.length * 190 + 120);
        break;
      }
      default:
        this.apply(id, x, y);
        this.dropGhost();
        done();
    }
    void fromDrag;
  },

  apply(id, x, y) {
    try { this.applyInner(id, x, y); } catch (e) { console.error(e); this.dropGhost(); this.busy = false; }
  },

  applyInner(id, x, y) {
    const S = Game.S;
    let res = null;
    switch (id) {
      case 'water':
        res = Actions.water(S, 72);
        if (unlock(S, 'firstDrink', Game.emit)) { /* toast via emit */ }
        FX.sparkle(Scene.potTop().x, Scene.potTop().y, '#7CC4F2', 8);
        break;
      case 'food': res = Actions.feed(S); FX.sparkle(Scene.potTop().x, Scene.potTop().y - 10, '#A5D86E', 10); break;
      case 'turn':
        res = Actions.turn(S);
        Scene.spin();
        Audio2.play('turn');
        if (S.plant.turns >= 10) unlock(S, 'spinner', Game.emit);
        break;
      case 'swab': {
        const had = S.plant.pests > 0;
        res = Actions.swab(S);
        if (had) unlock(S, 'pestFree', Game.emit);
        break;
      }
      case 'mist': res = Actions.mist(S); break;
      case 'cloth':
        res = Actions.clean(S);
        unlock(S, 'sparkling', Game.emit);
        FX.sparkle(x || Room.L.inner.x + Room.L.inner.w / 2, y || Room.L.inner.y + Room.L.inner.h / 3, '#FFFFFF', 16);
        Audio2.play('shine');
        Scene.repaintWindow();
        break;
      case 'lamp':
        S.env.lamp = !S.env.lamp;
        res = { tone: 'info', text: S.env.lamp ? 'Grow light on. Extra light helps on dark days.' : 'Grow light off.' };
        Audio2.play('click');
        break;
      case 'meter': {
        const m = meterReading(S.plant.moisture);
        UI.showMeter(m);
        const thirsty = S.plant.species === 'christmas' ? m.v <= 4 : m.v <= 1;
        res = { tone: 'info', text: m.zone === 'DRY' ? (thirsty ? `Reads ${m.v}: dry all the way down. Water now.` : `Reads ${m.v}: nearly dry. Water when it hits 1.`) : m.zone === 'MOIST' ? `Reads ${m.v}: still moist. Hold off on water.` : `Reads ${m.v}: wet. No water for a while.` };
        break;
      }
      default: break;
    }
    Game.afterAction(res);
  },
};

function weatherIcon(cond, isNight) {
  const sunOrMoon = isNight
    ? '<path d="M15 4 A8 8 0 1 0 20 15 A6.5 6.5 0 1 1 15 4Z" fill="#F6E7A8" stroke="#7A6A2C" stroke-width="1.4"/>'
    : '<circle cx="12" cy="11" r="5.2" fill="#F4B63A" stroke="#7A5A0C" stroke-width="1.4"/>';
  const cloud = (x = 0, y = 0, fill = '#FFFFFF') => `<path transform="translate(${x} ${y})" d="M7 20 H18 A4 4 0 0 0 18 12 A5.5 5.5 0 0 0 7.5 11 A4.5 4.5 0 0 0 7 20Z" fill="${fill}" stroke="#4A5A66" stroke-width="1.4"/>`;
  const rainL = '<g stroke="#3C8FD6" stroke-width="1.8" stroke-linecap="round"><path d="M9 21 l-1 2.5M13 21 l-1 2.5M17 21 l-1 2.5"/></g>';
  const snowL = '<g fill="#8FB8D8"><circle cx="9" cy="22.5" r="1.3"/><circle cx="13" cy="23" r="1.3"/><circle cx="17" cy="22.5" r="1.3"/></g>';
  let body;
  switch (cond) {
    case 'clear': body = sunOrMoon; break;
    case 'mostly_clear': case 'partly': case 'haze': body = `<g transform="translate(-3 -3)">${sunOrMoon}</g>${cloud(2, 0)}`; break;
    case 'cloudy': case 'overcast': body = `${cloud(-3, -4, '#E3E8EC')}${cloud(1, 0)}`; break;
    case 'fog': body = `${cloud(0, -4, '#EEF1F3')}<g stroke="#8B98A3" stroke-width="1.8" stroke-linecap="round"><path d="M4 19 H20 M6 22 H18"/></g>`; break;
    case 'storm': body = `${cloud(0, -3, '#C9D1D8')}<path d="M13 16 l-3 5 h3 l-2 4 5-6 h-3 l2-3Z" fill="#F4C430" stroke="#7A5A0C" stroke-width="1"/>`; break;
    case 'flurries': case 'snow': body = `${cloud(0, -3)}${snowL}`; break;
    case 'sleet': case 'freezing_rain': body = `${cloud(0, -3)}${rainL}<circle cx="11" cy="23" r="1.2" fill="#8FB8D8"/>`; break;
    default: body = `${cloud(0, -3, '#DDE4EA')}${rainL}`;
  }
  return `<svg viewBox="0 0 24 26" aria-hidden="true">${body}</svg>`;
}

    const { rise, set } = sunCrossings(now, S.home.lat, S.home.lon);

  dayLine(j, live = false) {

  growthChart(S) {
    const pts = S.journal.map((j) => ({ n: j.n, s: j.size ?? 0.2 }));
    pts.push({ n: dayNumber(S), s: sizeFromGrowth(S.plant.growth) });
    const W = 320, H = 150, pad = { l: 34, r: 12, t: 16, b: 24 };
    const n0 = Math.min(...pts.map((p) => p.n)), n1 = Math.max(n0 + 6, ...pts.map((p) => p.n));
    const inch = S.settings.units === 'F';
    const unitLbl = inch ? 'inches' : 'cm';
    const toCm = (s) => sizeToCm(S.plant.species, s) / (inch ? 2.54 : 1);
    const maxCm = Math.max(2, ...pts.map((p) => toCm(p.s))) * 1.15;
    const X = (n) => pad.l + ((n - n0) / (n1 - n0)) * (W - pad.l - pad.r);
    const Y = (cm) => H - pad.b - (cm / maxCm) * (H - pad.t - pad.b);
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.n).toFixed(1)} ${Y(toCm(p.s)).toFixed(1)}`).join(' ');
    const area = `${line} L${X(pts[pts.length - 1].n).toFixed(1)} ${Y(0)} L${X(pts[0].n).toFixed(1)} ${Y(0)} Z`;
    const ticks = [0, maxCm / 2, maxCm].map((v) => `<g><line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="grid"/><text x="${pad.l - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text></g>`).join('');
    const last = pts[pts.length - 1];
    return el('div', { class: 'chart', html: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plant size by day">${ticks}
      <path d="${area}" class="area"/><path d="${line}" class="line"/>
      <circle cx="${X(last.n).toFixed(1)}" cy="${Y(toCm(last.s)).toFixed(1)}" r="4.5" class="dot"/>
      <text x="${pad.l}" y="${H - 6}">Day ${n0}</text><text x="${W - pad.r}" y="${H - 6}" text-anchor="end">Day ${n1}</text>
      <text x="${W - pad.r}" y="${pad.t - 2}" text-anchor="end" class="unit">${unitLbl}</text></svg>` });
  },

}

function fmtTemp(c, units) {
  return units === 'F' ? `${Math.round(c * 1.8 + 32)}°F` : `${Math.round(c)}°C`;
}
function fmtAgoShort(ms) {
  const m = Math.round(ms / MIN);
  if (m < 2) return 'now';
  if (m < 60) return `${m}m ago`;
  return `${Math.round(m / 60)}h ago`;
}

/* Height (or width for globes) in cm from the visual size. */
function sizeToCm(species, size) {
  const u = 6 / 94; // cm per plant unit (tiny pot is 6 cm)
  switch (species) {
    case 'barrel': return 2 * 112 * size * u;
    case 'oldlady': return 2 * 100 * size * 0.96 * u;
    case 'moon': return (30 + 70 * size + 2 * 0.9 * (16 + 60 * size)) * u;
    case 'saguaro': return (38 + 250 * Math.max(0, size - 0.2) / 0.8) * u;
    case 'bunny': return (2 * (24 + 42 * size)) * (1 + 0.7 * smoothstep(0.3, 0.9, size)) * u;
    case 'christmas': return (22 + 180 * size) * u;
    default: return 100 * size * u;
  }
}
function fmtSize(S) {
  const cm = sizeToCm(S.plant.species, sizeFromGrowth(S.plant.growth));
  return S.settings.units === 'F' ? `${(cm / 2.54).toFixed(1)} in` : `${cm.toFixed(1)} cm`;
}

// ---- audio.js ----
/* Tiny WebAudio synth. Off by default; only starts after the player turns it on. */

const Audio2 = {
  ctx: null,
  on: false,
  noise: null,
  rain: null,

  enable(on) {
    this.on = !!on;
    if (this.on) this.ensure();
    else this.setRain(0);
  },

  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },

  noiseBuf() {
    if (this.noise) return this.noise;
    const c = this.ctx, len = c.sampleRate * 2;
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    return b;
  },

  tone(freq, t0, dur, type = 'sine', vol = 0.12, slideTo = null) {
    const c = this.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  },

  hiss(t0, dur, { type = 'bandpass', freq = 1200, q = 0.8, vol = 0.2, attack = 0.05, sweep = null } = {}) {
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf();
    const f = c.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(freq, t0);
    if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t0 + dur);
    f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g).connect(c.destination);
    s.start(t0, Math.random());
    s.stop(t0 + dur + 0.05);
  },

  play(name) {
    if (!this.on) return;
    const c = this.ensure();
    if (!c) return;
    const t = c.currentTime + 0.01;
    switch (name) {
      case 'pour': this.hiss(t, 1.3, { freq: 900, q: 1.4, vol: 0.18, attack: 0.15 }); this.hiss(t + 0.1, 1.1, { freq: 2600, q: 2, vol: 0.05 }); break;
      case 'pick': this.tone(520, t, 0.08, 'triangle', 0.08, 700); break;
      case 'click': this.tone(880, t, 0.05, 'square', 0.04); break;
      case 'turn': this.hiss(t, 0.35, { type: 'highpass', freq: 1800, vol: 0.08, sweep: 600 }); this.tone(300, t, 0.2, 'triangle', 0.05, 220); break;
      case 'spritz': this.hiss(t, 0.18, { type: 'highpass', freq: 3500, vol: 0.12, attack: 0.01 }); break;
      case 'shine': [880, 1175, 1568].forEach((f, i) => this.tone(f, t + i * 0.08, 0.35, 'sine', 0.06)); break;
      case 'chime': [659, 784, 988, 1319].forEach((f, i) => this.tone(f, t + i * 0.09, 0.5, 'triangle', 0.07)); break;
      case 'pop': this.tone(660, t, 0.14, 'sine', 0.1, 330); break;
      case 'grow': [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, t + i * 0.07, 0.45, 'triangle', 0.06)); break;
      case 'thunder': this.hiss(t, 3.2, { type: 'lowpass', freq: 160, q: 0.5, vol: 0.5, attack: 0.25, sweep: 60 }); break;
      default: break;
    }
  },

  /* Soft rain ambience, level 0..1 */
  setRain(level) {
    if (!this.on || !this.ctx) {
      if (this.rain) { try { this.rain.src.stop(); } catch { /* already stopped */ } this.rain = null; }
      return;
    }
    const c = this.ctx;
    if (level > 0 && !this.rain) {
      const src = c.createBufferSource();
      src.buffer = this.noiseBuf();
      src.loop = true;
      const f = c.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.4;
      const g = c.createGain();
      g.gain.value = 0.0001;
      src.connect(f).connect(g).connect(c.destination);
      src.start();
      this.rain = { src, g };
    }
    if (this.rain) {
      this.rain.g.gain.setTargetAtTime(level > 0 ? 0.04 + level * 0.08 : 0.0001, c.currentTime, 0.8);
      if (level <= 0) {
        const r = this.rain;
        this.rain = null;
        setTimeout(() => { try { r.src.stop(); } catch { /* stopped */ } }, 3000);
      }
    }
  },
};

// ---- main.js ----
/* Game controller: boot, real-time ticking, weather, saving. */

const IDLE_LINES = {
  rain: ['Listen to that rain. I’m staying cozy in here.', 'Rainy day. Perfect for sitting still, my specialty.'],
  storm: ['Th-thunder! I’m fine. Totally fine.', 'Big storm out there. Glad I’m on this side of the glass.'],
  snow: ['Snow! Good thing I’m inside where it’s warm.', 'Look at it come down. Winter is my resting season.'],
  fog: ['Can’t see a thing out there.', 'Foggy. Very mysterious.'],
  clear: ['Soaking up the sun. This is the life.', 'Blue skies. My favourite.', 'Sunshine is my snack.'],
  cloudy: ['Clouds today. I’ll take what light I can get.', 'A grey day. Still cozy.'],
  night: ['Fun fact: cacti breathe at night to save water.', 'Night night.', 'Stars are out. Or at least I hope so.'],
  golden: ['Ooh, golden hour.', 'Look at that light.'],
  any: ['Tip: when in doubt, don’t water. Cacti forgive thirst more than soggy roots.', 'A quarter turn every few days keeps me growing straight.', 'I grow a little every day, even when you can’t tell.'],
};
const POKE_LINES = ['Ow! Spiky, remember?', 'Hehe, that tickles.', 'Careful, I’m prickly!', 'Hi there!', 'Boop.', 'Personal space, please.'];

const Game = {
  S: null,
  demo: false,
  wx: null,
  sky: null,
  mood: 'content',
  preview: null,
  showcase: null,
  pokeUntil: 0,
  lastFrame: 0,
  lastLight: 0,
  lastSay: 0,
  liveTimer: 0,
  catching: false,
  caught: [],
  pendingHome: null,

  async boot(hot = {}) {
    this.emit = this.emit.bind(this);
    UI.init();
    Scene.build();
    Tools.init();
    let S = hot.state || Store.loadLocal();
    if (S) this.adopt(S, { report: true });
    else this.showIntro();
    window.addEventListener('resize', debounce(() => { Scene.layout(); this.applyWeather(true); }, 120));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { this.save(true); return; }
      this.tick();
      if (this.S?.wx.mode === 'live' && Date.now() - (this.S.wx.current?.at || 0) > 25 * MIN) this.refreshLive();
    });
    window.addEventListener('pagehide', () => this.save(true));
    setInterval(() => this.tick(), 20000);
    setInterval(() => this.maybeSpeak(), 15000);
    this.loop();
    window.claude?.hot?.snapshot?.(() => ({ state: this.demo ? null : this.S }));

    // Cloud save (cross-device) and live weather arrive later, if this view supports them.
    Store.init().then((cloud) => {
      if (!cloud) { if (this.S && !this.demo) this.save(true); return; }
      const mine = this.demo ? null : this.S;
      if (!mine || (cloud.actedAt || cloud.createdAt) > (mine.actedAt || mine.createdAt)) {
        UI.closeModal();
        this.adopt(cloud, { report: true });
      } else this.save(true);
    });
    this.liveReady = Live.init();
    this.liveReady.then((ok) => {
      if (!ok && this.S?.wx.mode === 'live') { this.S.wx.mode = 'manual'; this.refresh(); }
      if (ok && this.S && !this.demo && this.S.wx.mode === 'live') this.refreshLive();
    });
  },

  /* Start from a saved game, catching the simulation up to now. */
  adopt(S, { report = false } = {}) {
    this.demo = false;
    this.S = S;
    S.home = S.home || guessHome();
    const away = Date.now() - (S.stats.lastVisit || S.sim.t);
    const before = { m0: S.plant.moisture, h0: S.plant.health, g0: S.plant.growth };
    this.catching = true;
    this.caught = [];
    simulate(S, Date.now(), (t, d) => this.emit(t, d));
    this.catching = false;
    S.stats.visits = (S.stats.visits || 0) + 1;
    S.stats.lastVisit = Date.now();
    Scene.layout();
    this.applyWeather(true);
    this.updateMood();
    Scene.renderPlant(S, this.mood, true);
    UI.render(S);
    Audio2.enable(S.settings.sound);
    this.visitBadges();
    if (report && away > 3 * HOUR) {
      UI.openReport({ away, m0: before.m0, h0: before.h0, dg: S.plant.growth - before.g0, events: this.caught });
    } else setTimeout(() => this.maybeSpeak(true), 1400);
    this.save(true);
  },

  /* Background scene for the very first visit (not saved). */
  showIntro() {
    this.demo = true;
    const S = newGame({ species: 'barrel', name: 'Goldie' });
    S.plant.growth = 22;
    S.plant.moisture = 40;
    S.wx.current = { cond: 'partly', tempC: climateTempC(Date.now(), S.home.lat), humidity: 60, cloud: 45, precip: 0, src: 'default', at: Date.now() };
    this.S = S;
    Scene.layout();
    this.applyWeather(true);
    this.mood = 'happy';
    Scene.renderPlant(S, this.mood, true);
    UI.render(S);
    UI.openWelcome();
  },

  plant({ species, name, color, facing, placeQuery }) {
    const home = guessHome();
    if (placeQuery) Object.assign(home, { query: placeQuery, name: placeQuery, guessed: false });
    const S = newGame({ species, name, color, facing, home });
    S.plant.moisture = 5;
    S.plant.dryHours = 0;
    S.actedAt = Date.now();
    this.demo = false;
    this.S = S;
    unlock(S, 'planted', null);
    UI.closeModal();
    Scene.layout();
    this.applyWeather(true);
    this.updateMood();
    Scene.renderPlant(S, 'happy', true);
    Scene.el.plant.classList.add('planting');
    setTimeout(() => Scene.el.plant.classList.remove('planting'), 1400);
    FX.sparkle(Scene.potTop().x, Scene.potTop().y - 30, '#FFE27A', 18);
    Audio2.play('grow');
    UI.render(S);
    this.save(true);
    setTimeout(() => UI.say(`Hi! I’m ${S.plant.name}. My soil is dry — could I get a drink? Drag the watering can onto my pot, or just tap it.`, 9000), 1100);
    if (placeQuery) (this.liveReady || Promise.resolve(false)).then((ok) => { if (ok) this.goLive(placeQuery, false); });
  },

  reset() {
    Store.clearLocal();
    Store.clearCloud();
    UI.closeModal();
    setTimeout(() => this.showIntro(), 260);
  },

  /* ---------- events from the simulation ---------- */
  emit(type, data) {
    const S = this.S;
    if (!S) return;
    const name = S.plant.name;
    const push = (text, tone = 'info', big = false) => {
      if (this.catching) this.caught.push(text);
      else UI.toast(text, big ? 'big' : tone);
    };
    switch (type) {
      case 'stage':
        push(`${name} reached the ${STAGES[data].name} stage!`, 'good', true);
        if (!this.catching) { FX.sparkle(Scene.potTop().x, Scene.potTop().y - 80, '#FFE27A', 22); Audio2.play('grow'); Scene.squish(); }
        break;
      case 'bud': push(`Flower buds on ${name}! Keep the care steady.`, 'good', true); break;
      case 'bloom':
        push(`${name} is blooming!`, 'good', true);
        if (!this.catching) { FX.sparkle(Scene.potTop().x, Scene.potTop().y - 120, '#FF8FB1', 26); Audio2.play('chime'); }
        break;
      case 'pests': push('Mealybugs spotted! Dab them off with the swab.', 'warn'); break;
      case 'pup': push(`A baby offset appeared on ${name}.`, 'good'); break;
      case 'rootbound': push('The roots have filled the pot. Time to repot.', 'warn'); break;
      case 'day': if (!this.catching) UI.toast(`Day ${data} on the windowsill.`, 'info'); break;
      case 'ach': {
        const a = ACHIEVEMENTS[data];
        const pot = Object.entries(POT_STYLES).find(([, p]) => p.unlock === data);
        push(`Badge: ${a.name}${pot ? ` · ${pot[1].name} pot unlocked` : ''}`, 'good');
        if (!this.catching) Audio2.play('chime');
        break;
      }
      default: break;
    }
  },

  afterAction(res) {
    const S = this.S;
    if (!S || this.demo) return;
    S.actedAt = Date.now();
    this.coach();
    if (res?.text) UI.toast(res.text, res.tone || 'info');
    this.updateMood();
    if (res?.tone === 'good' && this.mood !== 'thirsty') { this.pokeMood = 'happy'; this.pokeUntil = Date.now() + 2500; this.updateMood(); }
    Scene.renderPlant(S, this.mood);
    Scene.updateLight();
    UI.render(S);
    this.save(true);
  },

  /* Gentle first-session tips, each shown once. */
  coach() {
    const S = this.S;
    S.tips = S.tips || {};
    const once = (id, ms, text) => {
      if (S.tips[id]) return;
      S.tips[id] = Date.now();
      setTimeout(() => UI.say(text, 8000), ms);
    };
    if (S.stats.waterings >= 1) once('afterWater', 1800, 'Thank you! Now I need to dry out completely before the next drink. I grow a little every day, so come back tomorrow.');
    else return;
    if (S.tips.afterWater && Date.now() - S.tips.afterWater > 20000) once('meterTip', 600, 'Not sure if I’m thirsty? The moisture meter tells you exactly how wet my soil is.');
  },

  poke() {
    if (!this.S) return;
    this.pokeMood = 'ouch';
    this.pokeUntil = Date.now() + 1300;
    this.updateMood();
    Scene.renderPlant(this.S, this.mood);
    Scene.squish();
    Audio2.play('pop');
    const top = needs(this.S, Date.now(), this.wx)[0];
    UI.say(top && Math.random() < 0.6 ? top.text : POKE_LINES[Math.floor(Math.random() * POKE_LINES.length)], 3600);
  },

  updateMood() {
    if (!this.S) return;
    const phase = this.sky?.phase || 'day';
    this.mood = this.pokeUntil > Date.now() ? this.pokeMood : moodOf(this.S, Date.now(), phase === 'night' ? 'night' : 'day');
  },

  idleLine() {
    const w = this.wx, ph = this.sky?.phase;
    let key = 'any';
    if (ph === 'night') key = 'night';
    else if ((ph === 'sunset' || ph === 'sunrise') && w && SUNNY.has(w.cond)) key = 'golden';
    else if (w) key = WET.has(w.cond) ? 'rain' : w.cond === 'storm' ? 'storm' : SNOWY.has(w.cond) ? 'snow' : w.cond === 'fog' ? 'fog' : ['cloudy', 'overcast'].includes(w.cond) ? 'cloudy' : 'clear';
    const pool = IDLE_LINES[key].concat(IDLE_LINES.any);
    const i = Math.floor(Date.now() / (10 * MIN)) % pool.length;
    return pool[i];
  },

  maybeSpeak(force = false) {
    if (!this.S || this.demo || UI.modalOpen() || Tools.drag || document.hidden) return;
    const now = Date.now();
    if (!force && now - this.lastSay < 55000) return;
    const top = needs(this.S, now, this.wx)[0];
    if (!top && !force && Math.random() < 0.6) return;
    this.lastSay = now;
    UI.say(top ? top.text : this.idleLine());
  },

  /* ---------- time ---------- */
  tick() {
    const S = this.S;
    if (!S) return;
    if (!this.demo) {
      simulate(S, Date.now(), (t, d) => this.emit(t, d));
      S.stats.lastVisit = Date.now();
    }
    const phase = skyPhase(Date.now(), S.home.lat, S.home.lon).phase;
    if (!this.preview && phase !== this.sky?.phase) this.applyWeather();
    else if (Date.now() - this.lastLight > 60000) { this.lastLight = Date.now(); Scene.updateLight(); }
    this.updateMood();
    Scene.renderPlant(S, this.mood);
    UI.render(S);
    if (!this.demo) Store.saveLocal(S);
  },

  loop() {
    const frame = (ts) => {
      const now = Date.now();
      const dt = Math.min(0.1, (ts - (this.lastFrame || ts)) / 1000);
      this.lastFrame = ts;
      if (!document.hidden && Room.L) {
        const p = Scene.parallax;
        p.x += (p.tx - p.x) * 0.06;
        p.y += (p.ty - p.y) * 0.06;
        Scene.el.outside.style.setProperty('--px', `${p.x.toFixed(2)}px`);
        Scene.el.outside.style.setProperty('--py', `${p.y.toFixed(2)}px`);
        if (FX.active()) { FX.frame(now, dt); this.fxIdle = false; }
        else if (!this.fxIdle) { FX.frame(now, dt); this.fxIdle = true; }
        if (this.preview && now > this.preview.until) this.endPreview();
        if (this.pokeUntil && now > this.pokeUntil) {
          this.pokeUntil = 0;
          this.updateMood();
          Scene.renderPlant(this.S, this.mood);
        }
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  },

  /* ---------- weather ---------- */
  currentWeather() {
    const S = this.S;
    if (this.preview) {
      const c = this.preview.cond;
      return { cond: c, label: CONDITIONS[c].label, tempC: S.wx.current?.tempC ?? 12, humidity: 70, cloud: CONDITIONS[c].cloud, precip: CONDITIONS[c].precip, src: 'preview' };
    }
    const cur = S.wx.current;
    if (cur) return cur;
    return { cond: 'partly', label: 'Partly cloudy', tempC: climateTempC(Date.now(), S.home.lat), humidity: 60, cloud: 45, precip: 0, src: 'default', at: Date.now() };
  },

  applyWeather(instant = false) {
    const S = this.S;
    if (!S) return;
    const now = Date.now();
    const sp = skyPhase(now, S.home.lat, S.home.lon);
    const phase = this.preview?.phase && this.preview.phase !== 'day' ? this.preview.phase : this.preview ? 'day' : sp.phase;
    this.sky = { ...sp, phase };
    this.wx = this.currentWeather();
    const scene = chooseScene(this.wx.cond, phase, seasonOf(now, S.home.lat), dayKey(now));
    Scene.setSky(scene, instant);
    FX.setWeather(this.wx, scene.grade, S);
    Scene.updateLight(true);
    this.lastLight = now;
    Audio2.setRain(Audio2.on ? FX.rainI : 0);
    this.updateMood();
    Scene.renderPlant(S, this.mood);
    UI.render(S);
    if (!this.preview) this.visitBadges();
  },

  logWeather(entry) {
    const log = this.S.wx.log;
    const last = log[log.length - 1];
    if (last && last.cond === entry.cond && Math.abs((last.tempC ?? 0) - (entry.tempC ?? 0)) < 0.6 && entry.t - last.t < 20 * MIN) return;
    log.push(entry);
    const cutoff = Date.now() - 6 * DAY;
    while (log.length && (log[0].t < cutoff || log.length > 300)) log.shift();
  },

  setManual(cond) {
    const S = this.S;
    if (!S || this.demo) return;
    this.stopPreview();
    const prev = S.wx.current;
    const tempC = prev?.tempC ?? climateTempC(Date.now(), S.home.lat);
    S.wx.mode = 'manual';
    S.wx.current = { cond, label: CONDITIONS[cond].label, tempC, humidity: WET.has(cond) || cond === 'fog' ? 88 : 60, cloud: CONDITIONS[cond].cloud, precip: CONDITIONS[cond].precip, src: 'manual', at: Date.now() };
    this.logWeather({ t: Date.now(), cond, tempC, cloud: CONDITIONS[cond].cloud, precip: CONDITIONS[cond].precip, humidity: S.wx.current.humidity, src: 'manual' });
    this.applyWeather();
    UI.toast(`Sky set to ${CONDITIONS[cond].label.toLowerCase()}.`, 'info');
    this.save(true);
  },

  setManualTemp(c) {
    const S = this.S;
    if (!S || this.demo) return;
    if (!S.wx.current) this.setManual('partly');
    S.wx.current.tempC = c;
    if (S.wx.mode !== 'live') S.wx.current.src = 'manual';
    const cur = S.wx.current;
    this.logWeather({ t: Date.now(), cond: cur.cond, tempC: c, cloud: cur.cloud, precip: cur.precip, humidity: cur.humidity, src: cur.src });
    this.applyWeather();
    this.save(true);
  },

  async goLive(query, quiet = false) {
    const S = this.S;
    if (!S || this.demo) return;
    if (query) Object.assign(S.home, { query, name: query, guessed: false, key: S.home.query === query ? S.home.key : null });
    S.wx.mode = 'live';
    await this.refreshLive(quiet);
  },

  async refreshLive(quiet = false) {
    const S = this.S;
    if (!S || this.demo || !Live.mcp || this.liveBusy) return;
    this.liveBusy = true;
    clearTimeout(this.liveTimer);
    Live.state = 'loading';
    Live.message = 'Checking AccuWeather…';
    try {
      const q = S.home.query || (S.home.guessed ? S.home.name : S.home.name);
      const { weather, place } = await Live.fetchCurrent({ query: q, lat: S.home.lat, lon: S.home.lon, key: S.home.key });
      Object.assign(S.home, { key: place.key || S.home.key, name: place.name || S.home.name, region: place.region || '' });
      if (place.lat != null && place.lon != null) { S.home.lat = place.lat; S.home.lon = place.lon; }
      S.wx.mode = 'live';
      S.wx.current = { ...weather, src: 'live', at: Date.now() };
      this.logWeather({ t: Date.now(), cond: weather.cond, tempC: weather.tempC, cloud: weather.cloud, precip: weather.precip, humidity: weather.humidity, src: 'live' });
      Live.state = 'live';
      Live.message = `Live from AccuWeather for ${S.home.name}. Updates every 30 minutes.`;
      this.applyWeather();
      if (!quiet) UI.toast(`Live weather: ${CONDITIONS[weather.cond].label.toLowerCase()} in ${S.home.name}.`, 'good');
      this.save(true);
    } catch (e) {
      Live.state = 'error';
      Live.message = Live.errorText(e, S.home.query || S.home.name);
      if (!S.wx.current || Date.now() - (S.wx.current.at || 0) > 3 * HOUR) S.wx.mode = 'manual';
      if (!quiet) UI.toast(Live.message, 'warn');
      this.refresh();
    } finally {
      this.liveBusy = false;
      if (S.wx.mode === 'live') this.liveTimer = setTimeout(() => this.refreshLive(true), 30 * MIN);
    }
  },

  /* ---------- previews ---------- */
  startPreview(cond, phase = 'day', ms = 12000) {
    this.preview = { cond, phase, until: Date.now() + ms };
    this.applyWeather();
  },
  endPreview() {
    if (this.showcase?.length) {
      const [c, ph] = this.showcase.shift();
      this.startPreview(c, ph, 5200);
      UI.toast(`${CONDITIONS[c].label}${ph !== 'day' ? ` · ${ph}` : ''}`, 'info');
      return;
    }
    this.stopPreview();
  },
  stopPreview() {
    if (!this.preview && !this.showcase) return;
    this.preview = null;
    this.showcase = null;
    FX.snowDepth = 0;
    FX.drops = [];
    this.applyWeather();
  },
  playShowcase() {
    this.showcase = [['clear', 'day'], ['partly', 'day'], ['cloudy', 'day'], ['fog', 'day'], ['rain', 'day'], ['storm', 'day'], ['snow', 'day'], ['clear', 'sunset'], ['clear', 'dusk'], ['clear', 'night'], ['rain', 'night']];
    this.preview = { cond: 'clear', phase: 'day', until: 0 };
    this.endPreview();
  },

  /* ---------- window & curtain ---------- */
  toggleWindow() {
    const S = this.S;
    if (!S || this.demo) return;
    S.env.windowOpen = S.env.windowOpen > 0.05 ? 0 : 0.6;
    Scene.repaintWindow();
    this.windowChanged();
  },
  windowChanged() {
    const S = this.S;
    if (!S || this.demo) return;
    Audio2.play('turn');
    const w = this.wx;
    if (S.env.windowOpen > 0.05) {
      const mild = w && w.tempC != null && w.tempC >= 15 && w.tempC <= 29 && !WET.has(w.cond) && w.cond !== 'storm' && !SNOWY.has(w.cond);
      if (mild) unlock(S, 'freshAir', this.emit.bind(this));
      UI.toast(mild ? 'Window open. Fresh air helps keep pests away.' : 'Window open. Keep an eye on the weather.', mild ? 'good' : 'info');
    } else UI.toast('Window closed.', 'info');
    this.afterAction(null);
  },
  toggleCurtain() {
    const S = this.S;
    if (!S || this.demo) return;
    S.env.curtain = !S.env.curtain;
    Audio2.play('click');
    this.afterAction({ tone: 'info', text: S.env.curtain ? 'Sheer curtain drawn. It softens harsh sun.' : 'Curtain open. Full light again.' });
  },

  /* Badges for visiting in real weather */
  visitBadges() {
    const S = this.S;
    if (!S || this.demo || this.preview) return;
    const live = S.wx.mode === 'live' && S.wx.current?.src === 'live' && Date.now() - S.wx.current.at < 2 * HOUR;
    const c = S.wx.current?.cond;
    const em = this.emit.bind(this);
    if (live && c) {
      if (WET.has(c)) unlock(S, 'rainBuddy', em);
      if (SNOWY.has(c)) unlock(S, 'snowDay', em);
      if (c === 'storm') unlock(S, 'stormWatch', em);
    }
    const now = Date.now();
    const ph = skyPhase(now, S.home.lat, S.home.lon).phase;
    if (ph === 'night' && c && ['clear', 'mostly_clear'].includes(c) && (live || S.wx.mode === 'manual')) unlock(S, 'stargazer', em);
    const { rise } = sunCrossings(now, S.home.lat, S.home.lon);
    if (rise && Math.abs(now - rise) < 50 * MIN) unlock(S, 'earlyBird', em);
  },

  refresh() {
    if (!this.S) return;
    this.applyWeather();
  },

  save(cloud = false) {
    const S = this.S;
    if (!S || this.demo) return;
    Store.saveLocal(S);
    if (cloud) Store.saveCloud(S);
  },
};

if (/debug/.test(location.hash)) window.__cactus = { Game, Scene, FX, Room, Store, Live };

function start(hot) {
  Game.boot(hot || {}).catch((e) => console.error(e));
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => (window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {})));
} else {
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}

})();</script>
